<!DOCTYPE html>
<html lang="fa" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1033"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Code Flex</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0620;overflow:hidden}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;color:#f5f0dc;-webkit-font-smoothing:none;font-smooth:never}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;max-height:960px;margin:0 auto;overflow:hidden;background:#1a1033;box-shadow:0 0 0 4px #0d0620,0 0 40px #000}
#bg{position:absolute;inset:0;width:100%;height:100%}
#scr{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.mono{font-family:"Courier New",Consolas,monospace}

/* buttons */
.pb{font:inherit;font-weight:800;font-size:13px;color:#2a1000;background:#ffd24a;border:3px solid #0d0620;border-radius:0;
 box-shadow:inset 0 -4px 0 #d99a1e,inset 0 3px 0 #fff3a8,0 4px 0 #0d0620;padding:8px 8px;cursor:pointer;touch-action:manipulation;line-height:1.35}
.pb:active{transform:translateY(3px);box-shadow:inset 0 -4px 0 #d99a1e,inset 0 3px 0 #fff3a8,0 1px 0 #0d0620}
.pb.cy{background:#4de1ff;box-shadow:inset 0 -4px 0 #1fa6c9,inset 0 3px 0 #c4f6ff,0 4px 0 #0d0620}
.pb.cy:active{box-shadow:inset 0 -4px 0 #1fa6c9,inset 0 3px 0 #c4f6ff,0 1px 0 #0d0620}
.pb.pk{background:#ff6ec7;box-shadow:inset 0 -4px 0 #c93d96,inset 0 3px 0 #ffc2ea,0 4px 0 #0d0620}
.pb.pk:active{box-shadow:inset 0 -4px 0 #c93d96,inset 0 3px 0 #ffc2ea,0 1px 0 #0d0620}
.pb.gr{background:#5cff8f;box-shadow:inset 0 -4px 0 #25b858,inset 0 3px 0 #c8ffd9,0 4px 0 #0d0620}
.pb.gr:active{box-shadow:inset 0 -4px 0 #25b858,inset 0 3px 0 #c8ffd9,0 1px 0 #0d0620}
.pb.gy{background:#b9aee0;box-shadow:inset 0 -4px 0 #8274b8,inset 0 3px 0 #e6e0ff,0 4px 0 #0d0620}
.pb.dis{filter:grayscale(1) brightness(.55);pointer-events:none}
.panel{background:#2a1850;border:3px solid #0d0620;box-shadow:0 0 0 3px #7a4fd1,0 6px 0 3px #0d0620}

/* ---------- MENU ---------- */
.menu{padding:10px 14px 8px;gap:8px;overflow-y:auto}
.mtop{display:flex;justify-content:space-between;align-items:flex-start;height:78px;flex:none;direction:ltr}
.langsw{display:flex;border:3px solid #0d0620;box-shadow:0 0 0 3px #7a4fd1,0 4px 0 3px #0d0620;background:#2a1850;cursor:pointer;margin:4px 0 0 4px;font-weight:900;font-size:13px;font-family:"Courier New",monospace}
.langsw span{padding:8px 10px;color:#8e7fc4;transition:none}
.langsw span.on{background:#ffd24a;color:#2a1000}
.lvl{display:flex;flex-direction:column;align-items:center;cursor:pointer;gap:3px}
.ring{width:62px;height:62px;border-radius:50%;background:radial-gradient(#4a2c8a,#241247);border:4px solid #ffd24a;box-shadow:0 0 0 3px #0d0620,0 0 14px #ffd24a88;overflow:hidden;display:flex;align-items:center;justify-content:center;animation:glow 1.4s steps(2) infinite}
.ring img{width:36px;height:50px;margin-top:6px}
.lvl b{font:900 12px "Courier New",monospace;background:#0d0620;color:#ffd24a;padding:1px 7px;border:2px solid #ffd24a}
@keyframes glow{50%{box-shadow:0 0 0 3px #0d0620,0 0 22px #ffd24a}}
.logowrap{display:flex;justify-content:center;flex:none;position:relative;margin-top:-4px}
#logo{width:232px;height:auto;animation:bobl 1.6s steps(4) infinite}
@keyframes bobl{50%{transform:translateY(-5px)}}
.spark{position:absolute;width:6px;height:6px;background:#fff;animation:blink 1.2s steps(2) infinite}
.mbtns{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.mcard{display:flex;align-items:center;gap:12px;direction:ltr;text-align:left;padding:7px 12px;background:#2f1b5c;border:3px solid #0d0620;box-shadow:0 0 0 3px #7a4fd1,0 5px 0 3px #0d0620;color:#fff;cursor:pointer;font:inherit;width:100%;margin-bottom:3px}
.mcard:active{transform:translateY(3px);box-shadow:0 0 0 3px #7a4fd1,0 2px 0 3px #0d0620}
.mcard img{width:38px;height:38px;animation:bob 1.1s steps(3) infinite}
.mcard:nth-child(2) img{animation-delay:.2s}.mcard:nth-child(3) img{animation-delay:.4s}.mcard:nth-child(4) img{animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.mcard .nm{font:900 18px "Courier New",monospace;flex:1;letter-spacing:1px}
.mcard .pr{font:800 12px "Courier New",monospace;color:#ffd24a;background:#0d0620;padding:3px 7px}
.mcard.gold{background:#5a3a0a;box-shadow:0 0 0 3px #ffd24a,0 5px 0 3px #0d0620}
.mcard.git{background:#1d3a5a;box-shadow:0 0 0 3px #4de1ff,0 5px 0 3px #0d0620}
.mcard .nm.fa{font-family:Tahoma,sans-serif;letter-spacing:0;font-size:16px}
.made{margin-top:auto;text-align:center;font:800 12px "Courier New",monospace;color:#b9aee0;padding:4px 0;letter-spacing:1px}

/* ---------- generic top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#241247;border-bottom:4px solid #0d0620;flex:none;direction:ltr}
.bar .ttl{flex:1;font-weight:900;font-size:15px;text-align:center}
.bar .sp{width:70px}
.bar .pb{padding:5px 10px;font-size:12px}
.scroll{overflow-y:auto;flex:1;padding:14px}
.screen.solid{background:linear-gradient(#1d0f3b,#150a2c)}

/* lessons list */
.lcard{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 14px;width:84%;background:#2f1b5c;border:3px solid #0d0620;box-shadow:0 0 0 3px #7a4fd1,0 5px 0 3px #0d0620;cursor:pointer;font:inherit;color:#fff;text-align:start}
.lcard.alt{margin-inline-start:auto}
.chap{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;padding:6px 10px;background:#0d0620;border-inline-start:6px solid #ffd24a;font-size:13px}
.chap b{color:#ffd24a;font-weight:900}
.chap em.lvb{font-style:normal;font:900 11px "Courier New",monospace;padding:2px 7px;margin-inline:8px;border:2px solid #0d0620;color:#0d0620}
.chap em.b{background:#6bd36b}.chap em.i{background:#4de1ff}.chap em.a{background:#ff7aa8}
.chap span{font:900 12px "Courier New",monospace;color:#4de1ff}
.lcard .num{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#ffd24a;color:#2a1000;font:900 15px "Courier New",monospace;border:3px solid #0d0620;flex:none}
.lcard .lt{flex:1;font-weight:800;font-size:14px}
.lcard .st{font-size:20px;flex:none;width:26px;height:26px}
.lcard.cur{box-shadow:0 0 0 3px #5cff8f,0 5px 0 3px #0d0620;animation:pulse 1s steps(2) infinite}
.lcard.lock{opacity:.55;background:#241247}
.lcard.lock .num{background:#6b5fa0}
.lcard.done .num{background:#5cff8f}
@keyframes pulse{50%{transform:translateY(-2px)}}

/* ---------- LESSON ---------- */
.lesson{display:flex;flex-direction:column}
.top,.bottom{height:50%;display:flex;flex-direction:column;min-height:0}
.top{background:#120826;border-bottom:5px solid #ffd24a;box-shadow:0 5px 0 #0d0620}
.tophead{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#241247;border-bottom:3px solid #0d0620;flex:none;direction:ltr;height:34px}
.tophead .x{font:900 12px "Courier New",monospace;background:#ff5a6e;color:#fff;border:2px solid #0d0620;padding:2px 8px;cursor:pointer}
.tophead .tt{flex:1;font-weight:800;font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:auto}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;background:#4b3a85;border:1px solid #0d0620}
.dots i.on{background:#ffd24a}
.code{flex:1;overflow:auto;margin:0;padding:8px 10px;font:13px/1.55 "Courier New",Consolas,monospace;direction:ltr;text-align:left;white-space:pre;color:#e9e4ff;min-height:0;tab-size:2}
.code .k{color:#ff6ec7}.code .s{color:#8dffa8}.code .c{color:#7d6fb0;font-style:italic}.code .n{color:#ffd24a}.code .t{color:#4de1ff}.code .a{color:#ffb86b}
.out{flex:none;height:27%;min-height:62px;background:#0a0418;border-top:3px solid #0d0620;display:flex;flex-direction:column;overflow:hidden}
.out .lab{font:900 10px "Courier New",monospace;color:#0d0620;background:#4de1ff;padding:1px 8px;align-self:flex-start}
.out pre{margin:0;padding:4px 10px;font:13px/1.45 "Courier New",monospace;color:#5cff8f;overflow:auto;flex:1;direction:ltr;text-align:left;white-space:pre-wrap}
.out pre.err{color:#ff8a98}
.out iframe{flex:1;border:0;background:#fff;width:100%}
.topbtns,.botbtns{display:flex;gap:8px;padding:6px 8px;flex:none;direction:ltr;background:#241247}
.topbtns .pb,.botbtns .pb{flex:1;font-size:12px;padding:6px 4px}
.topbtns .pb.one{flex:none;margin-left:auto}
.spc{flex:1}
.editor{flex:1;width:100%;resize:none;border:0;outline:0;margin:0;padding:8px 10px;background:#120826;color:#fff;font:14px/1.5 "Courier New",Consolas,monospace;direction:ltr;text-align:left;min-height:0;caret-color:#ffd24a}
.chips{display:flex;gap:4px;padding:3px 6px;background:#1c0f3a;overflow-x:auto;flex:none;direction:ltr}
.chips b{font:900 14px "Courier New",monospace;background:#3b2570;border:2px solid #0d0620;padding:0 9px;min-width:28px;text-align:center;cursor:pointer;color:#ffd24a;line-height:22px;white-space:pre}
.chips b:active{background:#ffd24a;color:#000}
.bottom{background:linear-gradient(#2a1850,#1f1040)}
.explain{flex:1;overflow-y:auto;padding:12px 14px;font-size:15px;line-height:1.85;min-height:0}
.explain h4{margin:0 0 6px;color:#ffd24a;font-size:14px}
.explain .tag{display:inline-block;font:900 11px "Courier New",monospace;background:#ff6ec7;color:#2a0020;padding:1px 7px;margin-bottom:6px;border:2px solid #0d0620}
.explain .hintbox{background:#0d0620;border-inline-start:4px solid #4de1ff;padding:6px 10px;margin-top:8px;font-size:13px}
.explain .hintbox pre{margin:4px 0 0;font:12px "Courier New",monospace;direction:ltr;text-align:left;color:#8dffa8;white-space:pre-wrap}
.res{margin-top:8px;padding:8px 10px;border:3px solid #0d0620;font-weight:800;font-size:14px}
.res.good{background:#1f6b3c;box-shadow:0 0 0 2px #5cff8f}
.res.bad{background:#6b1f2e;box-shadow:0 0 0 2px #ff5a6e}
.miniact{display:flex;gap:6px;margin-top:8px;direction:ltr;flex-wrap:wrap}
.miniact .pb{font-size:11px;padding:4px 8px}
.rtl{direction:rtl;text-align:right}.ltr{direction:ltr;text-align:left}

/* ---------- QUIZ ---------- */
.qbox{font-size:16px;font-weight:800;line-height:1.7;padding:12px;margin-bottom:14px}
.opt{display:block;width:100%;margin-bottom:12px;padding:11px 12px;background:#2f1b5c;border:3px solid #0d0620;box-shadow:0 0 0 3px #7a4fd1,0 4px 0 3px #0d0620;color:#fff;font:700 14px "Courier New",Tahoma,monospace;text-align:start;cursor:pointer;direction:auto}
.opt.good{background:#1f6b3c;box-shadow:0 0 0 3px #5cff8f,0 4px 0 3px #0d0620}
.opt.bad{background:#6b1f2e;box-shadow:0 0 0 3px #ff5a6e,0 4px 0 3px #0d0620}
.pbar{height:14px;background:#0d0620;border:3px solid #0d0620;box-shadow:0 0 0 2px #7a4fd1;margin:2px 0 12px}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#5cff8f 0 8px,#3fd16f 8px 10px)}
.big{font:900 40px "Courier New",monospace;color:#ffd24a;text-align:center;text-shadow:3px 3px 0 #0d0620}
.center{text-align:center}
.scanrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.scanrow i{font-style:normal;font-size:16px}

/* ---------- MODAL / TOAST ---------- */
#modal{position:absolute;inset:0;background:#0d0620cc;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.show{display:flex}
.mbox{width:100%;max-height:92%;overflow-y:auto;padding:14px}
.chrow{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:10px;background:#3b2570;border:3px solid #0d0620;cursor:pointer;direction:ltr;text-align:start}
.chrow.sel{box-shadow:0 0 0 3px #5cff8f}
.chrow.lk{opacity:.5;filter:grayscale(.8);cursor:default}
.chrow .av{width:52px;height:52px;border-radius:50%;background:radial-gradient(#4a2c8a,#241247);border:3px solid #ffd24a;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.chrow .av img{width:30px;height:42px;margin-top:6px}
.chrow .tx{flex:1;direction:auto;font-weight:800;font-size:14px}.chrow .tx small{display:block;color:#b9aee0;font-weight:600;font-size:11px}
.chrow .lv{font:900 11px "Courier New",monospace;background:#0d0620;color:#ffd24a;padding:2px 6px}
.xpbar{height:16px;background:#0d0620;border:3px solid #0d0620;box-shadow:0 0 0 2px #ffd24a;margin:8px 0 4px;direction:ltr}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#ffd24a 0 8px,#e0a91c 8px 10px)}
.bigav{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;background:radial-gradient(#4a2c8a,#241247);border:5px solid #ffd24a;box-shadow:0 0 0 3px #0d0620,0 0 18px #ffd24a88;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:glow 1.4s steps(2) infinite}
.bigav img{width:56px;height:78px;margin-top:10px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#0d0620;color:#ffd24a;border:3px solid #ffd24a;padding:8px 14px;font-weight:800;font-size:13px;z-index:30;display:none;max-width:88%;text-align:center}
.conf{position:absolute;width:8px;height:8px;z-index:25;pointer-events:none;animation:fall 1.4s steps(14) forwards}
@keyframes fall{to{transform:translate(var(--dx),420px) rotate(360deg);opacity:0}}
@keyframes blink{50%{opacity:0}}

/* ---------- GIT GUIDE ---------- */
.gslide{padding:12px 14px;overflow-y:auto;flex:1}
.gdiag{background:#120826;border:3px solid #0d0620;box-shadow:0 0 0 3px #4de1ff;padding:14px 6px;margin:6px 4px 16px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;direction:ltr;min-height:130px}
.gbox{background:#3b2570;border:3px solid #0d0620;box-shadow:0 0 0 2px #7a4fd1;padding:7px 6px;text-align:center;min-width:72px;font-size:11px;color:#fff;font-family:Tahoma,sans-serif}
.gbox b{display:block;font:900 12px "Courier New",monospace;color:#ffd24a;margin-bottom:2px}
.gbox.cy b{color:#4de1ff}.gbox.gr b{color:#5cff8f}.gbox.pk b{color:#ff6ec7}
.gbox img{display:block;margin:0 auto 4px}
.garr{display:flex;flex-direction:column;align-items:center;font:800 10px "Courier New",monospace;color:#ffd24a;gap:3px;min-width:40px}
.garr s{display:block;width:34px;height:8px;background:repeating-linear-gradient(90deg,#ffd24a 0 6px,transparent 6px 10px);position:relative;text-decoration:none;animation:march .5s steps(2) infinite}
.garr s:after{content:'';position:absolute;right:-7px;top:-4px;border-left:8px solid #ffd24a;border-top:8px solid transparent;border-bottom:8px solid transparent}
.garr.rev{transform:scaleX(-1)}.garr.rev em{display:block;transform:scaleX(-1);font-style:normal}
.garr em{font-style:normal}
@keyframes march{to{background-position:10px 0}}
.gstack{display:flex;flex-direction:column;gap:6px;align-items:center}
.gtl{display:grid;grid-template-columns:repeat(7,36px);gap:0;align-items:center;justify-items:center}
.gd{width:18px;height:18px;border:3px solid #0d0620;background:#ffd24a}
.gd.f{background:#4de1ff}.gd.h{background:#ff6ec7;animation:pulse .8s steps(2) infinite}
.gl{height:4px;width:100%;background:#ffd24a}
.gt{font:900 16px "Courier New",monospace;color:#4de1ff}
.legend{display:flex;gap:10px;font:800 11px "Courier New",monospace;width:100%;justify-content:center;margin-top:6px}
.legend b{padding:1px 6px;color:#0d0620}
.gcmd{background:#0a0418;border:3px solid #0d0620;box-shadow:0 0 0 2px #5cff8f;padding:8px 10px;margin:8px 4px;font:12px/1.6 "Courier New",monospace;color:#8dffa8;direction:ltr;text-align:left;white-space:pre-wrap}
.gtxt{font-size:14.5px;line-height:1.85;padding:0 4px}
.gtxt h4{margin:0 0 4px;color:#ffd24a;font-size:15px}
.numb{display:inline-block;background:#ff6ec7;color:#2a0020;font:900 11px "Courier New",monospace;padding:0 5px;margin-bottom:3px;border:2px solid #0d0620}
@media (max-height:640px){.menu{gap:5px}.mcard img{width:32px;height:32px}.mbtns{gap:6px}#logo{width:180px}}

.mright{display:flex;align-items:flex-start;gap:10px}
.gearbtn{background:#2a1850;border:3px solid #0d0620;box-shadow:0 0 0 3px #7a4fd1,0 4px 0 3px #0d0620;width:44px;height:44px;margin-top:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.gearbtn img{width:30px;height:27px}
.gearbtn:active{transform:translateY(2px)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 6px;border-bottom:2px dashed #4a3a8a;font-weight:800}
.sw{display:flex;align-items:center;gap:6px;border:3px solid #0d0620;background:#4a3a6a;color:#c9bff0;padding:4px 8px;font:900 12px "Courier New",monospace;min-width:74px;cursor:pointer;justify-content:space-between}
.sw i{width:14px;height:14px;background:#8e7fc4;display:block}
.sw.on{background:#2f9d4a;color:#fff}.sw.on i{background:#ffd24a}

<body><div id="app"><canvas id="bg"></canvas><div id="scr"></div><div id="modal"></div><div id="toast"></div></div>
<script>/* ================= CODE FLEX ENGINE (JS / Node) ================= */
const LANGS=['py','node','html','js'];
const LN={py:'Python',node:'Node.js',html:'HTML',js:'JavaScript'};

/* ---------- util.inspect clone (follows Node's algorithm) ---------- */
function jsQuote(s){
  if(!s.includes("'"))return "'"+s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/\t/g,'\\t').replace(/\r/g,'\\r')+"'";
  if(!s.includes('"'))return '"'+s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/\t/g,'\\t')+'"';
  if(!s.includes('`')&&!s.includes('${'))return '`'+s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n')+'`';
  return "'"+s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')+"'";
}
function jsGroup(ctx,output,value){
  let total=0,maxLen=0,i=0,outLen=output.length;
  if(ctx.hasMore)outLen--;
  const sep=2,dataLen=new Array(outLen);
  for(;i<outLen;i++){const l=output[i].length;dataLen[i]=l;total+=l+sep;if(maxLen<l)maxLen=l}
  const actualMax=maxLen+sep;
  if(actualMax*3+ctx.indent<80&&(total/actualMax>5||maxLen<=6)){
    const averageBias=Math.sqrt(actualMax-total/output.length);
    const biasedMax=Math.max(actualMax-3-averageBias,1);
    const columns=Math.min(Math.round(Math.sqrt(2.5*biasedMax*outLen)/biasedMax),Math.floor((80-ctx.indent)/actualMax),3*4,15);
    if(columns<=1)return output;
    const tmp=[],maxLine=[];
    for(let c=0;c<columns;c++){let ll=0;for(let j=c;j<output.length;j+=columns)if(dataLen[j]>ll)ll=dataLen[j];maxLine.push(ll+sep)}
    let padStart=true;
    if(value!==undefined)for(let k=0;k<output.length;k++)if(typeof value[k]!=='number'&&typeof value[k]!=='bigint'){padStart=false;break}
    for(let k=0;k<outLen;k+=columns){
      const max=Math.min(k+columns,outLen);let str='',j=k;
      for(;j<max-1;j++){const pad=maxLine[j-k];str+=padStart?(output[j]+', ').padStart(pad,' '):(output[j]+', ').padEnd(pad,' ')}
      if(padStart)str+=output[j].padStart(maxLine[j-k]-sep,' ');else str+=output[j];
      tmp.push(str);
    }
    if(ctx.hasMore)tmp.push(output[outLen]);
    return tmp;
  }
  return output;
}
function jsReduce(ctx,output,base,braces,isArray,level,value){
  const entries=output.length;
  if(isArray&&entries>6)output=jsGroup(ctx,output,value);
  if(ctx.cur-level<3&&entries===output.length){
    const start=output.length+ctx.indent+braces[0].length+base.length+10;
    let tot=output.length+start;

    const out=H.__flush().replace(/\n$/,'');
    if(!e)return {out};
    let msg;
    if(e&&e.pyType)msg=e.pyType+(e.message?': '+e.message:'');
    else{
      const m0=String(e&&e.message||e);let m;

      else if(e instanceof SyntaxError||/^SyntaxError/.test(m0))msg='SyntaxError: '+m0.replace(/^SyntaxError:\s*/,'');
      else if(e instanceof TypeError){
        if(m=/^(?:\S+ )?(\S+?)(?:\.\w+)? is not a function$/.exec(m0))msg="TypeError: '"+m[1]+"' object is not callable";
        else if(m=/Cannot read propert(?:y|ies) of (undefined|null)/.exec(m0))msg="AttributeError: 'NoneType' object has no attribute";

}

 s:[['متن‌ها (string) داخل نقل‌قول‌ان و با + بهم چسبیده میشن.\nاگه قبل از نقل‌قول یه f بذاری، میتونی متغیر رو بین { } وسط متن بذاری. به این میگن f-string.','Strings live inside quotes and can be joined with +.\nPut an f before the quote and you can place variables inside { } in the text. That is an f-string.',`name = "Sara"\nprint("Hi " + name)\nprint(f"Hi {name}, welcome!")`]],
 e:[{c:`first = "Code"\nsecond = "Flex"\nprint(first + second)`,n:['+ دو تا متن رو بهم میچسبونه: CodeFlex.','+ glues two strings together: CodeFlex.']},
    {c:`hero = "Viking"\nlevel = 3\nprint(f"{hero} is level {level}")`,n:['با f-string عدد و متن رو راحت قاطی می‌کنیم.','With an f-string we can mix text and numbers easily.']}],
 q:{p:['متغیر name رو داخل یه f-string بذار و چاپ کن؛ مثل Hello Ali!','Put the variable name inside an f-string and print it, like Hello Ali!'],st:'name = "Ali"\n# print an f-string\n',
    ok:(c,o)=>/f(["']).*\{name\}.*\1/.test(c)&&o.trim().length>0,h:['print(f"Hello {name}!")','print(f"Hello {name}!")'],sol:'name = "Ali"\nprint(f"Hello {name}!")'}},
{t:['شرط if','if conditions'],
 s:[['با if برنامه تصمیم می‌گیره. اگه شرط درست (True) باشه کدهای تو رفته اجرا میشن، وگرنه else اجرا میشه.\nبعد از شرط حتما دو نقطه : بذار و خط بعدی رو چهار فاصله تو ببر.','With if the program makes decisions. If the condition is True the indented code runs, otherwise else runs.\nAlways put a colon : after the condition and indent the next line by four spaces.',`hp = 30\nif hp > 0:\n    print("Alive")\nelse:\n    print("Game over")`]],
 e:[{c:`gold = 10\nif gold >= 50:\n    print("Rich")\nelse:\n    print("Poor")`,n:['۱۰ کمتر از ۵۰ هست پس شرط غلطه و else اجرا میشه.','10 is less than 50, so the condition is False and else runs.']},
    {c:`score = 85\nif score >= 90:\n    print("A")\nelif score >= 80:\n    print("B")\nelse:\n    print("C")`,n:['elif یعنی «اگه نشد، این شرط رو چک کن». اینجا ۸۵ بزرگتر از ۸۰ هست پس B.','elif means “otherwise, check this”. 85 is above 80 so we get B.']}],
 q:{p:['gold برابر ۷۵ هست. اگه gold بزرگتر یا مساوی ۵۰ بود rich چاپ کن، وگرنه poor.','gold is 75. If gold is 50 or more print rich, otherwise print poor.'],st:'gold = 75\n',
    ok:(c,o)=>o.trim().toLowerCase()==='rich'&&/\bif\b/.test(c)&&/\belse\b/.test(c),h:['if gold >= 50:\n    print("rich")\nelse:\n    print("poor")','if gold >= 50:\n    print("rich")\nelse:\n    print("poor")'],sol:'gold = 75\nif gold >= 50:\n    print("rich")\nelse:\n    print("poor")'}},
{t:['لیست‌ها','Lists'],
 s:[['لیست (list) مثل یه کوله‌پشتیه که چند تا چیز توشه. داخل [ ] نوشته میشه و عضوها با کاما جدا میشن.\nشماره‌ی اولین عضو ۰ هست! و با len تعداد عضوها رو میگیریم.','A list is like a backpack holding several things. It is written inside [ ] with items separated by commas.\nThe first item has index 0! And len gives the number of items.',`items = ["sword", "shield", "potion"]\nprint(items[0])\nprint(len(items))`]],
 e:[{c:`bag = ["map", "key"]\nbag.append("torch")\nprint(bag)`,n:['append یه عضو جدید به آخر لیست اضافه می‌کنه.','append adds a new item to the end of the list.']},
    {c:`nums = [10, 20, 30]\nprint(nums[2])\nprint(len(nums))`,n:['اندیس ۲ یعنی عضو سوم (۳۰). طول لیست ۳ هست.','Index 2 is the third item (30). The list length is 3.']}],
 q:{p:['یه لیست به اسم fruits با ۳ میوه بساز و تعدادشون رو با len چاپ کن.','Create a list called fruits with 3 fruits and print how many there are using len.'],st:'# fruits = [...]\n',
    ok:(c,o)=>/fruits\s*=\s*\[[^\]]+,[^\]]+,[^\]]+\]/.test(c)&&/len\s*\(\s*fruits\s*\)/.test(c)&&o.trim()==='3',h:['fruits = ["apple", "pear", "kiwi"]\nprint(len(fruits))','fruits = ["apple", "pear", "kiwi"]\nprint(len(fruits))'],sol:'fruits = ["apple", "pear", "kiwi"]\nprint(len(fruits))'}},
{t:['حلقه for','for loops'],
 s:[['حلقه for یه کار رو چند بار تکرار می‌کنه. range(3) یعنی اعداد ۰ و ۱ و ۲.\nکدی که باید تکرار بشه رو چهار فاصله تو ببر.','A for loop repeats a job several times. range(3) means the numbers 0, 1 and 2.\nIndent the code that should repeat by four spaces.',`for i in range(3):\n    print(i)`]],
 e:[{c:`for i in range(1, 4):\n    print("Round", i)`,n:['range(1, 4) از ۱ شروع میشه و قبل از ۴ تموم میشه: ۱ و ۲ و ۳.','range(1, 4) starts at 1 and stops before 4: 1, 2, 3.']},
    {c:`heroes = ["Viking", "Knight"]\nfor h in heroes:\n    print(h)`,n:['میشه مستقیم روی عضوهای یه لیست هم حلقه زد.','You can also loop directly over the items of a list.']}],
 q:{p:['با یه حلقه for عددهای ۱ تا ۵ رو هرکدوم تو یه خط چاپ کن.','Use a for loop to print the numbers 1 to 5, each on its own line.'],st:'# hint: range(1, 6)\n',
    ok:(c,o)=>/\bfor\b/.test(c)&&o.trim().split('\n').join(',')==='1,2,3,4,5',h:['for i in range(1, 6):\n    print(i)','for i in range(1, 6):\n    print(i)'],sol:'for i in range(1, 6):\n    print(i)'}},
{t:['تابع‌ها','Functions'],
 s:[['تابع (function) یه بسته‌ی کدِ اسم‌داره. با def می‌سازیمش و هر وقت اسمش رو صدا بزنیم اجرا میشه.\nreturn جواب تابع رو پس میده.','A function is a named package of code. We create it with def and it runs whenever we call its name.\nreturn hands back the function’s answer.',`def greet(name):\n    print("Hi " + name)\n\ngreet("Ali")`]],
 e:[{c:`def add(a, b):\n    return a + b\n\nprint(add(2, 3))`,n:['تابع add دو تا عدد میگیره و جمعشون رو return می‌کنه.','The add function takes two numbers and returns their sum.']},
    {c:`def power_up(hp):\n    return hp + 50\n\nprint(power_up(100))`,n:['هر بار که تابع رو صدا بزنی یه جواب جدید میگیری.','Each time you call the function you get a new answer.']}],
 q:{p:['تابع double رو کامل کن تا عدد ورودی رو دو برابر برگردونه. print(double(4)) باید ۸ چاپ کنه.','Finish the function double so it returns the input doubled. print(double(4)) must print 8.'],st:'def double(n):\n    pass\n\nprint(double(4))\n',
    ok:(c,o)=>o.trim()==='8'&&/\breturn\b/.test(c)&&/def\s+double/.test(c),h:['return n * 2','return n * 2'],sol:'def double(n):\n    return n * 2\n\nprint(double(4))'}}
],

js:[
{t:['console.log','console.log'],
 s:[['console.log() هر چیزی که داخلش بنویسی رو توی کنسول چاپ می‌کنه؛ مثل print توی پایتون.\nمتن بین نقل‌قول و آخر خط یه ; میذاریم.','console.log() prints whatever you put inside to the console, just like print in Python.\nText goes in quotes and we end the line with a ;',`console.log("Hello, Hero!");`]],
 e:[{c:`console.log("Hello, World!");`,n:['اولین برنامه‌ی هر برنامه‌نویسی!','Every programmer’s first program!']},
    {c:`console.log("Welcome");\nconsole.log("to Code Flex");`,n:['هر console.log یه خط جدید چاپ می‌کنه.','Each console.log prints a new line.']}],
 q:{p:['اسم خودت رو با console.log چاپ کن.','Print your own name with console.log.'],st:'// write your code here\n',
    ok:(c,o)=>/console\.log\s*\(\s*(["'`]).+\1\s*\)/.test(c)&&o.trim().length>0,h:['console.log("Ali");','console.log("Ali");'],sol:'console.log("Ali");'}},
{t:['let و const','let & const'],
 s:[['برای ساخت متغیر از let یا const استفاده می‌کنیم.\nlet یعنی بعدا میشه عوضش کرد، const یعنی ثابته و عوض نمیشه.','We create variables with let or const.\nlet means it can change later, const means it is constant.',`let hp = 100;\nconst hero = "Knight";\nconsole.log(hero, hp);`]],
 e:[{c:`let coins = 5;\ncoins = coins + 3;\nconsole.log(coins);`,n:['با let میشه مقدار رو عوض کرد: ۵ + ۳ = ۸.','With let we can change the value: 5 + 3 = 8.']},
    {c:`const pi = 3.14;\nconsole.log(pi);\n// pi = 3; would cause an error`,n:['اگه بخوای const رو عوض کنی خطا میگیری؛ برای چیزهای ثابت عالیه.','Changing a const gives an error; perfect for things that never change.']}],
 q:{p:['یه const به اسم hero بساز، اسم قهرمانت رو توش بذار و با console.log چاپش کن.','Create a const called hero, store your hero’s name in it and print it with console.log.'],st:'// const hero = ...\n',
    ok:(c,o)=>/const\s+hero\s*=/.test(c)&&/console\.log\s*\(\s*hero\s*\)/.test(c)&&o.trim()!=='',h:['const hero = "Arthur";\nconsole.log(hero);','const hero = "Arthur";\nconsole.log(hero);'],sol:'const hero = "Arthur";\nconsole.log(hero);'}},
{t:['عددها و عملگرها','Numbers & operators'],
 s:[['جاوااسکریپت هم ماشین‌حساب داره:\n+ جمع ، - منها ، * ضرب ، / تقسیم ، % باقی‌مانده ، ** توان','JavaScript has a calculator too:\n+ add, - subtract, * multiply, / divide, % remainder, ** power',`console.log(2 + 3);\nconsole.log(10 * 4);\nconsole.log(2 ** 3);`]],
 e:[{c:`let a = 6;\nlet b = 7;\nconsole.log(a * b);`,n:['۶ ضربدر ۷ میشه ۴۲.','6 times 7 is 42.']},
    {c:`console.log(10 % 3);\nconsole.log(2 ** 4);`,n:['% باقی‌مانده‌ی تقسیمه (۱) و ** توانه (۱۶).','% is the remainder (1) and ** is the power (16).']}],
 q:{p:['damage برابر ۱۲ و power برابر ۵ هست. حاصل‌ضربشون رو چاپ کن.','damage is 12 and power is 5. Print their product.'],st:'let damage = 12;\nlet power = 5;\n',
    ok:(c,o)=>o.trim()==='60'&&/\*/.test(c),h:['console.log(damage * power);','console.log(damage * power);'],sol:'let damage = 12;\nlet power = 5;\nconsole.log(damage * power);'}},
{t:['متن‌ها و template','Strings & templates'],
 s:[['متن رو میشه با + بهم چسبوند. روش بهتر template literal هست: متن رو بین بک‌تیک ` ` بنویس و متغیر رو داخل ${ } بذار.','Strings can be joined with +. A better way is a template literal: write text between backticks ` ` and put variables inside ${ }.',`const name = "Sara";\nconsole.log("Hi " + name);\nconsole.log(\`Hi \${name}, welcome!\`);`]],
 e:[{c:`const a = "Code";\nconst b = "Flex";\nconsole.log(a + b);`,n:['+ دو تا متن رو بهم میچسبونه.','+ glues two strings together.']},
    {c:`const hero = "Viking";\nconst level = 3;\nconsole.log(\`\${hero} is level \${level}\`);`,n:['داخل ${ } هر متغیری رو میشه گذاشت.','You can put any variable inside ${ }.']}],
 q:{p:['متغیر name رو داخل یه template literal بذار و چاپ کن؛ مثل Hello Ali!','Put the variable name inside a template literal and print it, like Hello Ali!'],st:'const name = "Ali";\n',
    ok:(c,o)=>/`[^`]*\$\{name\}[^`]*`/.test(c)&&o.trim().length>0,h:['console.log(`Hello ${name}!`);','console.log(`Hello ${name}!`);'],sol:'const name = "Ali";\nconsole.log(`Hello ${name}!`);'}},
{t:['شرط if','if conditions'],
 s:[['با if برنامه تصمیم می‌گیره. شرط توی پرانتز ( ) و کدها توی آکولاد { } میان. اگه شرط غلط بود else اجرا میشه.','With if the program decides. The condition goes in ( ) and the code in { }. If it is false, else runs.',`let hp = 30;\nif (hp > 0) {\n  console.log("Alive");\n} else {\n  console.log("Game over");\n}`]],
 e:[{c:`let gold = 10;\nif (gold >= 50) {\n  console.log("Rich");\n} else {\n  console.log("Poor");\n}`,n:['۱۰ کمتر از ۵۰ هست پس else اجرا میشه.','10 is less than 50 so else runs.']},
    {c:`let score = 85;\nif (score >= 90) {\n  console.log("A");\n} else if (score >= 80) {\n  console.log("B");\n} else {\n  console.log("C");\n}`,n:['else if شرط‌های بیشتری رو پشت سر هم چک می‌کنه.','else if checks more conditions one after another.']}],
 q:{p:['gold برابر ۷۵ هست. اگه gold بزرگتر یا مساوی ۵۰ بود rich چاپ کن، وگرنه poor.','gold is 75. If gold is 50 or more print rich, otherwise print poor.'],st:'let gold = 75;\n',
    ok:(c,o)=>o.trim().toLowerCase()==='rich'&&/\bif\b/.test(c)&&/\belse\b/.test(c),h:['if (gold >= 50) { ... } else { ... }','if (gold >= 50) { ... } else { ... }'],sol:'let gold = 75;\nif (gold >= 50) {\n  console.log("rich");\n} else {\n  console.log("poor");\n}'}},
{t:['آرایه‌ها','Arrays'],
 s:[['آرایه (array) یه لیست از چیزهاست داخل [ ]. اندیس اولین عضو ۰ هست.\nبا .length تعداد عضوها و با .push یه عضو جدید به آخرش اضافه میشه.','An array is a list of things inside [ ]. The first item has index 0.\n.length gives the item count and .push adds a new item at the end.',`let items = ["sword", "shield"];\nconsole.log(items[0]);\nitems.push("potion");\nconsole.log(items.length);`]],
 e:[{c:`const bag = ["map", "key"];\nbag.push("torch");\nconsole.log(bag);`,n:['push یه عضو به آخر آرایه اضافه می‌کنه.','push adds an item to the end of the array.']},
    {c:`const nums = [10, 20, 30];\nconsole.log(nums[2]);\nconsole.log(nums.length);`,n:['اندیس ۲ یعنی عضو سوم (۳۰) و طول آرایه ۳ هست.','Index 2 is the third item (30) and the length is 3.']}],
 q:{p:['یه آرایه به اسم fruits با ۳ میوه بساز و تعدادشون رو با length چاپ کن.','Create an array called fruits with 3 fruits and print how many there are using length.'],st:'// const fruits = [...]\n',
    ok:(c,o)=>/fruits\s*=\s*\[[^\]]+,[^\]]+,[^\]]+\]/.test(c)&&/fruits\.length/.test(c)&&o.trim()==='3',h:['const fruits = ["apple", "pear", "kiwi"];\nconsole.log(fruits.length);','const fruits = ["apple", "pear", "kiwi"];\nconsole.log(fruits.length);'],sol:'const fruits = ["apple", "pear", "kiwi"];\nconsole.log(fruits.length);'}},
{t:['حلقه‌ها','Loops'],
 s:[['حلقه for یه کار رو چند بار تکرار می‌کنه. سه بخش داره: شروع، شرطِ ادامه، و قدم بعدی.\ni++ یعنی یکی به i اضافه کن.','A for loop repeats a job. It has three parts: start, keep-going condition, and the next step.\ni++ means add one to i.',`for (let i = 0; i < 3; i++) {\n  console.log(i);\n}`]],
 e:[{c:`for (let i = 1; i <= 3; i++) {\n  console.log("Round " + i);\n}`,n:['از ۱ شروع می‌کنیم و تا ۳ ادامه میدیم.','We start at 1 and continue up to 3.']},
    {c:`const heroes = ["Viking", "Knight"];\nfor (const h of heroes) {\n  console.log(h);\n}`,n:['for...of عضوهای آرایه رو یکی یکی میده.','for...of gives us the array items one by one.']}],
 q:{p:['با یه حلقه for عددهای ۱ تا ۵ رو هرکدوم تو یه خط چاپ کن.','Use a for loop to print the numbers 1 to 5, each on its own line.'],st:'// write your loop\n',
    ok:(c,o)=>/\bfor\b/.test(c)&&o.trim().split('\n').join(',')==='1,2,3,4,5',h:['for (let i = 1; i <= 5; i++) { ... }','for (let i = 1; i <= 5; i++) { ... }'],sol:'for (let i = 1; i <= 5; i++) {\n  console.log(i);\n}'}},
{t:['تابع‌ها','Functions'],
 s:[['تابع یه بسته‌ی کدِ اسم‌داره. با function می‌سازیمش و با اسمش صداش می‌زنیم. return جواب رو پس میده.\nتابع پیکانی (=>) یه شکل کوتاه‌تره.','A function is a named package of code. We create it with function and call it by name. return hands back the answer.\nThe arrow function (=>) is a shorter form.',`function greet(name) {\n  console.log("Hi " + name);\n}\ngreet("Ali");`]],
 e:[{c:`function add(a, b) {\n  return a + b;\n}\nconsole.log(add(2, 3));`,n:['add دو تا عدد میگیره و جمعشون رو برمی‌گردونه.','add takes two numbers and returns their sum.']},
    {c:`const powerUp = (hp) => hp + 50;\nconsole.log(powerUp(100));`,n:['تابع پیکانی: ورودی => خروجی. خیلی کوتاه!','Arrow function: input => output. Very short!']}],
 q:{p:['تابع double رو کامل کن تا عدد ورودی رو دو برابر برگردونه. console.log(double(4)) باید ۸ چاپ کنه.','Finish the function double so it returns the input doubled. console.log(double(4)) must print 8.'],st:'function double(n) {\n  // return ...\n}\n\nconsole.log(double(4));\n',
    ok:(c,o)=>o.trim()==='8'&&/\breturn\b/.test(c)&&/double/.test(c),h:['return n * 2;','return n * 2;'],sol:'function double(n) {\n  return n * 2;\n}\n\nconsole.log(double(4));'}}
],

html:[
{t:['ساختار صفحه','Page structure'],
 s:[['صفحه‌ی وب با تگ‌ها ساخته میشه. تگ‌ها بین < > هستن و معمولا جفتن: تگ باز و تگ بسته (با /).\nکل صفحه توی <html> و بخش دیدنی توی <body> قرار می‌گیره.','Web pages are built with tags. Tags sit between < > and usually come in pairs: an opening and a closing tag (with /).\nThe whole page goes inside <html> and the visible part inside <body>.',`<html>\n  <body>\n    Hello Hero!\n  </body>\n</html>`]],
 e:[{c:`<html>\n  <body>\n    Welcome to my page\n  </body>\n</html>`,n:['هر چی داخل body بنویسی توی صفحه دیده میشه.','Anything inside body shows up on the page.']},
    {c:`<html>\n  <head>\n    <title>My Game</title>\n  </head>\n  <body>\n    Play now!\n  </body>\n</html>`,n:['head اطلاعات پشت‌صحنه‌ست مثل title (اسم تب مرورگر). body بخش دیدنیه.','head holds behind-the-scenes info like title (the browser tab name). body is the visible part.']}],
 q:{p:['یه صفحه بساز که داخل body کلمه‌ی Hello نوشته باشه.','Build a page with the word Hello inside the body.'],st:'<html>\n  <body>\n    \n  </body>\n</html>',
    ok:(c,o,d)=>/<body/i.test(c)&&/<\/body>/i.test(c)&&d.body.textContent.trim().length>0,h:['بین <body> و </body> یه متن بنویس','Write some text between <body> and </body>'],sol:'<html>\n  <body>\n    Hello\n  </body>\n</html>'}},
{t:['تیتر و پاراگراف','Headings & paragraphs'],
 s:[['تیترها با <h1> تا <h6> ساخته میشن؛ h1 بزرگ‌ترینه. برای متن معمولی از <p> (پاراگراف) استفاده می‌کنیم.','Headings use <h1> to <h6>; h1 is the biggest. For normal text we use <p> (paragraph).',`<h1>Code Flex</h1>\n<h2>Learn to code</h2>\n<p>This is a paragraph.</p>`]],
 e:[{c:`<h1>My Hero</h1>\n<p>He is brave and strong.</p>`,n:['یه تیتر بزرگ و زیرش یه پاراگراف.','A big heading with a paragraph under it.']},
    {c:`<h1>Big</h1>\n<h3>Medium</h3>\n<h6>Tiny</h6>`,n:['هرچی عدد h بزرگتر باشه، تیتر کوچیک‌تره.','The bigger the number after h, the smaller the heading.']}],
 q:{p:['یه تیتر h1 با یه اسم دلخواه و یه پاراگراف p با یه متن بساز.','Create an h1 heading with any name and a p paragraph with any text.'],st:'',
    ok:(c,o,d)=>{const h=d.querySelector('h1'),p=d.querySelector('p');return !!h&&!!p&&h.textContent.trim()!==''&&p.textContent.trim()!==''},h:['<h1>Title</h1>\n<p>Text</p>','<h1>Title</h1>\n<p>Text</p>'],sol:'<h1>Title</h1>\n<p>Some text</p>'}},
{t:['لیست‌ها','Lists'],
 s:[['لیست نقطه‌ای با <ul> و لیست شماره‌دار با <ol> ساخته میشه. هر آیتم داخل یه <li> قرار می‌گیره.','A bullet list uses <ul> and a numbered list uses <ol>. Each item goes inside an <li>.',`<ul>\n  <li>Sword</li>\n  <li>Shield</li>\n</ul>`]],
 e:[{c:`<h3>My bag</h3>\n<ul>\n  <li>Map</li>\n  <li>Key</li>\n  <li>Torch</li>\n</ul>`,n:['سه تا آیتم نقطه‌دار.','Three bullet items.']},
    {c:`<ol>\n  <li>Wake up</li>\n  <li>Code</li>\n  <li>Level up</li>\n</ol>`,n:['ol خودش شماره‌ها رو میذاره.','ol adds the numbers by itself.']}],
 q:{p:['یه لیست نقطه‌ای (ul) با ۳ تا آیتم li بساز.','Build a bullet list (ul) with 3 li items.'],st:'<ul>\n  \n</ul>',
    ok:(c,o,d)=>d.querySelectorAll('ul > li').length>=3,h:['<li>یک</li> سه بار','<li>One</li> three times'],sol:'<ul>\n  <li>A</li>\n  <li>B</li>\n  <li>C</li>\n</ul>'}},
{t:['لینک‌ها','Links'],
 s:[['لینک با تگ <a> ساخته میشه. آدرس مقصد توی href و متنی که کاربر می‌بینه بین تگ باز و بسته.','A link uses the <a> tag. The destination goes in href and the text the user sees goes between the tags.',`<a href="https://github.com">Go to GitHub</a>`]],
 e:[{c:`<p>Visit <a href="https://example.com">my site</a> now!</p>`,n:['لینک میتونه وسط یه پاراگراف هم باشه.','A link can sit in the middle of a paragraph.']},
    {c:`<a href="https://github.com">GitHub</a><br>\n<a href="https://python.org">Python</a>`,n:['<br> یعنی برو خط بعد.','<br> means go to the next line.']}],
 q:{p:['یه لینک بساز که متنش GitHub باشه و به https://github.com بره.','Create a link with the text GitHub that goes to https://github.com'],st:'',
    ok:(c,o,d)=>{const a=d.querySelector('a');return !!a&&/github\.com/i.test(a.getAttribute('href')||'')&&a.textContent.trim()!==''},h:['<a href="https://github.com">GitHub</a>','<a href="https://github.com">GitHub</a>'],sol:'<a href="https://github.com">GitHub</a>'}},
{t:['قالب‌بندی متن','Text formatting'],
 s:[['برای پررنگ کردن متن از <strong> و برای کج کردنش از <em> استفاده می‌کنیم. <br> هم یه خط می‌پره پایین.','Use <strong> to make text bold and <em> to make it italic. <br> jumps to a new line.',`<p>This is <strong>important</strong> and <em>fancy</em>.</p>`]],
 e:[{c:`<p><strong>Warning!</strong> Dragons ahead.</p>`,n:['فقط کلمه‌ی Warning پررنگ میشه.','Only the word Warning becomes bold.']},
    {c:`<p>Line one<br>Line two<br><em>Line three</em></p>`,n:['br بدون تگ بسته‌ست و فقط خط رو میشکنه.','br has no closing tag and just breaks the line.']}],
 q:{p:['یه پاراگراف بساز که توش یه کلمه پررنگ (strong) و یه کلمه کج (em) باشه.','Create a paragraph with one bold (strong) word and one italic (em) word.'],st:'<p>  </p>',
    ok:(c,o,d)=>!!d.querySelector('strong,b')&&!!d.querySelector('em,i'),h:['<p><strong>Hi</strong> <em>there</em></p>','<p><strong>Hi</strong> <em>there</em></p>'],sol:'<p><strong>Hi</strong> <em>there</em></p>'}},
{t:['ورودی و دکمه','Input & button'],
 s:[['<input> یه جای خالی برای نوشتن کاربره و <button> یه دکمه‌ست. input تگ بسته نمی‌خواد.','<input> is a box where the user types and <button> is a button. input needs no closing tag.',`<input placeholder="Your name">\n<button>Start</button>`]],
 e:[{c:`<input placeholder="Hero name">\n<br>\n<button>Create hero</button>`,n:['placeholder یه متن راهنمای کم‌رنگ داخل input نشون میده.','placeholder shows a faint hint text inside the input.']},
    {c:`<button>Attack</button>\n<button>Defend</button>`,n:['هر تعداد دکمه که بخوای.','As many buttons as you like.']}],
 q:{p:['یه input و یه button با متن Go بساز.','Create an input and a button with the text Go.'],st:'',
    ok:(c,o,d)=>!!d.querySelector('input')&&!!d.querySelector('button')&&d.querySelector('button').textContent.trim()!=='',h:['<input>\n<button>Go</button>','<input>\n<button>Go</button>'],sol:'<input>\n<button>Go</button>'}},
{t:['رنگ با CSS','Color with CSS'],
 s:[['CSS ظاهر صفحه رو قشنگ می‌کنه. ساده‌ترینش اینه که توی خودِ تگ از style استفاده کنی: style="color: red;"\nیا داخل تگ <style> برای همه‌ی تگ‌های هم‌نوع.','CSS makes the page pretty. The simplest way is the style attribute on a tag: style="color: red;"\nOr use a <style> tag to style all tags of one kind.',`<h1 style="color: gold;">Gold Title</h1>`]],
 e:[{c:`<p style="color: purple;">Magic text</p>`,n:['رنگ متن این پاراگراف بنفش شد.','This paragraph’s text turned purple.']},
    {c:`<style>\n  p { color: green; font-size: 24px; }\n</style>\n<p>Big green text</p>\n<p>Me too!</p>`,n:['قانون p {...} برای همه‌ی پاراگراف‌ها اعمال میشه.','The rule p {...} applies to all paragraphs.']}],
 q:{p:['یه تیتر h1 بساز و رنگش رو با CSS آبی (blue) کن.','Create an h1 heading and make its color blue with CSS.'],st:'',
    ok:(c,o,d)=>!!d.querySelector('h1')&&/color\s*:\s*(blue|#00f\b|#0000ff|rgb\(\s*0\s*,\s*0\s*,\s*255)/i.test(c),h:['<h1 style="color: blue;">Hi</h1>','<h1 style="color: blue;">Hi</h1>'],sol:'<h1 style="color: blue;">Hi</h1>'}},
{t:['div و کلاس','div & class'],
 s:[['<div> یه جعبه‌ست که چند تا چیز رو توش جمع می‌کنیم. با class بهش اسم میدیم و توی CSS با نقطه . انتخابش می‌کنیم.','<div> is a box that groups things. We name it with class and select it in CSS with a dot .',`<style>\n  .card { background: gold; padding: 10px; }\n</style>\n<div class="card">Hello</div>`]],
 e:[{c:`<style>\n  .box { background: lightblue; padding: 12px; }\n</style>\n<div class="box">\n  <h2>Quest</h2>\n  <p>Find the key</p>\n</div>`,n:['همه‌ی چیزهای داخل div، توی یه جعبه‌ی آبی قرار میگیرن.','Everything inside the div sits in one blue box.']},
    {c:`<style>\n  .red { color: red; }\n  .blue { color: blue; }\n</style>\n<p class="red">Fire</p>\n<p class="blue">Water</p>`,n:['با کلاس‌های مختلف، ظاهرهای مختلف میدیم.','Different classes give different looks.']}],
 q:{p:['یه div با کلاس card بساز که توش یه متن باشه، و توی <style> یه قانون برای .card بنویس.','Create a div with class card containing some text, and write a rule for .card inside <style>.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>{const x=d.querySelector('div.card');return !!x&&x.textContent.trim()!==''&&/\.card\s*\{[^}]*:[^}]*\}/.test(c)},h:['<style>\n  .card { background: gold; }\n</style>\n<div class="card">Hi</div>','<style>\n  .card { background: gold; }\n</style>\n<div class="card">Hi</div>'],sol:'<style>\n  .card { background: gold; }\n</style>\n<div class="card">Hi</div>'}}
],

node:[
{t:['اولین برنامه‌ی Node','Your first Node program'],
 s:[['Node.js یعنی اجرای جاوااسکریپت بیرون از مرورگر، روی کامپیوتر خودت. یه فایل می‌سازی (مثلا app.js) و توی ترمینال با دستور «node app.js» اجراش می‌کنی.\nاینجا هم console.log کار می‌کنه.','Node.js runs JavaScript outside the browser, right on your computer. You create a file (say app.js) and run it in the terminal with “node app.js”.\nconsole.log works here too.',`console.log("Hello from Node!");`]],
 e:[{c:`console.log("Node is running");`,n:['توی ترمینال با node app.js همین متن چاپ میشه.','In the terminal, node app.js prints this text.']},
    {c:`console.log("Line 1");\nconsole.log("Line 2");`,n:['هر console.log یه خط جدید.','Each console.log is a new line.']}],
 q:{p:['با console.log متن Hello Node رو چاپ کن.','Print the text Hello Node with console.log.'],st:'',
    ok:(c,o)=>o.toLowerCase().includes('hello node'),h:['console.log("Hello Node");','console.log("Hello Node");'],sol:'console.log("Hello Node");'}},
{t:['شیء process','The process object'],
 s:[['شیء process اطلاعات برنامه و سیستم رو میده. مثلا process.platform اسم سیستم‌عامل رو نشون میده و process.argv آرگومان‌هایی که موقع اجرا دادی.','The process object gives info about your program and system. process.platform shows the operating system and process.argv holds the arguments you passed when running.',`console.log(process.platform);\nconsole.log(process.argv.length);`]],
 e:[{c:`console.log("Node version:", process.version);`,n:['نسخه‌ی Node که نصب کردی رو چاپ می‌کنه.','Prints the Node version you installed.']},
    {c:`const args = process.argv.slice(2);\nconsole.log(args.length);`,n:['دو عضو اول argv همیشه node و اسم فایله؛ آرگومان‌های خودت از سومی شروع میشن.','The first two items of argv are always node and the file name; your own arguments start from the third.']}],
 q:{p:['سیستم‌عامل رو با process.platform چاپ کن.','Print the operating system using process.platform.'],st:'',
    ok:(c,o)=>/process\.platform/.test(c)&&o.trim().length>0,h:['console.log(process.platform);','console.log(process.platform);'],sol:'console.log(process.platform);'}},
{t:['ماژول‌های path و os','path & os modules'],
 s:[['Node کلی ماژول آماده داره. با require اونا رو میگیریم: const path = require("path");\nماژول path برای کار با آدرس فایل‌ها و os برای اطلاعات سیستمه.','Node ships with many ready-made modules. We load them with require: const path = require("path");\nThe path module works with file paths and os gives system info.',`const path = require("path");\nconsole.log(path.join("games", "hero", "save.txt"));`]],
 e:[{c:`const os = require("os");\nconsole.log(os.platform());`,n:['ماژول os اسم سیستم‌عامل رو میده.','The os module gives the OS name.']},
    {c:`const path = require("path");\nconsole.log(path.extname("avatar.png"));`,n:['extname پسوند فایل رو برمی‌گردونه: .png','extname returns the file extension: .png']}],
 q:{p:['با ماژول path و تابع basename، اسم فایلِ "/games/hero.png" رو چاپ کن (باید hero.png بشه).','Use the path module and basename to print the file name of "/games/hero.png" (it should be hero.png).'],st:'',
    ok:(c,o)=>o.trim()==='hero.png'&&/require/.test(c),h:['path.basename("/games/hero.png")','path.basename("/games/hero.png")'],sol:'const path = require("path");\nconsole.log(path.basename("/games/hero.png"));'}},
{t:['ماژول fs و فایل‌ها','fs & files'],
 s:[['ماژول fs با فایل‌ها کار می‌کنه. writeFileSync توی فایل می‌نویسه و readFileSync فایل رو می‌خونه (با "utf8" متن برمی‌گردونه).\nاینجا فایل‌ها فقط توی شبیه‌ساز ساخته میشن، ولی کدش دقیقا همونیه که توی Node واقعی می‌نویسی.','The fs module works with files. writeFileSync writes to a file and readFileSync reads it (with "utf8" it returns text).\nHere files only exist inside a simulator, but the code is exactly what you would write in real Node.',`const fs = require("fs");\nfs.writeFileSync("note.txt", "Hello file");\nconsole.log(fs.readFileSync("note.txt", "utf8"));`]],
 e:[{c:`const fs = require("fs");\nfs.writeFileSync("log.txt", "Start\\n");\nfs.appendFileSync("log.txt", "Next");\nconsole.log(fs.readFileSync("log.txt", "utf8"));`,n:['appendFileSync به آخر فایل اضافه می‌کنه، نه جایگزین.','appendFileSync adds to the end of the file instead of replacing it.']},
    {c:`const fs = require("fs");\nconsole.log(fs.existsSync("secret.txt"));`,n:['existsSync چک می‌کنه فایل هست یا نه.','existsSync checks whether a file exists.']}],
 q:{p:['متن Hero saved رو توی فایل save.txt بنویس، بعد فایل رو بخون و چاپ کن.','Write the text Hero saved to save.txt, then read the file and print it.'],st:'const fs = require("fs");\n',
    ok:(c,o)=>o.trim()==='Hero saved'&&/writeFileSync/.test(c)&&/readFileSync/.test(c),h:['fs.writeFileSync("save.txt", "Hero saved");\nconsole.log(fs.readFileSync("save.txt", "utf8"));','fs.writeFileSync("save.txt", "Hero saved");\nconsole.log(fs.readFileSync("save.txt", "utf8"));'],sol:'const fs = require("fs");\nfs.writeFileSync("save.txt", "Hero saved");\nconsole.log(fs.readFileSync("save.txt", "utf8"));'}},
{t:['رویدادها (events)','Events'],
 s:[['توی Node میشه رویداد ساخت: با on گوش میدیم که چه اتفاقی افتاد و با emit اون رویداد رو اعلام می‌کنیم. مثل زنگ در: وقتی زنگ میخوره (emit)، کسی که منتظره (on) جواب میده.','In Node you can create events: with on we listen for something, and with emit we announce it. Like a doorbell: when it rings (emit), whoever is waiting (on) responds.',`const EventEmitter = require("events");\nconst bus = new EventEmitter();\nbus.on("hit", () => console.log("Ouch!"));\nbus.emit("hit");`]],
 e:[{c:`const EventEmitter = require("events");\nconst game = new EventEmitter();\ngame.on("score", (n) => console.log("Score:", n));\ngame.emit("score", 10);`,n:['emit میتونه داده هم بفرسته (اینجا ۱۰).','emit can send data too (here 10).']},
    {c:`const EventEmitter = require("events");\nconst door = new EventEmitter();\ndoor.on("open", () => console.log("Creeeak"));\ndoor.on("open", () => console.log("Welcome!"));\ndoor.emit("open");`,n:['چند نفر میتونن به یه رویداد گوش بدن.','Several listeners can hear the same event.']}],
 q:{p:['روی رویداد level-up گوش بده تا Level Up! چاپ بشه، بعد رویداد رو emit کن.','Listen for the level-up event so it prints Level Up!, then emit the event.'],st:'const EventEmitter = require("events");\nconst game = new EventEmitter();\n',
    ok:(c,o)=>o.includes('Level Up!')&&/\.on\s*\(/.test(c)&&/\.emit\s*\(/.test(c),h:['game.on("level-up", () => console.log("Level Up!"));\ngame.emit("level-up");','game.on("level-up", () => console.log("Level Up!"));\ngame.emit("level-up");'],sol:'const EventEmitter = require("events");\nconst game = new EventEmitter();\ngame.on("level-up", () => console.log("Level Up!"));\ngame.emit("level-up");'}},
{t:['سرور ساده با http','A simple http server'],
 s:[['با ماژول http میشه یه وب‌سرور ساخت! createServer یه تابع میگیره که به هر درخواست (req) جواب (res) میده. بعد با listen میگیم به کدوم پورت گوش بده.\nاینجا فقط شبیه‌سازیه، ولی روی کامپیوتر خودت با node app.js واقعا اجرا میشه.','The http module lets you build a web server! createServer takes a function that answers (res) each request (req). Then listen says which port to listen on.\nHere it is only simulated, but on your computer node app.js really runs it.',`const http = require("http");\nconst server = http.createServer((req, res) => {\n  res.end("Hello Hero!");\n});\nserver.listen(3000, () => {\n  console.log("Server on port 3000");\n});`]],
 e:[{c:`const http = require("http");\nconst server = http.createServer((req, res) => {\n  res.end("Welcome to the castle");\n});\nserver.listen(4000);\nconsole.log("Castle open");`,n:['هر کسی که صفحه رو باز کنه این متن رو می‌بینه.','Anyone opening the page sees this text.']},
    {c:`const http = require("http");\nhttp.createServer((req, res) => {\n  res.writeHead(200, { "Content-Type": "text/plain" });\n  res.end("OK");\n}).listen(5000);\nconsole.log("Ready");`,n:['writeHead کد وضعیت (۲۰۰ یعنی موفق) و نوع محتوا رو تعیین می‌کنه.','writeHead sets the status code (200 means success) and the content type.']}],
 q:{p:['یه سرور با http.createServer بساز که با res.end جواب Welcome بده و روی پورت 8080 گوش کنه.','Build a server with http.createServer that answers Welcome using res.end and listens on port 8080.'],st:'const http = require("http");\n',
    ok:(c,o)=>/http\.createServer/.test(c)&&/res\.end\s*\(/.test(c)&&/listen\s*\(\s*8080/.test(c),h:['http.createServer((req, res) => {\n  res.end("Welcome");\n}).listen(8080);','http.createServer((req, res) => {\n  res.end("Welcome");\n}).listen(8080);'],sol:'const http = require("http");\nhttp.createServer((req, res) => {\n  res.end("Welcome");\n}).listen(8080);'}}
]

{t:['مقایسه و منطق','Comparison & logic'],

    {c:`has_key = True\nlevel = 3\nif has_key and level >= 3:\n    print("Door opens")\nelse:\n    print("Locked")`,n:['هر دو شرط باید درست باشن تا در باز بشه (and).','Both conditions must be true for the door to open (and).']}],

{t:['حلقه while','while loops'],

 q:{p:['با یه حلقه while عددهای ۵ تا ۱ رو (از ۵ شروع کن و برگرد عقب) هرکدوم تو یه خط چاپ کن.','Use a while loop to print 5 down to 1, each on its own line.'],st:'n = 5\n',

{t:['break و continue','break & continue'],

    {c:`n = 0\nwhile True:\n    n += 1\n    if n * n > 20:\n        break\nprint(n)`,n:['while True بی‌نهایته، ولی با break ازش میزنیم بیرون. اولین n که n*n از ۲۰ بزرگتر میشه ۵ هست.','while True never ends by itself, but break lets us out. The first n with n*n above 20 is 5.']}],
