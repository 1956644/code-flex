    {c:`heroes = {"Arthur": 5, "Ragnar": 7}\nfor name, lvl in heroes.items():\n    print(f"{name} is level {lvl}")`,n:['ترکیب دیکشنری، حلقه و f-string.','A mix of dictionary, loop and f-string.']}],
 q:{p:['تابع grade رو کامل کن: اگه score بزرگتر یا مساوی ۹۰ بود "A"، اگه بزرگتر یا مساوی ۸۰ بود "B"، وگرنه "C" برگردونه.','Finish the function grade: return "A" if score is 90 or more, "B" if 80 or more, otherwise "C".'],st:'def grade(score):\n    # return "A", "B" or "C"\n    pass\n\nfor s in [95, 85, 70]:\n    print(grade(s))\n',
    ok:(c,o)=>o.trim().split('\n').join(',')==='A,B,C'&&/\breturn\b/.test(c)&&/\bif\b/.test(c),h:['if score >= 90:\n    return "A"\nelif score >= 80:\n    return "B"\nelse:\n    return "C"','if score >= 90:\n    return "A"\nelif score >= 80:\n    return "B"\nelse:\n    return "C"'],sol:'def grade(score):\n    if score >= 90:\n        return "A"\n    elif score >= 80:\n        return "B"\n    else:\n        return "C"\n\nfor s in [95, 85, 70]:\n    print(grade(s))'}}
);

LESSONS.js.push(
{t:['مقایسه و منطق','Comparison & logic'],
 s:[['مقایسه‌ها true یا false میدن:\n=== مساوی (سخت‌گیرانه) ، !== نامساوی ، > ، < ، >= ، <=\nبا && (و) ، || (یا) ، ! (نه) چند شرط رو ترکیب می‌کنیم.\nهمیشه از === استفاده کن نه ==.','Comparisons give true or false:\n=== strict equal, !== not equal, > , < , >= , <=\nCombine conditions with && (and), || (or), ! (not).\nAlways prefer === over ==.',`const age = 20;\nconsole.log(age >= 18);\nconsole.log(age > 18 && age < 30);\nconsole.log(!(age === 20));`]],
 e:[{c:`let hp = 0;\nconsole.log(hp === 0);\nconsole.log(hp !== 0);`,n:['=== میپرسه «دقیقا مساویه؟».','=== asks “is it exactly equal?”.']},
    {c:`const hasKey = true;\nconst level = 3;\nif (hasKey && level >= 3) {\n  console.log("Door opens");\n} else {\n  console.log("Locked");\n}`,n:['هر دو شرط باید درست باشن (&&).','Both conditions must be true (&&).']}],
 q:{p:['level برابر ۷ و hasSword برابر true هست. اگه level بزرگتر از ۵ بود و hasSword داشت، Ready چاپ کن، وگرنه Not ready.','level is 7 and hasSword is true. If level is above 5 and hasSword is true print Ready, otherwise Not ready.'],st:'const level = 7;\nconst hasSword = true;\n',
    ok:(c,o)=>o.trim()==='Ready'&&/&&/.test(c)&&/\bif\b/.test(c),h:['if (level > 5 && hasSword) { ... }','if (level > 5 && hasSword) { ... }'],sol:'const level = 7;\nconst hasSword = true;\nif (level > 5 && hasSword) {\n  console.log("Ready");\n} else {\n  console.log("Not ready");\n}'}},
{t:['while، break و continue','while, break & continue'],
 s:[['حلقه while تا وقتی شرطش درست باشه تکرار می‌کنه. n-- یعنی «یکی از n کم کن». اگه شرط هیچ‌وقت غلط نشه حلقه بی‌نهایت میشه!','A while loop repeats as long as its condition is true. n-- means “subtract one from n”. If the condition never turns false the loop runs forever!',`let n = 3;\nwhile (n > 0) {\n  console.log(n);\n  n--;\n}\nconsole.log("Go!");`],
     ['break حلقه رو قطع می‌کنه و continue فقط همین دور رو رد می‌کنه.','break stops the loop and continue only skips this round.',`for (let i = 1; i <= 5; i++) {\n  if (i === 3) continue;\n  if (i === 5) break;\n  console.log(i);\n}`]],
 e:[{c:`let hp = 50;\nwhile (hp > 0) {\n  hp -= 20;\n  console.log("HP:", hp);\n}`,n:['وقتی hp به صفر یا کمتر برسه حلقه تموم میشه.','When hp reaches zero or less the loop ends.']},
    {c:`let n = 0;\nwhile (true) {\n  n++;\n  if (n * n > 20) break;\n}\nconsole.log(n);`,n:['while (true) خودش تموم نمیشه ولی break نجاتش میده. جواب ۵ هست.','while (true) never ends by itself but break rescues it. The answer is 5.']}],
 q:{p:['با یه حلقه while عددهای ۵ تا ۱ رو (از ۵ شروع کن و برگرد عقب) هرکدوم تو یه خط چاپ کن.','Use a while loop to print 5 down to 1, each on its own line.'],st:'let n = 5;\n',
    ok:(c,o)=>/\bwhile\b/.test(c)&&o.trim().split('\n').join(',')==='5,4,3,2,1',h:['while (n >= 1) {\n  console.log(n);\n  n--;\n}','while (n >= 1) {\n  console.log(n);\n  n--;\n}'],sol:'let n = 5;\nwhile (n >= 1) {\n  console.log(n);\n  n--;\n}'}},
{t:['دستور switch','switch statement'],
 s:[['وقتی می‌خوای یه مقدار رو با چند حالت مقایسه کنی، switch از چندتا else if مرتب‌تره. بعد از هر case یه break بنویس و default برای «هیچ‌کدوم» هست.','When you compare one value against many options, switch is tidier than many else if. Write a break after each case; default means “none of them”.',`const day = "sat";\nswitch (day) {\n  case "sat":\n    console.log("Weekend");\n    break;\n  case "sun":\n    console.log("Weekend");\n    break;\n  default:\n    console.log("Work day");\n}`]],
 e:[{c:`const hero = "viking";\nswitch (hero) {\n  case "knight":\n    console.log("Sword");\n    break;\n  case "viking":\n    console.log("Axe");\n    break;\n  default:\n    console.log("Fists");\n}`,n:['viking با case دوم یکی هست پس Axe چاپ میشه.','viking matches the second case so Axe is printed.']},
    {c:`const n = 2;\nswitch (n) {\n  case 1:\n  case 2:\n    console.log("Small");\n    break;\n  default:\n    console.log("Big");\n}`,n:['اگه بین case ها break نباشه، حالت‌ها یه کد مشترک دارن.','Without break between cases they share the same code.']}],
 q:{p:['light برابر "green" هست. با switch برای "red" عبارت Stop، برای "green" عبارت Go و برای بقیه Wait چاپ کن.','light is "green". Use switch to print Stop for "red", Go for "green" and Wait for anything else.'],st:'const light = "green";\n',
    ok:(c,o)=>o.trim()==='Go'&&/switch/.test(c)&&/case/.test(c),h:['switch (light) {\n  case "red": ...','switch (light) {\n  case "red": ...'],sol:'const light = "green";\nswitch (light) {\n  case "red":\n    console.log("Stop");\n    break;\n  case "green":\n    console.log("Go");\n    break;\n  default:\n    console.log("Wait");\n}'}},
{t:['کار با متن','String methods'],
 s:[['متن‌ها ابزار آماده دارن:\n.length طول ، .toUpperCase() حروف بزرگ ، .toLowerCase() حروف کوچک ، .trim() پاک کردن فاصله‌های اول و آخر ، .includes() آیا شامل هست؟ ، .slice(a, b) برش ، .replace(a, b) جایگزین\nname[0] اولین حرف رو میده.','Strings come with ready-made tools:\n.length, .toUpperCase(), .toLowerCase(), .trim(), .includes(), .slice(a, b), .replace(a, b)\nname[0] gives the first letter.',`const name = "Code Flex";\nconsole.log(name.toUpperCase());\nconsole.log(name.length);\nconsole.log(name[0]);\nconsole.log(name.includes("Flex"));\nconsole.log(name.slice(0, 4));`]],
 e:[{c:`const w = "  hello  ";\nconsole.log(w.trim());\nconsole.log(w.trim().toUpperCase());`,n:['میشه چند متد رو زنجیره‌ای نوشت.','You can chain several methods.']},
    {c:`const msg = "I love JS";\nconsole.log(msg.split(" "));\nconsole.log(msg.replace("love", "adore"));`,n:['split متن رو به آرایه تبدیل می‌کنه.','split turns the text into an array.']}],
 q:{p:['name برابر "arthur" هست. سه حرف اول رو با حروف بزرگ چاپ کن (ART).','name is "arthur". Print its first three letters in uppercase (ART).'],st:'const name = "arthur";\n',
    ok:(c,o)=>o.trim()==='ART'&&/slice/.test(c)&&/toUpperCase/.test(c),h:['name.slice(0, 3).toUpperCase()','name.slice(0, 3).toUpperCase()'],sol:'const name = "arthur";\nconsole.log(name.slice(0, 3).toUpperCase());'}},
{t:['شیء (object)','Objects'],
 s:[['شیء (object) اطلاعات رو به شکل «کلید: مقدار» نگه می‌داره، داخل { }. مثل کارت مشخصات قهرمان!\nبا hero.name مقدار رو می‌خونی و با hero.hp = 80 عوضش می‌کنی یا یه ویژگی جدید اضافه می‌کنی.','An object stores “key: value” pairs inside { }, like a hero profile card!\nRead a value with hero.name and change it with hero.hp = 80, or add a brand new property.',`const hero = { name: "Arthur", hp: 100 };\nconsole.log(hero.name);\nhero.hp = 80;\nhero.level = 2;\nconsole.log(hero);`],
     ['یه شیء می‌تونه تابع هم داشته باشه (بهش میگن متد). داخلش با this به خود شیء اشاره می‌کنیم.','An object can hold functions too (called methods). Inside, this points to the object itself.',`const hero = {\n  name: "Arthur",\n  say() {\n    console.log("I am " + this.name);\n  }\n};\nhero.say();`]],
 e:[{c:`const car = { brand: "BMW", speed: 200 };\nconsole.log(car["brand"]);\nconsole.log(car.speed);`,n:['دو راه برای خوندن: car.speed یا car["speed"].','Two ways to read: car.speed or car["speed"].']},
    {c:`const bag = { sword: 1, potion: 3 };\nfor (const item in bag) {\n  console.log(item, bag[item]);\n}`,n:['for...in کلیدهای شیء رو یکی یکی میده.','for...in gives the keys of an object one by one.']}],
 q:{p:['یه شیء به اسم player با ویژگی‌های name و level (برابر ۵) بساز و level رو چاپ کن.','Create an object called player with properties name and level (equal to 5) and print the level.'],st:'// const player = {...}\n',
    ok:(c,o)=>/player\s*=\s*\{/.test(c)&&/level/.test(c)&&o.trim()==='5',h:['const player = { name: "Ali", level: 5 };\nconsole.log(player.level);','const player = { name: "Ali", level: 5 };\nconsole.log(player.level);'],sol:'const player = { name: "Ali", level: 5 };\nconsole.log(player.level);'}},
{t:['map و filter','map & filter'],
 s:[['آرایه‌ها متدهای قدرتمند دارن:\nmap روی هر عضو یه کار می‌کنه و یه آرایه‌ی جدید میده.\nfilter فقط عضوهایی که شرط رو دارن نگه می‌داره.\nاین‌ها یه تابع (معمولا پیکانی) میگیرن.','Arrays have powerful methods:\nmap does a job on every item and returns a new array.\nfilter keeps only the items that pass a test.\nThey take a function (often an arrow function).',`const nums = [1, 2, 3, 4];\nconst doubled = nums.map((n) => n * 2);\nconst big = nums.filter((n) => n > 2);\nconsole.log(doubled);\nconsole.log(big);`]],
 e:[{c:`const heroes = ["Viking", "Knight"];\nheroes.forEach((h) => {\n  console.log("Hi " + h);\n});`,n:['forEach برای هر عضو یه کار انجام میده و چیزی برنمی‌گردونه.','forEach does something for each item and returns nothing.']},
    {c:`const prices = [10, 25, 40];\nconst total = prices.reduce((sum, p) => sum + p, 0);\nconsole.log(total);`,n:['reduce همه‌ی عضوها رو توی یه مقدار جمع می‌کنه. اینجا ۷۵.','reduce combines all items into one value. Here it is 75.']}],
 q:{p:['با filter فقط عددهای زوج آرایه‌ی nums رو نگه دار و آرایه‌ی نتیجه رو چاپ کن.','Use filter to keep only the even numbers of nums and print the resulting array.'],st:'const nums = [1, 2, 3, 4, 5, 6];\n',
    ok:(c,o)=>o.replace(/\s/g,'')==='[2,4,6]'&&/filter/.test(c),h:['nums.filter((n) => n % 2 === 0)','nums.filter((n) => n % 2 === 0)'],sol:'const nums = [1, 2, 3, 4, 5, 6];\nconsole.log(nums.filter((n) => n % 2 === 0));'}},
{t:['شیء Math','The Math object'],
 s:[['جاوااسکریپت یه جعبه‌ابزار ریاضی داره:\nMath.round گرد کردن ، Math.floor گرد به پایین ، Math.ceil گرد به بالا ، Math.max بزرگ‌ترین ، Math.min کوچک‌ترین ، Math.abs قدر مطلق ، Math.sqrt جذر ، Math.random عدد تصادفی بین ۰ و ۱','JavaScript has a math toolbox:\nMath.round, Math.floor (down), Math.ceil (up), Math.max, Math.min, Math.abs, Math.sqrt, Math.random (a random number between 0 and 1)',`console.log(Math.round(4.6));\nconsole.log(Math.floor(4.9));\nconsole.log(Math.max(3, 9, 5));\nconsole.log(Math.sqrt(16));\nconsole.log(Math.abs(-7));`]],
 e:[{c:`const dice = Math.floor(Math.random() * 6) + 1;\nconsole.log(dice >= 1 && dice <= 6);`,n:['این فرمول یه تاس ۶ وجهی میندازه (۱ تا ۶). چون عدد هر بار فرق می‌کنه، فقط چک می‌کنیم توی بازه باشه.','This formula rolls a six-sided die (1 to 6). The number differs every time so we only check it is in range.']},
    {c:`const prices = [10, 25, 40];\nconsole.log(Math.max(...prices));\nconsole.log(Math.min(...prices));`,n:['سه نقطه (...) آرایه رو به عددهای جدا باز می‌کنه.','The three dots (...) spread an array into separate numbers.']}],
 q:{p:['اول ۹.۲ رو با Math.ceil گرد به بالا کن و چاپ کن، بعد جذر ۸۱ رو با Math.sqrt چاپ کن.','First round 9.2 up with Math.ceil and print it, then print the square root of 81 with Math.sqrt.'],st:'',
    ok:(c,o)=>o.trim().split('\n').join(',')==='10,9'&&/Math\.ceil/.test(c)&&/Math\.sqrt/.test(c),h:['console.log(Math.ceil(9.2));\nconsole.log(Math.sqrt(81));','console.log(Math.ceil(9.2));\nconsole.log(Math.sqrt(81));'],sol:'console.log(Math.ceil(9.2));\nconsole.log(Math.sqrt(81));'}},
{t:['چالش نهایی','Final challenge'],
 s:[['وقتشه همه‌چیز رو ترکیب کنی: تابع، آرایه، شرط، حلقه و متدهای آرایه!\nاین مثال با تابع و filter عددهای زوج رو جدا می‌کنه.','Time to combine everything: functions, arrays, conditions, loops and array methods!\nThis example uses a function and filter to pick the even numbers.',`function evens(list) {\n  return list.filter((n) => n % 2 === 0);\n}\nconsole.log(evens([1, 2, 3, 4]));`]],
 e:[{c:`function total(items) {\n  let sum = 0;\n  for (const x of items) {\n    sum += x;\n  }\n  return sum;\n}\nconsole.log(total([1, 2, 3]));`,n:['حلقه و متغیر برای جمع کردن همه‌ی عضوها.','A loop and a variable to add up all the items.']},
    {c:`const heroes = [\n  { name: "Arthur", level: 5 },\n  { name: "Ragnar", level: 7 }\n];\nfor (const h of heroes) {\n  console.log(h.name + " is level " + h.level);\n}`,n:['آرایه‌ای از شیءها؛ خیلی رایج توی برنامه‌های واقعی.','An array of objects; very common in real programs.']}],
 q:{p:['تابع countPassed رو کامل کن: یه آرایه‌ی نمره می‌گیره و تعداد نمره‌های ۵۰ یا بیشتر رو برمی‌گردونه.','Finish the function countPassed: it takes an array of scores and returns how many are 50 or more.'],st:'function countPassed(scores) {\n  // return how many scores are 50 or more\n}\n\nconsole.log(countPassed([30, 70, 50, 90]));\n',
    ok:(c,o)=>o.trim()==='3'&&/\breturn\b/.test(c),h:['return scores.filter((s) => s >= 50).length;','return scores.filter((s) => s >= 50).length;'],sol:'function countPassed(scores) {\n  return scores.filter((s) => s >= 50).length;\n}\n\nconsole.log(countPassed([30, 70, 50, 90]));'}}
);

LESSONS.html.push(
{t:['عکس','Images'],
 s:[['با تگ <img> عکس میذاریم. این تگ بسته نمی‌خواد. دو ویژگی مهم داره:\nsrc آدرس عکس (فایل کنار صفحه یا لینک)\nalt متن جایگزین که اگه عکس نیومد یا برای نابینایان خونده میشه.\nبا width هم اندازه رو تعیین می‌کنیم.\n(اینجا هر عکسی رو با قهرمان پیکسلی خودت نشون میدیم!)','The <img> tag shows a picture. It needs no closing tag and has two key attributes:\nsrc is the image address (a file next to the page or a link)\nalt is replacement text shown if the image fails, and read to blind users.\nwidth sets the size.\n(Here every image is shown as your pixel hero!)',`<img src="hero.png" alt="Hero" width="100">`]],
 e:[{c:`<h2>My Hero</h2>\n<img src="hero.png" alt="A brave hero" width="120">`,n:['تیتر و بعدش عکس.','A heading followed by a picture.']},
    {c:`<a href="https://github.com">\n  <img src="logo.png" alt="GitHub logo" width="80">\n</a>`,n:['اگه عکس رو داخل a بذاری، عکس لینک میشه.','Put an image inside a and the image becomes a link.']}],
 q:{p:['یه عکس بذار که هم src و هم متن alt داشته باشه.','Add an image that has both src and an alt text.'],st:'',
    ok:(c,o,d)=>{const i=d.querySelector('img');return !!i&&(i.getAttribute('src')||'').trim()!==''&&(i.getAttribute('alt')||'').trim()!==''},h:['<img src="hero.png" alt="My hero">','<img src="hero.png" alt="My hero">'],sol:'<img src="hero.png" alt="My hero">'}},
{t:['جدول','Tables'],
 s:[['جدول با <table> ساخته میشه. هر ردیف <tr> هست، سلول سرتیتر <th> و سلول معمولی <td>.\nبا یه CSS ساده هم کادر بهش میدیم.','A table uses <table>. Each row is <tr>, a header cell is <th> and a normal cell is <td>.\nA little CSS gives it borders.',`<style>\n  td, th { border: 1px solid black; padding: 6px; }\n</style>\n<table>\n  <tr><th>Name</th><th>Level</th></tr>\n  <tr><td>Arthur</td><td>5</td></tr>\n</table>`]],
 e:[{c:`<table border="1">\n  <tr><td>A</td><td>B</td></tr>\n  <tr><td>C</td><td>D</td></tr>\n</table>`,n:['یه جدول ۲ در ۲. ویژگی border ساده‌ترین راه برای کادره.','A 2 by 2 table. The border attribute is the simplest way to get lines.']},
    {c:`<style>\n  table { border-collapse: collapse; }\n  td, th { border: 2px solid purple; padding: 8px; }\n  th { background: gold; }\n</style>\n<table>\n  <tr><th>Hero</th><th>HP</th></tr>\n  <tr><td>Viking</td><td>120</td></tr>\n  <tr><td>Knight</td><td>150</td></tr>\n</table>`,n:['border-collapse کادرهای دوتایی رو یکی می‌کنه.','border-collapse merges the double borders into one.']}],
 q:{p:['یه جدول بساز که یه ردیف سرتیتر (th) با ۲ سلول و یه ردیف داده با ۲ سلول (td) داشته باشه.','Build a table with a header row (th) of 2 cells and a data row of 2 cells (td).'],st:'<table border="1">\n  \n</table>',
    ok:(c,o,d)=>d.querySelectorAll('tr').length>=2&&d.querySelectorAll('th').length>=2&&d.querySelectorAll('td').length>=2,h:['<tr><th>A</th><th>B</th></tr>\n<tr><td>1</td><td>2</td></tr>','<tr><th>A</th><th>B</th></tr>\n<tr><td>1</td><td>2</td></tr>'],sol:'<table border="1">\n  <tr><th>A</th><th>B</th></tr>\n  <tr><td>1</td><td>2</td></tr>\n</table>'}},
{t:['فرم‌ها','Forms'],
 s:[['فرم برای گرفتن اطلاعات از کاربره:\n<label> برچسب کنار فیلد ، <input type="..."> فیلد ورودی (text, password, email, checkbox) ، <select> با چند <option> لیست کشویی ، <textarea> متن چندخطی','A form collects information from the user:\n<label> a caption, <input type="..."> an input (text, password, email, checkbox), <select> with several <option> a dropdown, <textarea> multi-line text',`<label>Name:</label>\n<input type="text" placeholder="Hero name">\n<br>\n<label>Class:</label>\n<select>\n  <option>Knight</option>\n  <option>Wizard</option>\n</select>`]],
 e:[{c:`<form>\n  <label>Email:</label>\n  <input type="email">\n  <br>\n  <input type="checkbox"> I agree\n  <br>\n  <button>Send</button>\n</form>`,n:['type="checkbox" یه تیک‌باکس می‌سازه.','type="checkbox" makes a tick box.']},
    {c:`<label>Message:</label>\n<br>\n<textarea rows="3" cols="25"></textarea>`,n:['textarea برای نوشتن متن‌های طولانیه.','textarea is for writing longer text.']}],
 q:{p:['یه form بساز که یه label، یه input و یه select با حداقل ۲ تا option داشته باشه.','Build a form with a label, an input and a select with at least 2 options.'],st:'<form>\n  \n</form>',
    ok:(c,o,d)=>!!d.querySelector('form')&&!!d.querySelector('label')&&!!d.querySelector('input')&&!!d.querySelector('select')&&d.querySelectorAll('option').length>=2,h:['<select>\n  <option>A</option>\n  <option>B</option>\n</select>','<select>\n  <option>A</option>\n  <option>B</option>\n</select>'],sol:'<form>\n  <label>Name:</label>\n  <input type="text">\n  <select>\n    <option>A</option>\n    <option>B</option>\n  </select>\n</form>'}},
{t:['چیدمان صفحه','Page layout tags'],
 s:[['تگ‌های معنی‌دار صفحه رو مرتب‌تر و برای موتورهای جستجو قابل‌فهم‌تر می‌کنن:\n<header> بالای صفحه ، <nav> منوی لینک‌ها ، <main> محتوای اصلی ، <section> یه بخش ، <footer> پایین صفحه','Semantic tags make a page tidier and easier for search engines:\n<header> top of the page, <nav> menu links, <main> main content, <section> a section, <footer> bottom of the page',`<header><h1>My Game</h1></header>\n<nav><a href="#">Home</a> <a href="#">About</a></nav>\n<main>\n  <p>Welcome!</p>\n</main>\n<footer>Made by me</footer>`]],
 e:[{c:`<main>\n  <section>\n    <h2>Quests</h2>\n    <p>Find the key.</p>\n  </section>\n  <section>\n    <h2>Heroes</h2>\n    <p>Pick one.</p>\n  </section>\n</main>`,n:['هر section یه بخش مستقله.','Each section is an independent part.']},
    {c:`<nav>\n  <ul>\n    <li><a href="#">Home</a></li>\n    <li><a href="#">Play</a></li>\n  </ul>\n</nav>`,n:['منوی سایت‌ها معمولا یه لیست از لینک‌ها داخل nav هست.','A site menu is usually a list of links inside nav.']}],
 q:{p:['یه صفحه بساز که header، main و footer داشته باشه و داخل هرکدوم یه متن باشه.','Build a page with a header, a main and a footer, each containing some text.'],st:'',
    ok:(c,o,d)=>['header','main','footer'].every(t=>{const x=d.querySelector(t);return !!x&&x.textContent.trim()!==''}),h:['<header>...</header>\n<main>...</main>\n<footer>...</footer>','<header>...</header>\n<main>...</main>\n<footer>...</footer>'],sol:'<header>Top</header>\n<main>Content</main>\n<footer>Bottom</footer>'}},
{t:['جعبه‌ی CSS','The CSS box model'],
 s:[['هر تگ یه جعبه‌ست که چهار لایه داره (از داخل به بیرون):\nمحتوا ← padding (فاصله‌ی داخل) ← border (کادر) ← margin (فاصله‌ی بیرون)\nمثل یه قاب عکس: عکس، حاشیه‌ی داخل، قاب، فاصله تا دیوار.','Every tag is a box with four layers (inside out):\ncontent ← padding (inner space) ← border ← margin (outer space)\nLike a picture frame: the picture, inner mat, the frame, space to the wall.',`<style>\n  .box {\n    border: 3px solid purple;\n    padding: 16px;\n    margin: 20px;\n  }\n</style>\n<div class="box">Hello box</div>`]],
 e:[{c:`<style>\n  .a { background: gold; padding: 30px; }\n  .b { background: lightblue; padding: 4px; }\n</style>\n<div class="a">Big padding</div>\n<div class="b">Small padding</div>`,n:['padding فاصله‌ی بین متن و لبه‌ی جعبه‌ست.','padding is the space between the text and the edge of the box.']},
    {c:`<style>\n  .card { width: 150px; height: 80px; background: gold; border-radius: 12px; }\n</style>\n<div class="card">Card</div>`,n:['width و height اندازه و border-radius گوشه‌ها رو گرد می‌کنه.','width and height set the size and border-radius rounds the corners.']}],
 q:{p:['یه div با کلاس card بساز و توی <style> برای .card هم border، هم padding و هم margin بنویس.','Create a div with class card and in <style> give .card a border, a padding and a margin.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>{const m=/\.card\s*\{([^}]*)\}/.exec(c);return !!d.querySelector('div.card')&&!!m&&/padding\s*:/.test(m[1])&&/margin\s*:/.test(m[1])&&/border\s*:/.test(m[1])},h:['.card { border: 2px solid red; padding: 10px; margin: 10px; }','.card { border: 2px solid red; padding: 10px; margin: 10px; }'],sol:'<style>\n  .card { border: 2px solid red; padding: 10px; margin: 10px; }\n</style>\n<div class="card">Hi</div>'}},
{t:['فلکس‌باکس','Flexbox'],
 s:[['flexbox بهترین راه برای کنار هم چیدن چیزهاست. به جعبه‌ی بیرونی display: flex میدی و بچه‌ها کنار هم میشینن.\ngap فاصله‌ی بینشون و justify-content چیدمانشون رو تنظیم می‌کنه.','Flexbox is the best way to line things up. Give the outer box display: flex and its children sit side by side.\ngap sets the space between them and justify-content arranges them.',`<style>\n  .row { display: flex; gap: 10px; }\n  .row div { background: gold; padding: 10px; }\n</style>\n<div class="row">\n  <div>1</div>\n  <div>2</div>\n  <div>3</div>\n</div>`]],
 e:[{c:`<style>\n  .row { display: flex; justify-content: center; gap: 8px; }\n  .row div { background: lightgreen; padding: 10px; }\n</style>\n<div class="row">\n  <div>A</div>\n  <div>B</div>\n</div>`,n:['justify-content: center بچه‌ها رو وسط میذاره.','justify-content: center puts the children in the middle.']},
    {c:`<style>\n  .col { display: flex; flex-direction: column; gap: 6px; width: 120px; }\n  .col div { background: pink; padding: 8px; }\n</style>\n<div class="col">\n  <div>Top</div>\n  <div>Middle</div>\n  <div>Bottom</div>\n</div>`,n:['flex-direction: column بچه‌ها رو زیر هم میچینه.','flex-direction: column stacks the children vertically.']}],
 q:{p:['یه div با کلاس menu بساز که ۳ تا لینک (a) داشته باشه و توی CSS با display: flex کنار هم بچینشون.','Create a div with class menu holding 3 links (a) and line them up with display: flex in CSS.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>!!d.querySelector('div.menu')&&/\.menu\s*\{[^}]*display\s*:\s*flex/.test(c)&&d.querySelectorAll('a').length>=3,h:['.menu { display: flex; gap: 10px; }','.menu { display: flex; gap: 10px; }'],sol:'<style>\n  .menu { display: flex; gap: 10px; }\n</style>\n<div class="menu">\n  <a href="#">One</a>\n  <a href="#">Two</a>\n  <a href="#">Three</a>\n</div>'}},
{t:['hover و انتخابگرها','Hover & selectors'],
 s:[['با :hover میشه ظاهر یه تگ رو وقتی موس (یا انگشت) روشه تغییر داد. این کار صفحه رو زنده می‌کنه!\nعلاوه بر کلاس (.name) با شناسه هم میشه انتخاب کرد: id="title" و توی CSS با #title.','With :hover you can change a tag while the mouse (or finger) is over it. It brings pages to life!\nBesides classes (.name) you can select by id: id="title" and #title in CSS.',`<style>\n  button { background: gold; padding: 10px; border: 0; }\n  button:hover { background: orange; }\n</style>\n<button>Hover me!</button>`]],
 e:[{c:`<style>\n  #title { color: purple; }\n</style>\n<h1 id="title">I am purple</h1>\n<h1>I am normal</h1>`,n:['#title فقط تگی رو انتخاب می‌کنه که id اون باشه.','#title selects only the tag with that id.']},
    {c:`<style>\n  a { color: blue; }\n  a:hover { color: red; text-decoration: underline; }\n</style>\n<a href="#">Hover this link</a>`,n:['رنگ لینک وقتی موس روشه قرمز میشه.','The link turns red when the mouse is over it.']}],
 q:{p:['یه button بساز و با یه قانون :hover کاری کن وقتی موس روشه رنگ پس‌زمینه‌اش عوض بشه.','Create a button and add a :hover rule that changes its background color when the mouse is over it.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>!!d.querySelector('button')&&/:hover\s*\{[^}]*background[^}]*\}/.test(c),h:['button:hover { background: orange; }','button:hover { background: orange; }'],sol:'<style>\n  button:hover { background: orange; }\n</style>\n<button>Click</button>'}},
{t:['چالش نهایی','Final challenge'],
 s:[['وقتشه یه کارت قهرمان کامل بسازی! عکس، تیتر، متن و یه استایل قشنگ با هم.\nاین نمونه رو ببین:','Time to build a full hero card! An image, a heading, text and nice styling together.\nHave a look at this sample:',`<style>\n  .card { background: #2a1850; color: white; padding: 16px; border-radius: 12px; width: 180px; text-align: center; }\n</style>\n<div class="card">\n  <img src="hero.png" alt="Hero" width="80">\n  <h2>Arthur</h2>\n  <p>Level 5 Knight</p>\n</div>`]],
 e:[{c:`<style>\n  body { background: #222; color: white; }\n</style>\n<h1>Dark mode</h1>\n<p>Easy on the eyes.</p>`,n:['میشه حتی برای کل body استایل نوشت.','You can even style the whole body.']},
    {c:`<style>\n  .team { display: flex; gap: 10px; }\n  .team div { background: gold; padding: 12px; border-radius: 8px; }\n</style>\n<div class="team">\n  <div>Viking</div>\n  <div>Knight</div>\n  <div>Wizard</div>\n</div>`,n:['فلکس‌باکس و padding و گوشه‌ی گرد باهم.','Flexbox, padding and rounded corners together.']}],
 q:{p:['یه div با کلاس card بساز که یه عکس (img)، یه تیتر h2 و یه پاراگراف p توش باشه. توی CSS برای .card هم background و هم padding بذار.','Build a div with class card containing an image (img), an h2 heading and a p paragraph. In CSS give .card both a background and a padding.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>{const m=/\.card\s*\{([^}]*)\}/.exec(c);return !!d.querySelector('div.card')&&!!d.querySelector('img')&&!!d.querySelector('h2')&&!!d.querySelector('p')&&!!m&&/background/.test(m[1])&&/padding/.test(m[1])},h:['<div class="card">\n  <img ...>\n  <h2>...</h2>\n  <p>...</p>\n</div>','<div class="card">\n  <img ...>\n  <h2>...</h2>\n  <p>...</p>\n</div>'],sol:'<style>\n  .card { background: gold; padding: 12px; }\n</style>\n<div class="card">\n  <img src="hero.png" alt="Hero" width="60">\n  <h2>Arthur</h2>\n  <p>Knight</p>\n</div>'}}
);

LESSONS.node.push(
{t:['JSON','JSON'],
 s:[['JSON یه قالب متنی برای ذخیره و ارسال داده‌ست؛ همه‌جا استفاده میشه.\nJSON.stringify شیء رو به متن JSON تبدیل می‌کنه و JSON.parse متن رو دوباره به شیء برمی‌گردونه.','JSON is a text format for storing and sending data, used everywhere.\nJSON.stringify turns an object into JSON text and JSON.parse turns text back into an object.',`const hero = { name: "Arthur", level: 5 };\nconst text = JSON.stringify(hero);\nconsole.log(text);\nconst back = JSON.parse(text);\nconsole.log(back.name);`]],
 e:[{c:`const fs = require("fs");\nfs.writeFileSync("save.json", JSON.stringify({ gold: 50 }));\nconst data = JSON.parse(fs.readFileSync("save.json", "utf8"));\nconsole.log(data.gold);`,n:['ذخیره‌ی بازی: شیء رو متن می‌کنیم، توی فایل می‌نویسیم و بعدا دوباره می‌خونیم.','A game save: turn the object into text, write it to a file and read it back later.']},
    {c:`console.log(JSON.stringify([1, 2, 3]));\nconsole.log(JSON.stringify({ a: 1 }, null, 2));`,n:['آرگومان‌های null و 2 خروجی رو خوانا و تو‌رفته می‌کنن.','The arguments null and 2 make the output nicely indented.']}],
 q:{p:['شیء { name: "Hero", xp: 10 } رو با JSON.stringify به متن تبدیل کن و چاپ کن.','Turn the object { name: "Hero", xp: 10 } into text with JSON.stringify and print it.'],st:'',
    ok:(c,o)=>{try{const x=JSON.parse(o.trim());return x.name==='Hero'&&x.xp===10}catch(e){return false}},h:['console.log(JSON.stringify({ name: "Hero", xp: 10 }));','console.log(JSON.stringify({ name: "Hero", xp: 10 }));'],sol:'console.log(JSON.stringify({ name: "Hero", xp: 10 }));'}},
{t:['متغیرهای محیطی','Environment variables'],
 s:[['تنظیمات برنامه (مثل پورت یا رمزها) رو معمولا توی «متغیرهای محیطی» میذارن، نه توی خود کد. توی Node با process.env.NAME میخونیمشون.\nاگه نباشن مقدارشون undefined هست؛ پس با || یه مقدار پیش‌فرض میذاریم.\n(توی ترمینال لینوکس/مک: PORT=8080 node app.js)','App settings (like the port or secrets) usually live in “environment variables”, not in the code. In Node we read them with process.env.NAME.\nIf missing they are undefined, so we add a default with ||.\n(In a Linux/Mac terminal: PORT=8080 node app.js)',`const port = process.env.PORT || 3000;\nconsole.log(port);\nconsole.log(process.env.HERO);`]],
 e:[{c:`const name = process.env.USER_NAME || "Guest";\nconsole.log("Hello " + name);`,n:['متغیر USER_NAME تنظیم نشده، پس Guest استفاده میشه.','USER_NAME is not set so Guest is used.']},
    {c:`const mode = process.env.MODE || "development";\nif (mode === "production") {\n  console.log("Live!");\n} else {\n  console.log("Testing...");\n}`,n:['برنامه بر اساس محیط رفتار متفاوتی داره.','The program behaves differently depending on the environment.']}],
 q:{p:['مقدار process.env.PORT رو بگیر؛ اگه نبود از ۸۰۸۰ استفاده کن و اون رو چاپ کن.','Read process.env.PORT; if it is missing use 8080 and print it.'],st:'',
    ok:(c,o)=>o.trim()==='8080'&&/process\.env\.PORT/.test(c)&&/\|\|/.test(c),h:['const port = process.env.PORT || 8080;','const port = process.env.PORT || 8080;'],sol:'const port = process.env.PORT || 8080;\nconsole.log(port);'}},
{t:['ماژول‌ها','Modules'],
 s:[['توی Node هر فایل یه ماژوله. با module.exports چیزهایی که میخوایم به بقیه بدیم رو بیرون میدیم و توی فایل دیگه با require("./اسم‌فایل") می‌گیریمشون.\nتوی یه پروژه‌ی واقعی اینا دو فایلن؛ اینجا برای تمرین توی یه فایل نوشتیم.','In Node every file is a module. With module.exports we share things and in another file we load them with require("./filename").\nIn a real project these are two files; here we keep them in one for practice.',`// math.js\nfunction add(a, b) {\n  return a + b;\n}\nmodule.exports = { add };\n\n// app.js would do:\n// const { add } = require("./math");\nconsole.log(module.exports.add(2, 3));`]],
 e:[{c:`module.exports = { name: "Castle", open: true };\nconsole.log(module.exports.name);`,n:['هر چیزی رو میشه export کرد؛ شیء، تابع، عدد...','You can export anything: objects, functions, numbers...']},
    {c:`const { add, sub } = {\n  add: (a, b) => a + b,\n  sub: (a, b) => a - b\n};\nconsole.log(add(5, 2));\nconsole.log(sub(5, 2));`,n:['اینجا destructuring داریم؛ دقیقا همون چیزی که با require هم می‌نویسیم.','This is destructuring, exactly what we also write with require.']}],
 q:{p:['تابع square(n) رو بنویس که n*n برگردونه. با module.exports بیرونش بده و square(6) رو از همون‌جا صدا بزن و چاپ کن.','Write a function square(n) that returns n*n. Export it with module.exports, then call square(6) through it and print the result.'],st:'function square(n) {\n  return n * n;\n}\n// export it, then print square(6) using module.exports\n',
    ok:(c,o)=>o.trim()==='36'&&/module\.exports/.test(c),h:['module.exports = { square };\nconsole.log(module.exports.square(6));','module.exports = { square };\nconsole.log(module.exports.square(6));'],sol:'function square(n) {\n  return n * n;\n}\nmodule.exports = { square };\nconsole.log(module.exports.square(6));'}},
{t:['کال‌بک و setTimeout','Callbacks & setTimeout'],
 s:[['Node غیرهمزمان (async) کار می‌کنه؛ یعنی منتظر کارهای کند نمی‌مونه. setTimeout(تابع, میلی‌ثانیه) یه تابع رو بعدا اجرا می‌کنه و برنامه همزمان ادامه پیدا می‌کنه.\nبه تابعی که بعدا صدا زده میشه «کال‌بک» میگن. (اینجا زمان شبیه‌سازیه و سریع می‌گذره!)','Node works asynchronously: it does not wait around for slow jobs. setTimeout(function, milliseconds) runs a function later while the program keeps going.\nA function that gets called later is called a “callback”. (Time is simulated here so it passes instantly!)',`console.log("Start");\nsetTimeout(() => {\n  console.log("Later (after 1 second)");\n}, 1000);\nconsole.log("End");`],
     ['خوندن فایل هم کال‌بکی هست: fs.readFile وقتی کارش تموم شد تابع ما رو صدا می‌زنه (err اگه مشکلی بود، data محتوای فایله).','Reading a file also uses a callback: fs.readFile calls our function when finished (err if something went wrong, data is the file content).',`const fs = require("fs");\nfs.writeFileSync("a.txt", "Hi!");\nfs.readFile("a.txt", "utf8", (err, data) => {\n  console.log(data);\n});\nconsole.log("Reading...");`]],
 e:[{c:`setTimeout(() => console.log("B"), 200);\nsetTimeout(() => console.log("A"), 100);\nconsole.log("Go");`,n:['اول Go (همزمان)، بعد A (۱۰۰ms) و بعد B (۲۰۰ms). ترتیب بر اساس زمانه نه ترتیب نوشتن.','First Go (immediate), then A (100ms) and then B (200ms). Order depends on time, not on writing order.']},
    {c:`setTimeout(() => {\n  console.log("3");\n  setTimeout(() => {\n    console.log("2");\n  }, 500);\n}, 500);`,n:['کال‌بک توی کال‌بک؛ اگه زیاد تو در تو بشه بهش میگن «جهنم کال‌بک» و برای همین Promise اومد!','A callback inside a callback; too many levels is called “callback hell”, which is why Promises were invented!']}],
 q:{p:['اول Ready رو چاپ کن، بعد با setTimeout و تاخیر ۵۰۰ میلی‌ثانیه، Boom! رو چاپ کن.','Print Ready first, then use setTimeout with a 500 ms delay to print Boom!.'],st:'',
    ok:(c,o)=>o.trim().split('\n').join(',')==='Ready,Boom!'&&/setTimeout/.test(c),h:['console.log("Ready");\nsetTimeout(() => console.log("Boom!"), 500);','console.log("Ready");\nsetTimeout(() => console.log("Boom!"), 500);'],sol:'console.log("Ready");\nsetTimeout(() => {\n  console.log("Boom!");\n}, 500);'}},
{t:['Promise','Promises'],
 s:[['Promise یعنی «قول یه نتیجه در آینده». وقتی کار تموم شد با resolve موفقیت و با reject شکست رو اعلام می‌کنه.\nبا .then نتیجه‌ی موفق و با .catch خطا رو می‌گیریم.','A Promise is a “promise of a future result”. When the job finishes it calls resolve for success or reject for failure.\nWe catch the success with .then and the error with .catch.',`const wait = new Promise((resolve) => {\n  setTimeout(() => resolve("Quest done!"), 1000);\n});\nwait.then((msg) => console.log(msg));\nconsole.log("Waiting...");`]],
 e:[{c:`const p = new Promise((resolve, reject) => {\n  reject(new Error("Dragon!"));\n});\np.catch((err) => console.log("Caught:", err.message));`,n:['reject یه خطا می‌فرسته و catch اون رو می‌گیره.','reject sends an error and catch handles it.']},
    {c:`Promise.resolve(2)\n  .then((n) => n * 5)\n  .then((n) => console.log(n));`,n:['then ها رو میشه زنجیره‌ای نوشت؛ خروجی هر کدوم ورودی بعدیه.','then calls can be chained; each output is the next input.']}],
 q:{p:['تابع delay رو کامل کن: یه Promise برگردونه که بعد از ms میلی‌ثانیه با مقدار "Done" resolve بشه (از setTimeout استفاده کن).','Finish the function delay: return a Promise that resolves with "Done" after ms milliseconds (use setTimeout).'],st:'function delay(ms) {\n  return new Promise((resolve) => {\n    // call resolve("Done") after ms\n  });\n}\n\ndelay(300).then((v) => console.log(v));\n',
    ok:(c,o)=>o.trim()==='Done'&&/resolve\s*\(/.test(c)&&/setTimeout/.test(c),h:['setTimeout(() => resolve("Done"), ms);','setTimeout(() => resolve("Done"), ms);'],sol:'function delay(ms) {\n  return new Promise((resolve) => {\n    setTimeout(() => resolve("Done"), ms);\n  });\n}\n\ndelay(300).then((v) => console.log(v));'}},
{t:['async و await','async & await'],
 s:[['async/await کار با Promise رو شبیه کد معمولی می‌کنه. تابع رو async تعریف می‌کنی و داخلش با await منتظر نتیجه‌ی Promise می‌مونی.\nخیلی خواناتر از زنجیره‌ی then!','async/await makes Promises read like normal code. Declare the function async and inside it use await to wait for a Promise’s result.\nMuch more readable than a then chain!',`function wait(ms) {\n  return new Promise((r) => setTimeout(r, ms));\n}\n\nasync function main() {\n  console.log("Walking...");\n  await wait(1000);\n  console.log("Arrived!");\n}\nmain();`]],
 e:[{c:`async function getGold() {\n  return 100;\n}\n\nasync function run() {\n  const gold = await getGold();\n  console.log(gold + 50);\n}\nrun();`,n:['تابع async همیشه یه Promise برمی‌گردونه و await جوابش رو باز می‌کنه.','An async function always returns a Promise and await unwraps its answer.']},
    {c:`async function main() {\n  try {\n    await Promise.reject(new Error("Trap!"));\n  } catch (e) {\n    console.log("Caught " + e.message);\n  }\n}\nmain();`,n:['خطاها رو با try/catch معمولی می‌گیریم.','We catch errors with an ordinary try/catch.']}],
 q:{p:['یه تابع async بنویس که ۲۰۰ میلی‌ثانیه با await wait(200) صبر کنه و بعد Level up! رو چاپ کنه. بعدش صداش بزن.','Write an async function that waits 200 ms with await wait(200) and then prints Level up!. Then call it.'],st:'function wait(ms) {\n  return new Promise((r) => setTimeout(r, ms));\n}\n\n// write an async function and call it\n',
    ok:(c,o)=>o.trim()==='Level up!'&&/\bawait\b/.test(c)&&/\basync\b/.test(c),h:['async function main() {\n  await wait(200);\n  console.log("Level up!");\n}\nmain();','async function main() {\n  await wait(200);\n  console.log("Level up!");\n}\nmain();'],sol:'function wait(ms) {\n  return new Promise((r) => setTimeout(r, ms));\n}\n\nasync function main() {\n  await wait(200);\n  console.log("Level up!");\n}\nmain();'}},
{t:['مسیریابی سرور','Server routing'],
 s:[['سرور می‌تونه برای آدرس‌های مختلف جواب‌های مختلف بده. آدرسی که کاربر خواسته توی req.url هست. با res.statusCode کد وضعیت رو تنظیم می‌کنیم (۲۰۰ موفق، ۴۰۴ پیدا نشد).\nاینجا شبیه‌ساز چند درخواست به سرورت می‌فرسته و جواب‌ها رو با 🌐 نشون میده.','A server can answer differently for different addresses. The requested address is in req.url. res.statusCode sets the status (200 OK, 404 not found).\nHere a simulator sends a few requests to your server and shows the answers with 🌐.',`const http = require("http");\nconst server = http.createServer((req, res) => {\n  if (req.url === "/") {\n    res.end("Home");\n  } else if (req.url === "/about") {\n    res.end("About us");\n  } else {\n    res.statusCode = 404;\n    res.end("Not found");\n  }\n});\nserver.listen(3000, () => console.log("Server is up"));`]],
 e:[{c:`const http = require("http");\nhttp.createServer((req, res) => {\n  res.end("You asked for " + req.url);\n}).listen(3000);`,n:['سرور آدرس درخواستی رو توی جوابش برمی‌گردونه.','The server echoes the requested address in its answer.']},
    {c:`const http = require("http");\nhttp.createServer((req, res) => {\n  res.setHeader("Content-Type", "application/json");\n  res.end(JSON.stringify({ ok: true }));\n}).listen(3000);`,n:['سرورها معمولا JSON برمی‌گردونن تا برنامه‌های دیگه بخونن.','Servers often return JSON so other apps can read it.']}],
 q:{p:['سرور رو طوری بنویس که برای /hero بنویسه Arthur (کد ۲۰۰) و برای هر آدرس دیگه کد ۴۰۴ و متن Not found برگردونه.','Write the server so that /hero answers Arthur (status 200) and every other address answers status 404 with the text Not found.'],st:'const http = require("http");\n\nconst server = http.createServer((req, res) => {\n  // /hero -> Arthur (200)\n  // anything else -> 404 and "Not found"\n  res.end("...");\n});\nserver.listen(3000);\n',
    ok:(c,o)=>/GET \/hero \[200\] Arthur/.test(o)&&/GET \/missing \[404\] Not found/.test(o)&&/GET \/about \[404\] Not found/.test(o),h:['if (req.url === "/hero") {\n  res.end("Arthur");\n} else {\n  res.statusCode = 404;\n  res.end("Not found");\n}','if (req.url === "/hero") {\n  res.end("Arthur");\n} else {\n  res.statusCode = 404;\n  res.end("Not found");\n}'],sol:'const http = require("http");\n\nconst server = http.createServer((req, res) => {\n  if (req.url === "/hero") {\n    res.end("Arthur");\n  } else {\n    res.statusCode = 404;\n    res.end("Not found");\n  }\n});\nserver.listen(3000);'}},
{t:['npm و package.json','npm & package.json'],
 s:[['npm مدیر پکیج‌های Node هست. فایل package.json شناسنامه‌ی پروژه‌ست: اسم، نسخه، دستورها (scripts) و پکیج‌هایی که لازم داره (dependencies).\nدستورهای ترمینال:\nnpm init -y ← ساخت package.json\nnpm install express ← نصب یه پکیج\nnpm start ← اجرای دستور start','npm is Node’s package manager. The package.json file is the project’s ID card: name, version, commands (scripts) and the packages it needs (dependencies).\nTerminal commands:\nnpm init -y ← create package.json\nnpm install express ← install a package\nnpm start ← run the start script',`const pkg = {\n  name: "my-game",\n  version: "1.0.0",\n  scripts: { start: "node app.js" },\n  dependencies: { express: "^4.19.0" }\n};\nconsole.log(JSON.stringify(pkg, null, 2));`]],
 e:[{c:`const pkg = { name: "demo", version: "1.0.0" };\nconsole.log(pkg.name + "@" + pkg.version);`,n:['اسم‌پکیج@نسخه همون چیزیه که npm نشون میده.','name@version is what npm shows.']},
    {c:`const scripts = { start: "node app.js", test: "node test.js" };\nfor (const name in scripts) {\n  console.log("npm run " + name + " -> " + scripts[name]);\n}`,n:['هر script رو با npm run اسمش اجرا می‌کنی.','You run each script with npm run and its name.']}],
 q:{p:['یه شیء package با name برابر "code-flex"، version برابر "1.0.0" و scripts شامل start برابر "node app.js" بساز و با JSON.stringify چاپش کن.','Create a package object with name "code-flex", version "1.0.0" and scripts containing start equal to "node app.js", then print it with JSON.stringify.'],st:'',
    ok:(c,o)=>{try{const x=JSON.parse(o.trim());return x.name==='code-flex'&&x.version==='1.0.0'&&!!x.scripts&&x.scripts.start==='node app.js'}catch(e){return false}},h:['{ name: "code-flex", version: "1.0.0", scripts: { start: "node app.js" } }','{ name: "code-flex", version: "1.0.0", scripts: { start: "node app.js" } }'],sol:'const pkg = {\n  name: "code-flex",\n  version: "1.0.0",\n  scripts: { start: "node app.js" }\n};\nconsole.log(JSON.stringify(pkg));'}}

LESSONS.py.push(
/* 16 */
{t:['فرمت‌بندی با f-string','f-string formatting'],
 s:[['توی f-string بعد از : می‌تونی شکل نمایش مقدار رو مشخص کنی:\n:.2f  یعنی دو رقم اعشار\n:>6  یعنی راست‌چین توی ۶ جا\n:<6  چپ‌چین ، :^6 وسط‌چین\n:03d  یعنی عدد رو با صفر پر کن تا ۳ رقم بشه\n:,  یعنی جداکننده‌ی هزارگان\n:.0%  یعنی درصد',
   'Inside an f-string you can control how a value looks after the colon:\n:.2f two decimals\n:>6 right-align in 6 spaces\n:<6 left-align, :^6 centered\n:03d pad with zeros to 3 digits\n:, thousands separator\n:.0% percentage',
   `price = 3.14159\nprint(f"{price:.2f}")\nprint(f"{42:>6}|")\nprint(f"{7:03d}")\nprint(f"{1234567:,}")\nprint(f"{0.256:.1%}")`]],
 e:[{c:`heroes = [("Arthur", 120), ("Ragnar", 95)]\nfor name, hp in heroes:\n    print(f"{name:<8}{hp:>5}")`,n:['اسم‌ها چپ‌چین توی ۸ جا و عددها راست‌چین توی ۵ جا میان؛ ستون‌ها مرتب میشن.','Names are left-aligned in 8 spaces and numbers right-aligned in 5, so the columns line up.']},
    {c:`title = "Quest"\nprint(f"{title:*^11}")\nprint(f"{'gold':>8}: {250:,}")`,n:['قبل از ^ می‌تونی کاراکتر پرکننده بذاری (اینجا *).','You can put a fill character before ^ (here *).']}],
 q:{p:['hp برابر ۴۵ و max_hp برابر ۶۰ هست. نسبتشون رو به‌صورت درصد بدون اعشار (مثل 75%) با f-string چاپ کن.','hp is 45 and max_hp is 60. Print their ratio as a percentage with no decimals (like 75%) using an f-string.'],st:'hp = 45\nmax_hp = 60\n',
    ok:(c,o)=>o.trim()==='75%'&&/\{[^}]*:\.0%\}/.test(c),h:['print(f"{hp / max_hp:.0%}")','print(f"{hp / max_hp:.0%}")'],sol:'hp = 45\nmax_hp = 60\nprint(f"{hp / max_hp:.0%}")'}},
/* 17 */
{t:['تاپل و باز کردن مقادیر','Tuples & unpacking'],
 s:[['تاپل (tuple) مثل لیسته ولی بعد از ساخته شدن قابل تغییر نیست. با پرانتز ساخته میشه.\nمی‌تونی مقادیرش رو یک‌جا توی چند متغیر بریزی (unpacking). حتی جای دو متغیر رو با یک خط عوض کنی!',
   'A tuple is like a list but cannot be changed after it is made. It uses parentheses.\nYou can unpack its values into several variables at once. You can even swap two variables in one line!',
   `point = (3, 4)\nx, y = point\nprint(x, y)\nprint(point[0], len(point))\na, b = 1, 2\na, b = b, a\nprint(a, b)`]],
 e:[{c:`def min_max(nums):\n    return min(nums), max(nums)\n\nlow, high = min_max([4, 9, 1])\nprint(low, high)`,n:['یه تابع می‌تونه چند مقدار رو با کاما برگردونه؛ در واقع یه تاپل برمی‌گردونه.','A function can return several values separated by commas; it really returns a tuple.']},
    {c:`place = ("Castle", 10, 20)\nname, x, y = place\nprint(f"{name} at {x},{y}")\nprint(place)`,n:['تعداد متغیرها باید با تعداد عضوهای تاپل برابر باشه.','The number of variables must match the number of items in the tuple.']}],
 q:{p:['دو متغیر a = "Arthur" و b = "Ragnar" داریم. با یه خط تاپل جاشون رو عوض کن و اول a بعد b رو چاپ کن.','We have a = "Arthur" and b = "Ragnar". Swap them with one tuple line, then print a and then b.'],st:'a = "Arthur"\nb = "Ragnar"\n',
    ok:(c,o)=>o.trim()==='Ragnar\nArthur'&&/\ba\s*,\s*b\s*=\s*b\s*,\s*a\b/.test(c),h:['a, b = b, a','a, b = b, a'],sol:'a = "Arthur"\nb = "Ragnar"\na, b = b, a\nprint(a)\nprint(b)'}},
/* 18 */
{t:['مجموعه‌ها (set)','Sets'],
 s:[['set یه مجموعه‌ی بدون تکرار و بدون ترتیبه. با { } یا set() ساخته میشه.\nعضو تکراری خودکار حذف میشه. با & اشتراک، با | اجتماع و با - تفاضل می‌گیری.\nبرای دیدن ترتیب مرتب از sorted() استفاده کن.',
   'A set has no duplicates and no fixed order. Make one with { } or set().\nDuplicates vanish automatically. Use & for intersection, | for union and - for difference.\nUse sorted() to see a tidy order.',
   `tags = {"fire", "ice", "fire"}\nprint(len(tags))\ntags.add("wind")\nprint("ice" in tags)\na = {1, 2, 3}\nb = {2, 3, 4}\nprint(a & b)\nprint(a | b)\nprint(a - b)`]],
 e:[{c:`nums = [1, 2, 2, 3, 3, 3]\nprint(sorted(set(nums)))\nprint(len(set(nums)))`,n:['set(لیست) تکراری‌ها رو حذف می‌کنه؛ با sorted دوباره لیست مرتب می‌گیریم.','set(list) removes duplicates; sorted turns it back into an ordered list.']},
    {c:`mine = {"sword", "shield", "potion"}\nfriend = {"potion", "bow"}\nprint(sorted(mine & friend))\nprint(sorted(mine - friend))`,n:['& چیزهای مشترک و - چیزهایی که فقط تو داری رو نشون میده.','& shows what you share and - shows what only you have.']}],
 q:{p:['توی items چند آیتم تکراری هست. تعداد آیتم‌های «متفاوت» رو با set چاپ کن.','items contains duplicates. Print how many DIFFERENT items there are using a set.'],st:'items = ["sword", "shield", "sword", "potion", "potion"]\n',
    ok:(c,o)=>o.trim()==='3'&&/set\(/.test(c),h:['print(len(set(items)))','print(len(set(items)))'],sol:'items = ["sword", "shield", "sword", "potion", "potion"]\nprint(len(set(items)))'}},
/* 19 */
{t:['لیست‌کامپرهنشن','List comprehensions'],
 s:[['لیست‌کامپرهنشن یعنی ساختن یه لیست جدید توی یک خط:\n[عبارت for x in چیزی]\nمی‌تونی آخرش یه if هم بذاری تا فقط بعضی‌ها وارد بشن:\n[عبارت for x in چیزی if شرط]',
   'A list comprehension builds a new list in one line:\n[expression for x in something]\nAdd an if at the end to let only some items in:\n[expression for x in something if condition]',
   `squares = [n * n for n in range(1, 6)]\nprint(squares)\nevens = [n for n in range(10) if n % 2 == 0]\nprint(evens)\nnames = ["arthur", "ragnar"]\nprint([n.upper() for n in names])`]],
 e:[{c:`words = ["dragon", "elf", "wizard"]\nprint([len(w) for w in words])`,n:['برای هر کلمه طولش رو حساب می‌کنه و توی لیست جدید می‌ذاره.','For every word it computes the length and puts it in the new list.']},
    {c:`nums = [3, 8, 12, 5]\nprint(["big" if n > 6 else "small" for n in nums])\nprint([(x, x * x) for x in range(3)])`,n:['می‌تونی توی عبارت اول از if/else هم استفاده کنی.','You can use if/else in the first part too.']}],
 q:{p:['با یه لیست‌کامپرهنشن، مربع عددهای «فرد» از ۱ تا ۱۰ رو بساز و چاپ کن.','With one list comprehension, build the squares of the ODD numbers from 1 to 10 and print them.'],st:'',
    ok:(c,o)=>o.trim()==='[1, 9, 25, 49, 81]'&&/\[[^\]]*\bfor\b[^\]]*\bin\b[^\]]*\]/.test(c),h:['print([n * n for n in range(1, 11) if n % 2 == 1])','print([n * n for n in range(1, 11) if n % 2 == 1])'],sol:'print([n * n for n in range(1, 11) if n % 2 == 1])'}},
/* 20 */
{t:['lambda و ابزارهای تابعی','lambda & functional tools'],
 s:[['lambda یه تابع کوچیک بدون اسمه: lambda ورودی: خروجی\nخیلی به درد sorted، max، map و filter میخوره:\n• sorted(..., key=...) برای مرتب‌سازی با معیار دلخواه\n• map(f, لیست) روی همه اعمال می‌کنه\n• filter(f, لیست) فقط اونایی که شرط دارن رو نگه می‌داره',
   'A lambda is a tiny nameless function: lambda input: output\nIt is handy with sorted, max, map and filter:\n• sorted(..., key=...) sorts by your own rule\n• map(f, list) applies to everything\n• filter(f, list) keeps only items that pass',
   `double = lambda x: x * 2\nprint(double(4))\nheroes = [("Arthur", 5), ("Ragnar", 7), ("Lia", 3)]\nheroes.sort(key=lambda h: h[1])\nprint(heroes)\nprint(list(map(lambda x: x + 1, [1, 2, 3])))\nprint(list(filter(lambda x: x > 1, [1, 2, 3])))`]],
 e:[{c:`words = ["dragon", "elf", "wizard"]\nprint(sorted(words, key=len, reverse=True))`,n:['key=len یعنی بر اساس طول مرتب کن؛ reverse=True یعنی از بزرگ به کوچیک.','key=len sorts by length; reverse=True goes from big to small.']},
    {c:`heroes = [("Arthur", 5), ("Ragnar", 7), ("Lia", 3)]\nstrongest = max(heroes, key=lambda h: h[1])\nprint(strongest[0])`,n:['max با key پیدا می‌کنه کدوم عضو بزرگ‌ترین مقدار h[1] رو داره.','max with key finds the item with the biggest h[1].']}],
 q:{p:['لیست words رو بر اساس تعداد حروف (کوتاه به بلند) مرتب کن و با sorted و یه lambda چاپ کن.','Sort words by number of letters (short to long) with sorted and a lambda, then print it.'],st:'words = ["banana", "fig", "apple"]\n',
    ok:(c,o)=>o.trim()==="['fig', 'apple', 'banana']"&&/lambda/.test(c),h:['print(sorted(words, key=lambda w: len(w)))','print(sorted(words, key=lambda w: len(w)))'],sol:'words = ["banana", "fig", "apple"]\nprint(sorted(words, key=lambda w: len(w)))'}},
/* 21 */
{t:['مدیریت خطا: try و except','Handling errors: try & except'],
 s:[['وقتی یه خطا (exception) پیش میاد برنامه می‌ترکه. با try کدِ خطرناک رو امتحان می‌کنیم و با except خطا رو می‌گیریم تا برنامه ادامه بده.\nfinally همیشه اجرا میشه، چه خطا باشه چه نه.\nبا as e می‌تونی پیام خطا رو ببینی.',
   'When an error (exception) happens the program crashes. With try we attempt risky code and with except we catch the error so the program continues.\nfinally always runs, error or not.\nWith as e you can see the error message.',
   `try:\n    n = int("abc")\n    print(n)\nexcept ValueError:\n    print("Not a number")\nfinally:\n    print("Done")\ntry:\n    print(10 / 0)\nexcept ZeroDivisionError as e:\n    print("Error:", e)`]],
 e:[{c:`def safe_div(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return "no way"\n\nprint(safe_div(10, 2))\nprint(safe_div(1, 0))`,n:['اگه تقسیم روی صفر باشه به‌جای خطا یه جواب جایگزین برمی‌گردونیم.','On a division by zero we return a fallback answer instead of crashing.']},
    {c:`hero = {"name": "Arthur"}\ntry:\n    print(hero["hp"])\nexcept KeyError as e:\n    print("Missing key", e)\nexcept (ValueError, TypeError):\n    print("other problem")`,n:['می‌تونی چند تا except پشت سر هم بذاری یا چند خطا رو توی پرانتز بیاری.','You can stack several except blocks or list several errors in parentheses.']}],
 q:{p:['value برابر "12x" هست. سعی کن با int تبدیلش کنی؛ اگه نشد به‌جای ترکیدن، Bad number چاپ کن.','value is "12x". Try converting it with int; if it fails print Bad number instead of crashing.'],st:'value = "12x"\n',
    ok:(c,o)=>o.trim()==='Bad number'&&/\btry\b/.test(c)&&/\bexcept\b/.test(c),h:['try:\n    print(int(value))\nexcept ValueError:\n    print("Bad number")','try:\n    print(int(value))\nexcept ValueError:\n    print("Bad number")'],sol:'value = "12x"\ntry:\n    print(int(value))\nexcept ValueError:\n    print("Bad number")'}},
/* 22 */
{t:['ساختن خطا با raise','Raising your own errors'],
 s:[['با raise خودت می‌تونی خطا بسازی؛ مثلاً وقتی ورودی نامعتبره.\nمی‌تونی کلاس خطای مخصوص خودت رو هم بسازی (از Exception ارث ببره) تا اسم معنی‌دار داشته باشه.',
   'With raise you can create an error yourself, for example when an input is invalid.\nYou can also make your own error class (inheriting from Exception) so it has a meaningful name.',
   `def set_hp(hp):\n    if hp < 0:\n        raise ValueError("HP cannot be negative")\n    return hp\n\ntry:\n    set_hp(-5)\nexcept ValueError as e:\n    print("Caught:", e)\n\nclass QuestError(Exception):\n    pass\n\ntry:\n    raise QuestError("Dragon is too strong")\nexcept QuestError as e:\n    print(e)`]],
 e:[{c:`def check_age(age):\n    if age < 18:\n        raise ValueError("too young")\n    return "welcome"\n\nfor a in [20, 10]:\n    try:\n        print(check_age(a))\n    except ValueError as e:\n        print("Denied:", e)`,n:['raise کارِ تابع رو متوقف می‌کنه و خطا رو به try بیرونی می‌فرسته.','raise stops the function and sends the error to the outer try.']},
    {c:`class LowLevel(Exception):\n    def __init__(self, need):\n        super().__init__(f"Need level {need}")\n        self.need = need\n\ntry:\n    raise LowLevel(10)\nexcept LowLevel as e:\n    print(e, "/", e.need)`,n:['کلاس خطا می‌تونه اطلاعات اضافه (مثل need) هم نگه داره.','An error class can carry extra data (like need).']}],
 q:{p:['تابع check_level(level) بنویس که اگه level کمتر از ۵ بود ValueError با پیام Too low بسازه. با check_level(2) صداش بزن و پیام خطا رو چاپ کن.','Write check_level(level) that raises ValueError with the message Too low when level is below 5. Call it with 2 and print the error message.'],st:'',
    ok:(c,o)=>o.trim()==='Too low'&&/\braise\b/.test(c)&&/\bdef\s+check_level\b/.test(c),h:['def check_level(level):\n    if level < 5:\n        raise ValueError("Too low")\n\ntry:\n    check_level(2)\nexcept ValueError as e:\n    print(e)','def check_level(level):\n    if level < 5:\n        raise ValueError("Too low")\n\ntry:\n    check_level(2)\nexcept ValueError as e:\n    print(e)'],sol:'def check_level(level):\n    if level < 5:\n        raise ValueError("Too low")\n\ntry:\n    check_level(2)\nexcept ValueError as e:\n    print(e)'}},
/* 23 */
{t:['کار با فایل','Working with files'],
 s:[['با open می‌تونی فایل بخونی و بنویسی. حالت‌ها:\n"w" نوشتن (فایل رو از نو می‌سازه) ، "a" اضافه کردن به آخر ، "r" خوندن\nبا with فایل خودکار بسته میشه. اگه فایل وجود نداشته باشه FileNotFoundError میاد.\n(توی این اپ فایل‌ها فقط موقع اجرا توی حافظه‌ن.)',
   'With open you can read and write files. Modes:\n"w" write (starts a new file), "a" append, "r" read\nwith closes the file for you. If the file is missing a FileNotFoundError happens.\n(In this app files live only in memory while the code runs.)',
   `with open("quest.txt", "w") as f:\n    f.write("Slay dragon\\n")\n    f.write("Find grail\\n")\nwith open("quest.txt") as f:\n    print(f.read())\nwith open("quest.txt", "a") as f:\n    f.write("Rest\\n")\nwith open("quest.txt") as f:\n    for line in f:\n        print(line.strip())`]],
 e:[{c:`with open("log.txt", "w") as f:\n    for i in range(3):\n        f.write(f"round {i}\\n")\nwith open("log.txt") as f:\n    lines = f.readlines()\nprint(len(lines))\nprint(lines[0].strip())`,n:['readlines همه‌ی خط‌ها رو به‌صورت لیست برمی‌گردونه.','readlines returns all the lines as a list.']},
    {c:`try:\n    with open("nothing.txt") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print("File not found")`,n:['خوندن فایلی که نیست خطا میده که می‌تونیم بگیریمش.','Reading a missing file raises an error we can catch.']}],
 q:{p:['اسم‌های ["Arthur", "Ragnar"] رو هرکدوم توی یک خط توی فایل heroes.txt بنویس، بعد فایل رو بخون و هر اسم رو توی یه خط چاپ کن.','Write the names ["Arthur", "Ragnar"], one per line, into heroes.txt, then read the file back and print each name on its own line.'],st:'names = ["Arthur", "Ragnar"]\n',
    ok:(c,o)=>o.trim()==='Arthur\nRagnar'&&/open\(/.test(c)&&/["']w["']/.test(c),h:['with open("heroes.txt", "w") as f:\n    for n in names:\n        f.write(n + "\\n")\nwith open("heroes.txt") as f:\n    for line in f:\n        print(line.strip())','with open("heroes.txt", "w") as f:\n    for n in names:\n        f.write(n + "\\n")\nwith open("heroes.txt") as f:\n    for line in f:\n        print(line.strip())'],sol:'names = ["Arthur", "Ragnar"]\nwith open("heroes.txt", "w") as f:\n    for n in names:\n        f.write(n + "\\n")\nwith open("heroes.txt") as f:\n    for line in f:\n        print(line.strip())'}},
/* 24 */
{t:['ماژول‌ها: math، random، json','Modules: math, random, json'],
 s:[['ماژول یعنی یه جعبه‌ابزار آماده. با import واردش می‌کنی.\n• math : sqrt، pi، floor، ceil ...\n• random : انتخاب تصادفی (randint، choice، shuffle)\n• json : تبدیل دیکشنری به متن و برعکس (dumps و loads)\nبا from math import sqrt هم می‌تونی فقط یه ابزار رو بیاری.',
   'A module is a ready-made toolbox. Bring it in with import.\n• math: sqrt, pi, floor, ceil ...\n• random: random picks (randint, choice, shuffle)\n• json: turn a dict into text and back (dumps and loads)\nfrom math import sqrt brings in just one tool.',
   `import math\nprint(math.sqrt(49))\nprint(math.floor(2.7), math.ceil(2.1))\nprint(round(math.pi, 3))\nimport random\ndice = random.randint(1, 6)\nprint(1 <= dice <= 6)\nimport json\ntext = json.dumps({"name": "Arthur", "hp": 90})\nprint(text)\nprint(json.loads(text)["hp"])`]],
 e:[{c:`import json\nhero = {"name": "Lia", "items": ["bow", "map"]}\ntext = json.dumps(hero, indent=2)\nprint(text)\nback = json.loads(text)\nprint(back["items"][1])`,n:['indent=2 خروجی رو خوانا می‌کنه. loads متن رو دوباره به دیکشنری تبدیل می‌کنه.','indent=2 makes the output readable. loads turns the text back into a dictionary.']},
    {c:`import random\nfrom math import gcd\ncards = [1, 2, 3, 4, 5]\nrandom.shuffle(cards)\nprint(sorted(cards))\nprint(random.choice(["a", "b"]) in ["a", "b"])\nprint(gcd(12, 18))`,n:['نتیجه‌ی random هر بار فرق می‌کنه؛ برای همین فقط چیزهای ثابتش رو چاپ کردیم.','random results change every time, so we only print things that stay the same.']}],
 q:{p:['با ماژول math مساحت دایره‌ای به شعاع ۳ (pi × r²) رو حساب کن و با دو رقم اعشار گرد کرده چاپ کن.','Use the math module to compute the area of a circle with radius 3 (pi × r²) and print it rounded to 2 decimals.'],st:'r = 3\n',
    ok:(c,o)=>o.trim()==='28.27'&&/\bimport math\b|\bfrom math import\b/.test(c),h:['import math\nprint(round(math.pi * r ** 2, 2))','import math\nprint(round(math.pi * r ** 2, 2))'],sol:'import math\nr = 3\nprint(round(math.pi * r ** 2, 2))'}},
/* 25 */
{t:['کلاس‌ها و شیءها','Classes & objects'],
 s:[['کلاس (class) یه نقشه‌ست و شیء (object) چیزیه که از روی نقشه ساخته میشه.\n__init__ موقع ساخت اجرا میشه و ویژگی‌ها (attributes) رو تنظیم می‌کنه. self یعنی «همین شیء».\nتوابع داخل کلاس اسمشون متد (method) هست.',
   'A class is a blueprint and an object is something built from it.\n__init__ runs when the object is created and sets its attributes. self means “this very object”.\nFunctions inside a class are called methods.',
   `class Hero:\n    def __init__(self, name, hp):\n        self.name = name\n        self.hp = hp\n\n    def attack(self):\n        return f"{self.name} attacks!"\n\nh = Hero("Arthur", 100)\nprint(h.name)\nprint(h.attack())\nh.hp -= 10\nprint(h.hp)`]],
 e:[{c:`class Counter:\n    def __init__(self):\n        self.n = 0\n    def add(self):\n        self.n += 1\n\na = Counter()\nb = Counter()\na.add()\na.add()\nb.add()\nprint(a.n, b.n)`,n:['هر شیء ویژگی‌های مخصوص خودش رو داره؛ a و b از هم جدان.','Each object has its own attributes; a and b are separate.']},
    {c:`class Potion:\n    def __init__(self, heal):\n        self.heal = heal\n    def use(self, hp):\n        return hp + self.heal\n\nsmall = Potion(20)\nprint(small.use(50))`,n:['متد به ویژگی‌های شیء با self دسترسی داره.','A method reaches the object’s attributes through self.']}],
 q:{p:['کلاس Dragon بساز که اسم و hp بگیره و متد roar داشته باشه که "RAWR" برگردونه. Dragon("Smaug", 500) رو بساز، roar و بعد hp رو چاپ کن.','Create a Dragon class that takes a name and hp and has a roar method returning "RAWR". Make Dragon("Smaug", 500), then print roar() and then hp.'],st:'',
    ok:(c,o)=>o.trim()==='RAWR\n500'&&/\bclass\s+Dragon\b/.test(c)&&/__init__/.test(c),h:['class Dragon:\n    def __init__(self, name, hp):\n        self.name = name\n        self.hp = hp\n    def roar(self):\n        return "RAWR"\n\nd = Dragon("Smaug", 500)\nprint(d.roar())\nprint(d.hp)','class Dragon:\n    def __init__(self, name, hp):\n        self.name = name\n        self.hp = hp\n    def roar(self):\n        return "RAWR"\n\nd = Dragon("Smaug", 500)\nprint(d.roar())\nprint(d.hp)'],sol:'class Dragon:\n    def __init__(self, name, hp):\n        self.name = name\n        self.hp = hp\n    def roar(self):\n        return "RAWR"\n\nd = Dragon("Smaug", 500)\nprint(d.roar())\nprint(d.hp)'}},
/* 26 */
{t:['ارث‌بری و super','Inheritance & super'],
 s:[['یه کلاس می‌تونه از کلاس دیگه ارث ببره: class Mage(Hero). همه‌ی ویژگی‌ها و متدهای Hero رو داره و می‌تونه چیزای جدید اضافه یا قدیمی‌ها رو عوض (override) کنه.\nsuper() یعنی «کلاس پدر» و باهاش متد پدر رو صدا می‌زنیم.\nisinstance نشون میده یه شیء از چه کلاسیه.',
   'A class can inherit from another: class Mage(Hero). It gets all of Hero’s attributes and methods and may add new ones or override old ones.\nsuper() means “the parent class” and lets us call the parent’s method.\nisinstance tells which class an object belongs to.',
   `class Hero:\n    def __init__(self, name):\n        self.name = name\n    def describe(self):\n        return f"I am {self.name}"\n\nclass Mage(Hero):\n    def __init__(self, name, mana):\n        super().__init__(name)\n        self.mana = mana\n    def describe(self):\n        return super().describe() + f" with {self.mana} mana"\n\nm = Mage("Merlin", 80)\nprint(m.describe())\nprint(isinstance(m, Hero))`]],
 e:[{c:`class Animal:\n    def speak(self):\n        return "..."\nclass Dog(Animal):\n    def speak(self):\n        return "Woof"\nclass Cat(Animal):\n    def speak(self):\n        return "Meow"\n\nfor pet in [Dog(), Cat(), Animal()]:\n    print(pet.speak())`,n:['همه یه متد speak دارن ولی هرکدوم جواب خودشو میده (چندریختی).','They all have a speak method but each answers its own way (polymorphism).']},
    {c:`class Weapon:\n    def __init__(self, dmg):\n        self.dmg = dmg\nclass Sword(Weapon):\n    pass\n\ns = Sword(15)\nprint(s.dmg)\nprint(isinstance(s, Weapon), isinstance(s, Sword))`,n:['Sword چیزی ننوشته ولی همه‌چیز Weapon رو داره.','Sword writes nothing yet it has everything from Weapon.']}],
 q:{p:['کلاس Hero با متد describe آماده‌ست. کلاس Knight رو از Hero بساز که describe رو عوض کنه و بعد از جمله‌ی پدر " (Knight)" اضافه کنه. Knight("Arthur").describe() رو چاپ کن.','The Hero class with a describe method is ready. Create a Knight class inheriting from Hero that overrides describe and adds " (Knight)" after the parent’s sentence. Print Knight("Arthur").describe().'],
    st:'class Hero:\n    def __init__(self, name):\n        self.name = name\n    def describe(self):\n        return "I am " + self.name\n\n',
    ok:(c,o)=>o.trim()==='I am Arthur (Knight)'&&/class\s+Knight\s*\(\s*Hero\s*\)/.test(c)&&/super\(\)/.test(c),h:['class Knight(Hero):\n    def describe(self):\n        return super().describe() + " (Knight)"','class Knight(Hero):\n    def describe(self):\n        return super().describe() + " (Knight)"'],sol:'class Hero:\n    def __init__(self, name):\n        self.name = name\n    def describe(self):\n        return "I am " + self.name\n\nclass Knight(Hero):\n    def describe(self):\n        return super().describe() + " (Knight)"\n\nprint(Knight("Arthur").describe())'}},
/* 27 */
{t:['متدهای ویژه و property','Special methods & properties'],
 s:[['متدهایی که با دو آندرلاین شروع و تموم میشن (dunder) به پایتون یاد میدن شیء ما چطور رفتار کنه:\n__str__ : متنی که print نشون میده\n__add__ : رفتار علامت +\n__len__ : رفتار len() ، __eq__ : رفتار ==\n@property هم باعث میشه یه متد مثل یه ویژگی خونده بشه (بدون پرانتز).',
   'Methods that start and end with two underscores (dunder) teach Python how our object behaves:\n__str__: the text print shows\n__add__: what + does\n__len__: what len() does, __eq__: what == does\n@property lets a method be read like an attribute (no parentheses).',
   `class Gold:\n    def __init__(self, n):\n        self.n = n\n    def __str__(self):\n        return f"{self.n} gold"\n    def __add__(self, other):\n        return Gold(self.n + other.n)\n\nprint(Gold(5) + Gold(7))\n\nclass Circle:\n    def __init__(self, r):\n        self.r = r\n    @property\n    def diameter(self):\n        return self.r * 2\n\nprint(Circle(4).diameter)`]],
 e:[{c:`class Bag:\n    def __init__(self, items):\n        self.items = items\n    def __len__(self):\n        return len(self.items)\n    def __eq__(self, other):\n        return self.items == other.items\n\nprint(len(Bag(["a", "b"])))\nprint(Bag([1]) == Bag([1]))`,n:['حالا len(Bag(...)) و == روی شیء ما کار می‌کنن.','Now len() and == work on our own object.']},
    {c:`class Hero:\n    def __init__(self):\n        self._hp = 10\n    @property\n    def hp(self):\n        return self._hp\n    @hp.setter\n    def hp(self, value):\n        if value < 0:\n            raise ValueError("negative")\n        self._hp = value\n\nh = Hero()\nh.hp = 50\nprint(h.hp)\ntry:\n    h.hp = -1\nexcept ValueError as e:\n    print("blocked:", e)`,n:['setter قبل از عوض کردن مقدار اون رو چک می‌کنه.','The setter checks the value before changing it.']}],
 q:{p:['کلاس Vec با x و y بساز؛ __add__ داشته باشه که دو بردار رو جمع کنه و __str__ که به شکل (x, y) نشون بده. Vec(1, 2) + Vec(3, 4) رو چاپ کن.','Create a Vec class with x and y; give it __add__ to add two vectors and __str__ to show (x, y). Print Vec(1, 2) + Vec(3, 4).'],st:'',
    ok:(c,o)=>o.trim()==='(4, 6)'&&/__add__/.test(c)&&/__str__/.test(c),h:['class Vec:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __add__(self, o):\n        return Vec(self.x + o.x, self.y + o.y)\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n\nprint(Vec(1, 2) + Vec(3, 4))','class Vec:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __add__(self, o):\n        return Vec(self.x + o.x, self.y + o.y)\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n\nprint(Vec(1, 2) + Vec(3, 4))'],sol:'class Vec:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __add__(self, o):\n        return Vec(self.x + o.x, self.y + o.y)\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n\nprint(Vec(1, 2) + Vec(3, 4))'}},
/* 28 */
{t:['ژنراتور و دکوراتور','Generators & decorators'],
 s:[['ژنراتور تابعیه که به‌جای return از yield استفاده می‌کنه و مقدارها رو یکی‌یکی و تنبلانه تحویل میده؛ حافظه کم می‌خوره و حتی می‌تونه بی‌نهایت باشه.\nدکوراتور (@) تابعیه که یه تابع دیگه رو می‌گیره و نسخه‌ی قوی‌تری از اون برمی‌گردونه.',
   'A generator is a function that uses yield instead of return and hands out values one at a time, lazily; it saves memory and can even be endless.\nA decorator (@) is a function that takes another function and returns an upgraded version of it.',
   `def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nfor x in countdown(3):\n    print(x)\n\ndef loud(fn):\n    def wrapper(*args):\n        print("before")\n        result = fn(*args)\n        print("after")\n        return result\n    return wrapper\n\n@loud\ndef greet(name):\n    print("Hello", name)\n\ngreet("Arthur")`]],
 e:[{c:`def fib(limit):\n    a, b = 0, 1\n    while a < limit:\n        yield a\n        a, b = b, a + b\n\nprint(list(fib(30)))\ng = fib(5)\nprint(next(g), next(g), next(g))`,n:['next(g) مقدار بعدی رو می‌گیره؛ ژنراتور بین هر مقدار «مکث» می‌کنه.','next(g) fetches the next value; the generator pauses between values.']},
    {c:`def shout(fn):\n    def wrapper(*args):\n        return fn(*args).upper() + "!"\n    return wrapper\n\n@shout\ndef hello(name):\n    return "hello " + name\n\nprint(hello("ragnar"))`,n:['@shout قبل از تعریف یعنی hello = shout(hello).','@shout above the definition means hello = shout(hello).']}],
 q:{p:['ژنراتور evens(n) بنویس که عددهای زوج از ۰ تا n رو yield کنه. list(evens(10)) رو چاپ کن.','Write a generator evens(n) that yields the even numbers from 0 up to n. Print list(evens(10)).'],st:'',
    ok:(c,o)=>o.trim()==='[0, 2, 4, 6, 8, 10]'&&/\byield\b/.test(c),h:['def evens(n):\n    for i in range(0, n + 1, 2):\n        yield i\n\nprint(list(evens(10)))','def evens(n):\n    for i in range(0, n + 1, 2):\n        yield i\n\nprint(list(evens(10)))'],sol:'def evens(n):\n    for i in range(0, n + 1, 2):\n        yield i\n\nprint(list(evens(10)))'}}
);

/* ================= ADVANCED JAVASCRIPT (lessons 16-28) ================= */
LESSONS.js.push(
/* 16 */
{t:['Destructuring (باز کردن آبجکت و آرایه)','Destructuring'],
 s:[['Destructuring یعنی چند مقدار رو یک‌جا از آبجکت یا آرایه بیرون بکشیم.\nآبجکت: const {name, hp} = hero;   (اسم‌ها باید مثل کلیدها باشن)\nآرایه: const [a, b] = list;   (بر اساس جایگاه)\nمی‌تونی مقدار پیش‌فرض بدی (gold = 0) یا اسم عوض کنی (level: lv).',
   'Destructuring pulls several values out of an object or array at once.\nObject: const {name, hp} = hero;   (names must match the keys)\nArray: const [a, b] = list;   (by position)\nYou can give defaults (gold = 0) or rename (level: lv).',
   `const hero = { name: 'Arthur', hp: 100, level: 5 };\nconst { name, hp } = hero;\nconsole.log(name, hp);\nconst [first, second] = ['a', 'b', 'c'];\nconsole.log(first, second);\nconst { level: lv, gold = 0 } = hero;\nconsole.log(lv, gold);\nfunction show({ name, level }) {\n  console.log(name + ' L' + level);\n}\nshow(hero);`]],
 e:[{c:`let a = 1, b = 2;\n[a, b] = [b, a];\nconsole.log(a, b);`,n:['با destructuring می‌تونی جای دو متغیر رو بدون متغیر کمکی عوض کنی.','Destructuring swaps two variables without a helper variable.']},
    {c:`const quest = { title: 'Grail', reward: { gold: 50, item: 'cup' } };\nconst { title, reward: { gold } } = quest;\nconsole.log(title, gold);\nconst [x, , z = 9] = [1, 2];\nconsole.log(x, z);`,n:['می‌شه توی آبجکت تودرتو هم باز کرد و یه عضو آرایه رو با کاما خالی رد کرد.','You can destructure nested objects and skip an array item with an empty comma.']}],
 q:{p:['از آبجکت quest با destructuring مقدارهای title و reward رو بیرون بکش و به شکل «title: reward» چاپ کن (مثلا Dragon: 500).','Use destructuring to pull title and reward out of quest and print them like “title: reward” (for example Dragon: 500).'],st:"const quest = { title: 'Dragon', reward: 500, done: false };\n",
    ok:(c,o)=>o.trim()==='Dragon: 500'&&/const\s*\{[^}]*title[^}]*\}\s*=/.test(c),h:["const { title, reward } = quest;\nconsole.log(title + ': ' + reward);","const { title, reward } = quest;\nconsole.log(title + ': ' + reward);"],sol:"const quest = { title: 'Dragon', reward: 500, done: false };\nconst { title, reward } = quest;\nconsole.log(title + ': ' + reward);"}},
/* 17 */
{t:['Spread و Rest','Spread & rest'],
 s:[['سه‌نقطه ... دو کار می‌کنه:\n• Spread: یه آرایه یا آبجکت رو «پخش» می‌کنه: [...a, 3]  یا  {...base, name: "A"}\n• Rest: چند ورودی یا باقی‌مونده رو توی یه آرایه «جمع» می‌کنه: function f(...nums)\nبا spread خیلی راحت کپی و ترکیب می‌کنی بدون اینکه اصل عوض بشه.',
   'The three dots ... do two jobs:\n• Spread: “spills” an array or object: [...a, 3]  or  {...base, name: "A"}\n• Rest: “gathers” extra inputs or leftovers into an array: function f(...nums)\nSpread makes copying and merging easy without changing the original.',
   `const a = [1, 2];\nconst b = [...a, 3, 4];\nconsole.log(b);\nconst base = { hp: 10 };\nconst hero = { ...base, name: 'Arthur' };\nconsole.log(hero);\nfunction sum(...nums) {\n  return nums.reduce((s, n) => s + n, 0);\n}\nconsole.log(sum(1, 2, 3));\nconsole.log(Math.max(...[4, 9, 2]));`]],
 e:[{c:`const original = [1, 2, 3];\nconst copy = [...original];\ncopy.push(4);\nconsole.log(original, copy);`,n:['copy یه نسخه‌ی جداست؛ تغییرش روی original اثر نداره.','copy is a separate array; changing it does not affect original.']},
    {c:`const [head, ...tail] = ['a', 'b', 'c'];\nconsole.log(head, tail);\nconst { hp, ...others } = { hp: 5, name: 'Lia', level: 2 };\nconsole.log(others);`,n:['rest توی destructuring باقی‌مونده رو جمع می‌کنه.','rest inside destructuring gathers the leftovers.']}],
 q:{p:['دو آرایه‌ی bag1 و bag2 رو با spread توی یه آرایه‌ی جدید ترکیب کن و چاپش کن.','Combine the arrays bag1 and bag2 into a new array with spread and print it.'],st:"const bag1 = ['sword', 'shield'];\nconst bag2 = ['bow'];\n",
    ok:(c,o)=>o.trim()==="[ 'sword', 'shield', 'bow' ]"&&/\.\.\./.test(c),h:['console.log([...bag1, ...bag2]);','console.log([...bag1, ...bag2]);'],sol:"const bag1 = ['sword', 'shield'];\nconst bag2 = ['bow'];\nconsole.log([...bag1, ...bag2]);"}},
/* 18 */
{t:['Map و Set','Map & Set'],
 s:[['Set یه مجموعه‌ی بدون تکراره: add، has، delete، size.\nMap مثل آبجکته ولی کلیدش می‌تونه هر چیزی باشه و ترتیب رو حفظ می‌کنه: set، get، has، size.\nهر دو رو می‌شه با for...of پیمایش کرد.',
   'A Set holds unique values: add, has, delete, size.\nA Map is like an object but its keys can be anything and it keeps order: set, get, has, size.\nBoth can be looped with for...of.',
   `const s = new Set([1, 2, 2, 3]);\nconsole.log(s.size, s.has(2));\nconst m = new Map();\nm.set('Arthur', 5);\nm.set('Ragnar', 7);\nconsole.log(m.get('Ragnar'), m.size);\nfor (const [k, v] of m) {\n  console.log(k, v);\n}\nconsole.log([...new Set([3, 3, 4])]);`]],
 e:[{c:`const seen = new Set();\nfor (const w of ['a', 'b', 'a', 'c', 'b']) {\n  seen.add(w);\n}\nconsole.log(seen);`,n:['Set تکراری‌ها رو خودش نادیده می‌گیره.','A Set quietly ignores duplicates.']},
    {c:`const counts = new Map();\nfor (const ch of 'hello') {\n  counts.set(ch, (counts.get(ch) || 0) + 1);\n}\nconsole.log(counts);\nconsole.log(counts.get('l'));`,n:['Map برای شمارش چیزها عالیه.','A Map is great for counting things.']}],
 q:{p:['آرایه‌ی arr تکراری داره. با Set تعداد عضوهای «متفاوت» رو چاپ کن.','The array arr has duplicates. Print how many DIFFERENT items it has using a Set.'],st:'const arr = [1, 2, 2, 3, 3, 3];\n',
    ok:(c,o)=>o.trim()==='3'&&/new Set/.test(c),h:['console.log(new Set(arr).size);','console.log(new Set(arr).size);'],sol:'const arr = [1, 2, 2, 3, 3, 3];\nconsole.log(new Set(arr).size);'}},
/* 19 */
{t:['ابزارهای بیشتر آرایه','More array tools'],
 s:[['چند متد خیلی کاربردی:\n• find / findIndex : اولین عضو (یا جایگاهش) که شرط رو داره\n• some / every : حداقل یکی / همه شرط رو دارن؟\n• sort((a,b)=>a-b) : مرتب‌سازی عددی (sort بدون تابع، متنی مرتب می‌کنه!)\n• flat / flatMap : صاف کردن آرایه‌های تودرتو\n• slice(از,تا) : برش بدون تغییر اصل',
   'Some very handy methods:\n• find / findIndex: the first item (or its position) that passes\n• some / every: does at least one / every item pass?\n• sort((a,b)=>a-b): numeric sort (plain sort compares as text!)\n• flat / flatMap: flatten nested arrays\n• slice(from,to): cut without changing the original',
   `const nums = [5, 3, 8, 1];\nconsole.log(nums.find(n => n > 4));\nconsole.log(nums.findIndex(n => n > 6));\nconsole.log(nums.some(n => n > 7), nums.every(n => n > 0));\nconsole.log([...nums].sort((a, b) => a - b));\nconsole.log([[1, 2], [3]].flat());\nconsole.log(nums.slice(1, 3));`]],
 e:[{c:`const heroes = [{ name: 'Lia', level: 3 }, { name: 'Arthur', level: 5 }];\nheroes.sort((a, b) => b.level - a.level);\nconsole.log(heroes.map(h => h.name));`,n:['مرتب‌سازی آبجکت‌ها بر اساس یه ویژگی؛ b - a یعنی نزولی.','Sorting objects by a property; b - a means descending.']},
    {c:`const words = ['hi there', 'big dragon'];\nconsole.log(words.flatMap(w => w.split(' ')));\nconsole.log([10, 9, 1].sort());`,n:['دقت: sort بدون تابع، عددها رو مثل متن مرتب می‌کنه (۱۰ قبل از ۹).','Careful: plain sort treats numbers as text (10 comes before 9).']}],
 q:{p:['با find اولین قهرمانی که level اش بیشتر از ۶ هست رو پیدا کن و فقط اسمش رو چاپ کن.','Use find to get the first hero whose level is above 6 and print only the name.'],st:"const heroes = [\n  { name: 'Lia', level: 3 },\n  { name: 'Ragnar', level: 7 },\n  { name: 'Arthur', level: 9 }\n];\n",
    ok:(c,o)=>o.trim()==='Ragnar'&&/\.find\(/.test(c),h:['console.log(heroes.find(h => h.level > 6).name);','console.log(heroes.find(h => h.level > 6).name);'],sol:"const heroes = [\n  { name: 'Lia', level: 3 },\n  { name: 'Ragnar', level: 7 },\n  { name: 'Arthur', level: 9 }\n];\nconsole.log(heroes.find(h => h.level > 6).name);"}},
/* 20 */
{t:['Scope و Closure','Scope & closures'],
 s:[['Scope یعنی «یه متغیر از کجا دیده میشه». let و const فقط داخل بلوک { } که تعریف شدن زندگی می‌کنن.\nClosure یعنی یه تابع، متغیرهای دور و برِ خودش رو (حتی بعد از تموم شدن تابع بیرونی) یادش می‌مونه. با این کار می‌تونیم حافظه‌ی خصوصی بسازیم.',
   'Scope means “where a variable can be seen”. let and const live only inside the { } block where they are defined.\nA closure means a function remembers the variables around it, even after the outer function has finished. That lets us build private memory.',
   `function counter() {\n  let c = 0;\n  return () => ++c;\n}\nconst next = counter();\nconsole.log(next(), next(), next());\nconst other = counter();\nconsole.log(other());\nlet x = 'global';\nfunction f() {\n  let x = 'local';\n  return x;\n}\nconsole.log(f(), x);`]],
 e:[{c:`function makeWallet() {\n  let gold = 0;\n  return {\n    add(n) { gold += n; },\n    show() { return gold; }\n  };\n}\nconst w = makeWallet();\nw.add(10);\nw.add(5);\nconsole.log(w.show());\nconsole.log(w.gold);`,n:['gold بیرون از makeWallet دیده نمیشه (undefined)، فقط از طریق متدها.','gold is hidden from outside makeWallet (undefined); only the methods reach it.']},
    {c:`const fns = [];\nfor (let i = 0; i < 3; i++) {\n  fns.push(() => i);\n}\nconsole.log(fns.map(f => f()));`,n:['با let هر دور حلقه i مخصوص خودش رو داره، پس هر تابع عدد خودش رو یادش می‌مونه.','With let each loop round has its own i, so every function remembers its own number.']}],
 q:{p:['تابع makeAdder(n) بنویس که یه تابع برگردونه که ورودیش رو با n جمع کنه. add5 = makeAdder(5) بساز و add5(10) رو چاپ کن.','Write makeAdder(n) that returns a function adding its input to n. Make add5 = makeAdder(5) and print add5(10).'],st:'',
    ok:(c,o)=>o.trim()==='15'&&/makeAdder/.test(c)&&/return/.test(c.replace(/=>/g,'return ')),h:['function makeAdder(n) {\n  return x => x + n;\n}\nconst add5 = makeAdder(5);\nconsole.log(add5(10));','function makeAdder(n) {\n  return x => x + n;\n}\nconst add5 = makeAdder(5);\nconsole.log(add5(10));'],sol:'function makeAdder(n) {\n  return x => x + n;\n}\nconst add5 = makeAdder(5);\nconsole.log(add5(10));'}},
/* 21 */
{t:['کلاس‌ها (class)','Classes'],
 s:[['class یه نقشه برای ساختن آبجکته. constructor موقع new اجرا میشه و ویژگی‌ها رو می‌سازه. this یعنی «همین آبجکت».\nتوابع داخل کلاس متد هستن. با static یه متد مال خود کلاس میشه و با get یه متد مثل ویژگی خونده میشه.',
   'A class is a blueprint for objects. The constructor runs on new and sets up properties. this means “this very object”.\nFunctions inside a class are methods. static makes a method belong to the class itself and get lets a method be read like a property.',
   `class Hero {\n  constructor(name, hp) {\n    this.name = name;\n    this.hp = hp;\n  }\n  attack() {\n    return this.name + ' attacks!';\n  }\n}\nconst h = new Hero('Arthur', 100);\nconsole.log(h.attack());\nconsole.log(h);`]],
 e:[{c:`class Circle {\n  constructor(r) { this.r = r; }\n  get diameter() { return this.r * 2; }\n  static unit() { return new Circle(1); }\n}\nconsole.log(new Circle(4).diameter);\nconsole.log(Circle.unit().r);`,n:['get بدون پرانتز خونده میشه؛ static روی خود کلاس صدا زده میشه.','A get is read without parentheses; static is called on the class itself.']},
    {c:`class Gold {\n  constructor(n) { this.n = n; }\n  toString() { return this.n + ' gold'; }\n}\nconsole.log(\`You have \${new Gold(7)}\`);`,n:['وقتی آبجکت رو داخل متن می‌ذاری toString صدا زده میشه.','When an object is put inside text, toString is called.']}],
