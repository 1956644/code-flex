{t:['Buffer و کدگذاری','Buffers & encoding'],
 s:[['Buffer یعنی تکه‌ای از بایت‌های خام؛ برای کار با فایل‌های باینری و کدگذاری متن.\nBuffer.from("متن") یه Buffer می‌سازه و toString("hex" یا "base64") به قالب‌های دیگه تبدیلش می‌کنه. base64 معمولا برای فرستادن داده‌ی باینری داخل متن استفاده میشه.\nبرای آدرس‌ها هم کلاس URL آماده‌ست.',
   'A Buffer is a chunk of raw bytes; used for binary files and text encoding.\nBuffer.from("text") makes a Buffer and toString("hex" or "base64") converts it to other forms. base64 is commonly used to send binary data inside text.\nFor addresses there is the ready-made URL class.',
   `const b = Buffer.from('Hi');\nconsole.log(b.length);\nconsole.log(b.toString('hex'));\nconsole.log(b.toString('base64'));\nconst back = Buffer.from('SGk=', 'base64').toString('utf8');\nconsole.log(back);\n\nconst u = new URL('https://codeflex.dev/quests?level=5&sort=asc');\nconsole.log(u.hostname, u.pathname);\nconsole.log(u.searchParams.get('level'));`]],
 e:[{c:`const secret = 'Arthur';\nconst encoded = Buffer.from(secret).toString('base64');\nconsole.log(encoded);\nconsole.log(Buffer.from(encoded, 'base64').toString());`,n:['base64 رمزنگاری نیست؛ فقط یه کدگذاریه و هرکسی برمی‌گردونتش.','base64 is not encryption; it is just an encoding that anyone can reverse.']},
    {c:`const params = new URLSearchParams({ hero: 'Lia', level: 3 });\nconsole.log(params.toString());\nparams.append('class', 'mage');\nfor (const [k, v] of params) {\n  console.log(k, '=', v);\n}`,n:['URLSearchParams ساخت و خوندن کوئری رو راحت می‌کنه.','URLSearchParams makes building and reading queries easy.']}],
 q:{p:['متن "Code Flex" رو با Buffer به base64 تبدیل کن و چاپ کن.','Convert the text "Code Flex" to base64 with Buffer and print it.'],st:'',
    ok:(c,o)=>o.trim()==='Q29kZSBGbGV4'&&/Buffer\.from\(/.test(c)&&/base64/.test(c),h:["console.log(Buffer.from('Code Flex').toString('base64'));","console.log(Buffer.from('Code Flex').toString('base64'));"],sol:"console.log(Buffer.from('Code Flex').toString('base64'));"}},
/* 24 */
{t:['Router و ساختار پروژه','Routers & project structure'],
 s:[['وقتی API بزرگ میشه، مسیرهای مرتبط رو توی یه «Router» جدا جمع می‌کنیم و با app.use("/پیشوند", router) به برنامه وصل می‌کنیم. اینطوری مسیرهای هر بخش مرتب و مستقل میمونن.\nتوی پروژه‌ی واقعی هر Router توی یه فایل جدا میره و با module.exports بیرون داده میشه و با require وارد میشه.',
   'When an API grows we gather related routes into a separate “Router” and attach it with app.use("/prefix", router). This keeps every part tidy and independent.\nIn a real project each Router lives in its own file, is exported with module.exports and brought in with require.',
   `const express = require('express');\nconst app = express();\n\nconst heroes = express.Router();\nheroes.get('/', (req, res) => res.json(['Arthur', 'Lia']));\nheroes.get('/:id', (req, res) => res.json({ id: req.params.id }));\n\nconst quests = express.Router();\nquests.get('/', (req, res) => res.json(['Dragon']));\n\napp.use('/api/heroes', heroes);\napp.use('/api/quests', quests);\napp.get('/', (req, res) => res.send('API home'));\napp.listen(3000);`]],
 e:[{c:`const express = require('express');\nconst app = express();\nconst api = express.Router();\napi.use((req, res, next) => {\n  console.log('API call:', req.url);\n  next();\n});\napi.get('/ping', (req, res) => res.send('pong'));\napp.use('/api', api);\napp.listen(3000);`,n:['middleware داخل Router فقط برای مسیرهای همون Router اجرا میشه.','Middleware inside a Router only runs for that Router’s paths.']},
    {c:`// file: routes/heroes.js  (idea)\nconst express = require('express');\nconst router = express.Router();\nrouter.get('/', (req, res) => res.json([]));\nmodule.exports = router;\n\n// file: app.js  (idea)\nconst app = express();\napp.use('/heroes', module.exports);\napp.listen(3000);`,n:['توی پروژه‌ی واقعی: module.exports توی یه فایل و require توی فایل دیگه.','In a real project: module.exports in one file and require in another.']}],
 q:{p:['یه Router بساز که روی مسیر / آرایه‌ی ["sword","shield"] رو به‌صورت JSON بفرسته و با app.use("/api/items", router) وصلش کن.','Create a Router that sends the array ["sword","shield"] as JSON on the path / and attach it with app.use("/api/items", router).'],st:"const express = require('express');\nconst app = express();\n\n",
    ok:(c,o)=>/GET \/api\/items \[200\] \["sword","shield"\]/.test(o)&&/Router\(\)/.test(c)&&/app\.use\(\s*['"]\/api\/items['"]/.test(c),h:["const router = express.Router();\nrouter.get('/', (req, res) => res.json(['sword', 'shield']));\napp.use('/api/items', router);\napp.listen(3000);","const router = express.Router();\nrouter.get('/', (req, res) => res.json(['sword', 'shield']));\napp.use('/api/items', router);\napp.listen(3000);"],sol:"const express = require('express');\nconst app = express();\n\nconst router = express.Router();\nrouter.get('/', (req, res) => res.json(['sword', 'shield']));\napp.use('/api/items', router);\napp.listen(3000);"}},
/* 25 */
{t:['پروژه‌ی نهایی: API قهرمان‌ها','Final project: the heroes API'],
 s:[['وقتشه همه‌چیز رو کنار هم بذاریم: یه API کامل با Express، middleware برای لاگ، JSON، مسیرهای GET و POST، اعتبارسنجی و خطای ۴۰۴.\nنمونه‌ی زیر رو ببین و بعد خودت مشابهش رو توی چالش بساز. (درخواست‌های POST آزمایشی با بدنه‌ی {"name":"Arthur","level":1} میان.)',
   'Time to put everything together: a full API with Express, a logging middleware, JSON, GET and POST routes, validation and a 404 error.\nStudy the sample below, then build something similar in the challenge. (Test POST requests arrive with the body {"name":"Arthur","level":1}.)',
   `const express = require('express');\nconst app = express();\napp.use(express.json());\napp.use((req, res, next) => {\n  console.log('>>', req.method, req.url);\n  next();\n});\n\nconst heroes = [{ id: 1, name: 'Lia', level: 3 }];\n\napp.get('/heroes', (req, res) => res.json(heroes));\n\napp.post('/heroes', (req, res) => {\n  const { name, level } = req.body;\n  if (!name) return res.status(400).json({ error: 'name required' });\n  const hero = { id: heroes.length + 1, name, level };\n  heroes.push(hero);\n  res.status(201).json(hero);\n});\n\napp.get('/heroes/:id', (req, res) => {\n  const hero = heroes.find(h => h.id === Number(req.params.id));\n  if (!hero) return res.status(404).json({ error: 'not found' });\n  res.json(hero);\n});\n\napp.listen(3000, () => console.log('Heroes API ready'));`]],
 e:[{c:`const express = require('express');\nconst app = express();\napp.use(express.json());\nlet gold = 0;\napp.post('/gold', (req, res) => {\n  gold += req.body.level * 10;\n  res.json({ gold });\n});\napp.get('/gold', (req, res) => res.json({ gold }));\napp.listen(3000);`,n:['وضعیت (gold) توی حافظه‌ی سرور می‌مونه و بین درخواست‌ها حفظ میشه.','The state (gold) stays in the server’s memory between requests.']},
    {c:`const express = require('express');\nconst app = express();\napp.get('/', (req, res) => res.send('Realm of Code'));\napp.get('/health', (req, res) => res.json({ status: 'ok', uptime: 1 }));\napp.listen(3000, () => console.log('Realm is up'));`,n:['مسیر /health معمولا برای چک کردن «سرور زنده‌ست؟» استفاده میشه.','A /health route is commonly used to check “is the server alive?”.']}],
 q:{p:['یه API بساز: middleware که هر درخواست رو با «>> متد آدرس» لاگ کنه، مسیر GET /heroes که آرایه‌ی heroes رو به‌صورت JSON بفرسته و مسیر POST /heroes که بدنه (req.body) رو با کد ۲۰۱ برگردونه. (express.json هم یادت نره!)','Build an API: a middleware that logs each request as “>> method url”, a GET /heroes route sending the heroes array as JSON, and a POST /heroes route that returns the body (req.body) with status 201. (Do not forget express.json!)'],st:"const express = require('express');\nconst app = express();\nconst heroes = [{ id: 1, name: 'Lia' }];\n\n",
    ok:(c,o)=>/>> GET \/heroes/.test(o)&&/GET \/heroes \[200\] \[\{"id":1,"name":"Lia"\}\]/.test(o)&&/POST \/heroes \[201\] \{"name":"Arthur","level":1\}/.test(o)&&/express\.json\(\)/.test(c),h:["app.use(express.json());\napp.use((req, res, next) => {\n  console.log('>> ' + req.method + ' ' + req.url);\n  next();\n});\napp.get('/heroes', (req, res) => res.json(heroes));\napp.post('/heroes', (req, res) => res.status(201).json(req.body));\napp.listen(3000);","app.use(express.json());\napp.use((req, res, next) => {\n  console.log('>> ' + req.method + ' ' + req.url);\n  next();\n});\napp.get('/heroes', (req, res) => res.json(heroes));\napp.post('/heroes', (req, res) => res.status(201).json(req.body));\napp.listen(3000);"],sol:"const express = require('express');\nconst app = express();\nconst heroes = [{ id: 1, name: 'Lia' }];\n\napp.use(express.json());\napp.use((req, res, next) => {\n  console.log('>> ' + req.method + ' ' + req.url);\n  next();\n});\napp.get('/heroes', (req, res) => res.json(heroes));\napp.post('/heroes', (req, res) => res.status(201).json(req.body));\napp.listen(3000);"}}
);

{t:['*args و **kwargs','*args and **kwargs'],
 s:[['با *args هر تعداد ورودی معمولی می‌گیری (به شکل tuple) و با **kwargs هر تعداد ورودی نام‌دار (به شکل dict). وقتی تعداد ورودی‌ها از قبل معلوم نیست، خیلی به‌کار میاد.',
   'With *args you accept any number of positional inputs (as a tuple) and with **kwargs any number of named inputs (as a dict). Handy when you do not know the number of inputs in advance.',
   `def total(*nums):\n    return sum(nums)\n\nprint(total(1, 2, 3))\nprint(total(10, 20))\n\ndef hero(**info):\n    for k in info:\n        print(k, "=", info[k])\n\nhero(name="Arthur", hp=100)`]],
 e:[{c:`def show(*items):\n    print(len(items), items)\n\nshow("a", "b", "c")\nshow()`,n:['*items همه‌ی ورودی‌ها رو توی یه tuple جمع می‌کنه.','*items gathers all inputs into one tuple.']},
    {c:`def build(name, **extra):\n    d = {"name": name}\n    d.update(extra)\n    return d\n\nprint(build("Elf", hp=80, mana=50))`,n:['**extra ورودی‌های نام‌دار اضافه رو توی dict میریزه.','**extra collects the extra named inputs into a dict.']}],

{t:['enumerate، zip و برش','enumerate, zip & slicing'],
 s:[['enumerate شماره‌ی هر عضو رو هم میده، zip دو لیست رو جفت‌جفت کنار هم میذاره و برش (slice) با [شروع:پایان:گام] تکه‌ای از لیست یا رشته رو برمی‌داره (پایان شامل نمیشه).',
   'enumerate gives the index of each item, zip pairs two lists side by side, and slicing [start:end:step] takes a piece of a list or string (end is excluded).',
   `names = ["Arthur", "Merlin", "Lancelot"]\nfor i, n in enumerate(names):\n    print(i, n)\n\nhp = [100, 70, 90]\nfor n, h in zip(names, hp):\n    print(n, h)\n\nnums = [0, 1, 2, 3, 4, 5]\nprint(nums[1:4])\nprint(nums[::2])\nprint(nums[::-1])`]],
 e:[{c:`for i, c in enumerate("abc", 1):\n    print(i, c)`,n:['عدد دوم enumerate شماره‌ی شروع رو تعیین می‌کنه.','The second argument of enumerate sets the starting number.']},
    {c:`word = "dragon"\nprint(word[:3])\nprint(word[-2:])\nprint(word[::-1])`,n:['منفی یعنی از آخر؛ ::-1 رشته رو برعکس می‌کنه.','Negative means from the end; ::-1 reverses the string.']}],
 q:{p:['با zip، دو لیست ["a","b"] و [1,2] رو جفت کن و برای هر جفت مثل a-1 چاپ کن.','Use zip on ["a","b"] and [1,2] and print each pair like a-1.'],st:'',
    ok:(c,o)=>o.trim()==='a-1\nb-2'&&/zip/.test(c),h:['for x, y in zip(["a","b"], [1,2]):\n    print(f"{x}-{y}")','for x, y in zip(["a","b"], [1,2]):\n    print(f"{x}-{y}")'],sol:'for x, y in zip(["a","b"], [1,2]):\n    print(f"{x}-{y}")'}},
/* 31 */
{t:['بازگشت (Recursion)','Recursion'],
 s:[['بازگشت یعنی تابع خودش رو صدا بزنه. هر تابع بازگشتی دو بخش داره: «حالت پایه» که متوقفش می‌کنه و «حالت بازگشتی» که مسئله رو کوچیک‌تر می‌کنه.',
   'Recursion means a function calls itself. Every recursive function has two parts: a base case that stops it and a recursive case that shrinks the problem.',
   `def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)\n\nprint(fact(5))\n\ndef countdown(n):\n    if n == 0:\n        print("Go!")\n        return\n    print(n)\n    countdown(n - 1)\n\ncountdown(3)`]],
 e:[{c:`def total(lst):\n    if not lst:\n        return 0\n    return lst[0] + total(lst[1:])\n\nprint(total([1, 2, 3, 4]))`,n:['جمع = عضو اول + جمع بقیه؛ لیست خالی حالت پایه‌ست.','Sum = first item + sum of the rest; the empty list is the base case.']},
    {c:`def fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint([fib(i) for i in range(8)])`,n:['فیبوناچی: هر عدد جمع دو تای قبلیه.','Fibonacci: each number is the sum of the previous two.']}],
 q:{p:['تابع بازگشتی power(a, b) بنویس که a به توان b رو حساب کنه. power(2, 5) رو چاپ کن.','Write a recursive power(a, b) that computes a to the power b. Print power(2, 5).'],st:'',
    ok:(c,o)=>o.trim()==='32'&&/power\s*\([^)]*\)/.test(c.replace(/def power[^\n]*/,''))&&c.split('power(').length>=3,h:['def power(a, b):\n    if b == 0:\n        return 1\n    return a * power(a, b - 1)\n\nprint(power(2, 5))','def power(a, b):\n    if b == 0:\n        return 1\n    return a * power(a, b - 1)\n\nprint(power(2, 5))'],sol:'def power(a, b):\n    if b == 0:\n        return 1\n    return a * power(a, b - 1)\n\nprint(power(2, 5))'}},
/* 32 */
{t:['دامنه: global و nonlocal','Scope: global & nonlocal'],
 s:[['متغیری که داخل تابع ساخته میشه فقط همون‌جا وجود داره (دامنه‌ی محلی). برای تغییر دادن متغیر بیرونی از global (سراسری) یا nonlocal (تابع بیرونی) استفاده می‌کنیم.',
   'A variable created inside a function exists only there (local scope). To change an outer variable we use global (module level) or nonlocal (enclosing function).',
   `score = 0\n\ndef add():\n    global score\n    score += 10\n\nadd()\nadd()\nprint(score)\n\ndef counter():\n    n = 0\n    def inc():\n        nonlocal n\n        n += 1\n        return n\n    return inc\n\nc = counter()\nprint(c(), c(), c())`]],
 e:[{c:`x = 5\n\ndef f():\n    x = 99\n    print("inside", x)\n\nf()\nprint("outside", x)`,n:['بدون global، x داخل تابع یه متغیر جدا و محلیه.','Without global, x inside the function is a separate local variable.']},
    {c:`def make_bank(start):\n    money = start\n    def deposit(v):\n        nonlocal money\n        money += v\n        return money\n    return deposit\n\nd = make_bank(100)\nprint(d(50))\nprint(d(25))`,n:['nonlocal به تابع داخلی اجازه میده money بیرونی رو عوض کنه.','nonlocal lets the inner function change the outer money.']}],
 q:{p:['متغیر سراسری hp = 100 بساز و تابع hit() که با global از اون ۳۰ تا کم کنه. hit() رو صدا بزن و hp رو چاپ کن.','Create a global hp = 100 and a function hit() that uses global to subtract 30. Call hit() and print hp.'],st:'',
    ok:(c,o)=>o.trim()==='70'&&/global\s+hp/.test(c),h:['hp = 100\n\ndef hit():\n    global hp\n    hp -= 30\n\nhit()\nprint(hp)','hp = 100\n\ndef hit():\n    global hp\n    hp -= 30\n\nhit()\nprint(hp)'],sol:'hp = 100\n\ndef hit():\n    global hp\n    hp -= 30\n\nhit()\nprint(hp)'}},
/* 33 */
{t:['مرتب‌سازی و الگوریتم‌ها','Sorting & algorithms'],
 s:[['sorted لیست جدید مرتب‌شده میده و list.sort() همون لیست رو مرتب می‌کنه. با key می‌گی بر چه اساسی مرتب کنه و با reverse=True برعکس. جستجوی دودویی روی لیست مرتب خیلی سریع‌تر از گشتن یکی‌یکیه.',
   'sorted returns a new sorted list while list.sort() sorts in place. key says what to sort by and reverse=True flips the order. Binary search on a sorted list is much faster than checking one by one.',
   `nums = [5, 2, 9, 1]\nprint(sorted(nums))\nprint(sorted(nums, reverse=True))\n\nwords = ["dragon", "elf", "wizard"]\nprint(sorted(words, key=len))\n\ndef find(lst, target):\n    lo, hi = 0, len(lst) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if lst[mid] == target:\n            return mid\n        if lst[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1\n\nprint(find([1, 3, 5, 7, 9], 7))`]],
 e:[{c:`heroes = [("Arthur", 30), ("Merlin", 25), ("Lancelot", 28)]\nheroes.sort(key=lambda h: h[1])\nprint(heroes)`,n:['key=lambda مشخص می‌کنه بر اساس عضو دوم مرتب کنه.','key=lambda says to sort by the second item.']},
    {c:`def bubble(lst):\n    n = len(lst)\n    for i in range(n):\n        for j in range(n - i - 1):\n            if lst[j] > lst[j + 1]:\n                lst[j], lst[j + 1] = lst[j + 1], lst[j]\n    return lst\n\nprint(bubble([4, 2, 7, 1]))`,n:['مرتب‌سازی حبابی: هر بار دو همسایه رو مقایسه و جابه‌جا می‌کنه.','Bubble sort: compares and swaps neighbours again and again.']}],
 q:{p:['لیست [3, 1, 2] رو به صورت نزولی (بزرگ به کوچک) مرتب و چاپ کن.','Sort the list [3, 1, 2] in descending order (big to small) and print it.'],st:'',
    ok:(c,o)=>o.trim()==='[3, 2, 1]'&&/sort/.test(c),h:['print(sorted([3, 1, 2], reverse=True))','print(sorted([3, 1, 2], reverse=True))'],sol:'print(sorted([3, 1, 2], reverse=True))'}}
);

LESSONS.js.push(
/* 29 */
{t:['?. و ?? و ||=','Optional chaining & nullish'],
 s:[['?. (زنجیره‌ی اختیاری) اگه وسط راه null/undefined بود خطا نمیده و undefined برمی‌گردونه. ?? فقط برای null و undefined مقدار پیش‌فرض میذاره (برخلاف || که 0 و رشته‌ی خالی رو هم نادیده می‌گیره).',
   '?. (optional chaining) returns undefined instead of throwing when something is null/undefined. ?? gives a default only for null and undefined (unlike || which also skips 0 and empty strings).',
   `const hero = { name: "Arthur", pet: { name: "Rex" } };\nconsole.log(hero.pet?.name);\nconsole.log(hero.sword?.name);\n\nconst score = 0;\nconsole.log(score || 10);\nconsole.log(score ?? 10);\n\nlet mana;\nmana ??= 50;\nconsole.log(mana);`]],
 e:[{c:`const user = null;\nconsole.log(user?.name);\nconsole.log(user?.name ?? "Guest");`,n:['به‌جای ارور، undefined میگیریم و بعد مقدار پیش‌فرض.','We get undefined instead of an error, then a default.']},
    {c:`const arr = [1, 2];\nconsole.log(arr?.[5]);\nconst fn = null;\nconsole.log(fn?.());`,n:['?.[ ] و ?.( ) هم برای آرایه و تابع کار می‌کنن.','?.[ ] and ?.( ) work for arrays and functions too.']}],
 q:{p:['const cfg = {} تعریف کن و مقدار cfg.port ?? 3000 رو با console.log چاپ کن.','Define const cfg = {} and console.log cfg.port ?? 3000.'],st:'',
    ok:(c,o)=>o.trim()==='3000'&&/\?\?/.test(c),h:['const cfg = {};\nconsole.log(cfg.port ?? 3000);','const cfg = {};\nconsole.log(cfg.port ?? 3000);'],sol:'const cfg = {};\nconsole.log(cfg.port ?? 3000);'}},
/* 30 */
{t:['this، call، apply و bind','this, call, apply & bind'],
 s:[['مقدار this بستگی به این داره که تابع «چطوری صدا زده بشه». با call و apply تابع رو با this دلخواه اجرا می‌کنی و bind یه نسخه‌ی جدید با this ثابت می‌سازه. توابع پیکانی this خودشون ندارن.',
   'The value of this depends on how a function is called. call and apply run a function with a chosen this, and bind creates a new function with a fixed this. Arrow functions have no this of their own.',
   `function intro(greet) {\n  console.log(greet + ", I am " + this.name);\n}\n\nconst a = { name: "Arthur" };\nconst b = { name: "Merlin" };\n\nintro.call(a, "Hi");\nintro.apply(b, ["Hello"]);\n\nconst boundA = intro.bind(a);\nboundA("Hey");`]],
 e:[{c:`const hero = {\n  name: "Elf",\n  hi() { console.log("I am " + this.name); }\n};\nhero.hi();`,n:['وقتی با hero.hi() صدا میزنی this همون hero هست.','When called as hero.hi(), this is hero.']},
    {c:`const hero = {\n  name: "Elf",\n  later() {\n    setTimeout(() => console.log(this.name), 10);\n  }\n};\nhero.later();`,n:['تابع پیکانی this رو از بیرون به ارث می‌بره.','The arrow function inherits this from outside.']}],
 q:{p:['تابع show() بساز که this.hp رو چاپ کنه و با call روی { hp: 42 } اجراش کن.','Create show() that logs this.hp and run it with call on { hp: 42 }.'],st:'',
    ok:(c,o)=>o.trim()==='42'&&/\.call\s*\(/.test(c),h:['function show() {\n  console.log(this.hp);\n}\nshow.call({ hp: 42 });','function show() {\n  console.log(this.hp);\n}\nshow.call({ hp: 42 });'],sol:'function show() {\n  console.log(this.hp);\n}\nshow.call({ hp: 42 });'}},
/* 31 */
{t:['پروتوتایپ','Prototypes'],
 s:[['پشت صحنه‌ی کلاس‌ها، جاوااسکریپت از «زنجیره‌ی پروتوتایپ» استفاده می‌کنه: اگه یه ویژگی روی خود شیء نبود، میره سراغ پروتوتایپ اون. Object.create شیئی با پروتوتایپ دلخواه می‌سازه.',
   'Behind classes, JavaScript uses the prototype chain: if a property is not on the object itself, it looks at its prototype. Object.create makes an object with a chosen prototype.',
   `const animal = {\n  speak() { console.log(this.name + " makes a sound"); }\n};\n\nconst dog = Object.create(animal);\ndog.name = "Rex";\ndog.speak();\n\nfunction Hero(name) { this.name = name; }\nHero.prototype.hello = function () {\n  console.log("I am " + this.name);\n};\nnew Hero("Arthur").hello();`]],
 e:[{c:`const base = { kind: "base" };\nconst child = Object.create(base);\nconsole.log(child.kind);\nconsole.log(Object.hasOwn(child, "kind"));`,n:['kind از پروتوتایپ میاد، نه خود child.','kind comes from the prototype, not child itself.']},
    {c:`console.log(Object.getPrototypeOf([]) === Array.prototype);`,n:['هر آرایه پروتوتایپش Array.prototype هست.','Every array has Array.prototype as its prototype.']}],
 q:{p:['شیء base با متد hi() که "hi" چاپ کنه بساز، با Object.create یه شیء child از اون بساز و child.hi() رو صدا بزن.','Create base with a method hi() that logs "hi", make child with Object.create(base), and call child.hi().'],st:'',
    ok:(c,o)=>o.trim()==='hi'&&/Object\.create\s*\(/.test(c),h:['const base = { hi() { console.log("hi"); } };\nconst child = Object.create(base);\nchild.hi();','const base = { hi() { console.log("hi"); } };\nconst child = Object.create(base);\nchild.hi();'],sol:'const base = { hi() { console.log("hi"); } };\nconst child = Object.create(base);\nchild.hi();'}},
/* 32 */
{t:['Date و Symbol','Date & Symbol'],
 s:[['new Date(سال, ماه, روز) تاریخ می‌سازه (ماه‌ها از ۰ شروع میشن!). متدهایی مثل getFullYear و getDay دارن. Symbol مقداریه که همیشه یکتاست و برای کلیدهای مخفی/منحصربه‌فرد استفاده میشه.',
   'new Date(year, month, day) creates a date (months start at 0!). It has methods like getFullYear and getDay. A Symbol is always unique and used for hidden/unique keys.',
   `const d = new Date(2024, 0, 15);\nconsole.log(d.getFullYear());\nconsole.log(d.getMonth());\nconsole.log(d.getDate());\n\nconst a = new Date(2024, 0, 1);\nconst b = new Date(2024, 0, 31);\nconsole.log((b - a) / (1000 * 60 * 60 * 24));\n\nconst id = Symbol("id");\nconst o = { [id]: 1 };\nconsole.log(o[id], Symbol("x") === Symbol("x"));`]],
 e:[{c:`const d = new Date(2024, 1, 29);\nconsole.log(d.getDate(), d.getMonth() + 1);`,n:['فوریه ماه شماره‌ی ۱ هست، برای نمایش یکی اضافه می‌کنیم.','February is month 1, so we add one for display.']},
    {c:`const d = new Date(2024, 0, 1);\nd.setDate(d.getDate() + 45);\nconsole.log(d.getMonth() + 1, d.getDate());`,n:['setDate سرریز رو خودش به ماه بعد می‌بره.','setDate rolls overflow into the next month by itself.']}],
 q:{p:['با new Date(2025, 4, 20) تاریخ بساز و فقط سالش رو با getFullYear چاپ کن.','Create new Date(2025, 4, 20) and print only its year with getFullYear.'],st:'',
    ok:(c,o)=>o.trim()==='2025'&&/getFullYear/.test(c),h:['const d = new Date(2025, 4, 20);\nconsole.log(d.getFullYear());','const d = new Date(2025, 4, 20);\nconsole.log(d.getFullYear());'],sol:'const d = new Date(2025, 4, 20);\nconsole.log(d.getFullYear());'}},
/* 33 */
{t:['ماژول‌ها و الگوی ماژول','Modules & module pattern'],
 s:[['برنامه‌های بزرگ به فایل‌های کوچک (ماژول) تقسیم میشن: با export چیزی رو بیرون میدیم و با import می‌گیریم. اینجا فقط یک فایل داریم، پس با «الگوی ماژول» (تابع بلافاصله‌اجرا + closure) همون کار رو شبیه‌سازی می‌کنیم: داده‌ی خصوصی و API عمومی.',
   'Big programs are split into small files (modules): we export something and import it elsewhere. We only have one file here, so we mimic it with the module pattern (an immediately invoked function + closure): private data and a public API.',
   `const counter = (function () {\n  let count = 0;\n  return {\n    inc() { count++; return count; },\n    get() { return count; }\n  };\n})();\n\ncounter.inc();\ncounter.inc();\nconsole.log(counter.get());\nconsole.log(counter.count);`]],
 e:[{c:`const math = (() => {\n  const sq = x => x * x;\n  return { sq };\n})();\nconsole.log(math.sq(7));`,n:['فقط چیزی که return می‌کنی عمومیه.','Only what you return is public.']},
    {c:`// در فایل‌های واقعی:\n// export const PI = 3.14;\n// import { PI } from "./math.js";\nconsole.log("ماژول‌ها = فایل‌های جدا");`,n:['export/import در پروژه‌های چندفایلی استفاده میشن.','export/import are used in multi-file projects.']}],
 q:{p:['با الگوی ماژول یه شیء bank بساز که deposit(n) و balance() داشته باشه. ۵۰ واریز کن و balance() رو چاپ کن.','Use the module pattern to build bank with deposit(n) and balance(). Deposit 50 and print balance().'],st:'',
    ok:(c,o)=>o.trim()==='50'&&/\(\s*(function|\(\)\s*=>|\(\)\s*=>)/.test(c)&&/balance/.test(c),h:['const bank = (function () {\n  let money = 0;\n  return {\n    deposit(n) { money += n; },\n    balance() { return money; }\n  };\n})();\nbank.deposit(50);\nconsole.log(bank.balance());','const bank = (function () {\n  let money = 0;\n  return {\n    deposit(n) { money += n; },\n    balance() { return money; }\n  };\n})();\nbank.deposit(50);\nconsole.log(bank.balance());'],sol:'const bank = (function () {\n  let money = 0;\n  return {\n    deposit(n) { money += n; },\n    balance() { return money; }\n  };\n})();\nbank.deposit(50);\nconsole.log(bank.balance());'}}
);

/* ================= HTML extra (29-33) ================= */
LESSONS.html.push(
/* 29 */
{t:['متغیرهای CSS','CSS variables'],
 s:[['متغیر CSS با -- شروع میشه و با var() استفاده میشه. معمولا تو :root تعریف‌شون می‌کنیم تا یه‌جا رنگ و اندازه‌ها رو عوض کنی و همه‌جا تغییر کنه.',
   'A CSS variable starts with -- and is used with var(). We usually define them in :root so you change a colour or size in one place and it updates everywhere.',
   `<style>\n  :root {\n    --gold: #f5c542;\n    --gap: 12px;\n  }\n  .card {\n    background: #222;\n    color: var(--gold);\n    padding: var(--gap);\n    border: 2px solid var(--gold);\n  }\n</style>\n<div class="card">Quest board</div>`]],
 e:[{c:`<style>\n  :root { --main: crimson; }\n  h1 { color: var(--main); }\n  p { border-left: 4px solid var(--main); padding-left: 8px; }\n</style>\n<h1>Dragon</h1>\n<p>Beware the fire.</p>`,n:['با عوض کردن --main هر دو جا عوض میشه.','Changing --main changes both places.']},
    {c:`<style>\n  .box { --size: 60px; width: var(--size); height: var(--size); background: teal; }\n  .big { --size: 100px; }\n</style>\n<div class="box"></div>\n<div class="box big"></div>`,n:['متغیر می‌تونه روی یه کلاس خاص بازتعریف بشه.','A variable can be redefined on a specific class.']}],
 q:{p:['متغیر --hero رو با مقدار purple توی :root تعریف کن و رنگ h1 رو با var(--hero) بذار.','Define --hero as purple in :root and colour the h1 with var(--hero).'],st:'<h1>Hero</h1>',
    ok:(c,o,d)=>/--hero\s*:\s*purple/i.test(c)&&/color\s*:\s*var\(\s*--hero\s*\)/i.test(c),h:['<style>\n  :root { --hero: purple; }\n  h1 { color: var(--hero); }\n</style>\n<h1>Hero</h1>','<style>\n  :root { --hero: purple; }\n  h1 { color: var(--hero); }\n</style>\n<h1>Hero</h1>'],sol:'<style>\n  :root { --hero: purple; }\n  h1 { color: var(--hero); }\n</style>\n<h1>Hero</h1>'}},
/* 30 */
{t:['position و z-index','position & z-index'],
 s:[['position تعیین می‌کنه عنصر کجا قرار بگیره: relative (نسبت به جای خودش)، absolute (نسبت به نزدیک‌ترین والد دارای position)، fixed (ثابت روی صفحه) و sticky (می‌چسبه). z-index هم مشخص می‌کنه کدوم عنصر روی کدوم باشه.',
   'position decides where an element sits: relative (from its own place), absolute (relative to the nearest positioned parent), fixed (stuck to the screen) and sticky (sticks while scrolling). z-index decides which element is on top.',
   `<style>\n  .wrap { position: relative; width: 200px; height: 120px; background: #345; }\n  .badge {\n    position: absolute;\n    top: 8px;\n    right: 8px;\n    background: gold;\n    padding: 4px;\n    z-index: 2;\n  }\n</style>\n<div class="wrap">\n  Castle\n  <span class="badge">NEW</span>\n</div>`]],
 e:[{c:`<style>\n  .a { position: relative; top: 10px; left: 20px; background: #ccc; width: 80px; }\n</style>\n<div class="a">moved</div>`,n:['relative عنصر رو نسبت به جای اصلی‌ش جابه‌جا می‌کنه.','relative shifts the element from its original place.']},
    {c:`<style>\n  .back { position: absolute; width: 80px; height: 80px; background: tomato; z-index: 1; }\n  .front { position: absolute; left: 40px; top: 40px; width: 80px; height: 80px; background: royalblue; z-index: 2; }\n</style>\n<div class="back"></div>\n<div class="front"></div>`,n:['z-index بزرگ‌تر میاد جلوتر.','The larger z-index is drawn on top.']}],
 q:{p:['برای .tag یه position: absolute با top: 0 و right: 0 بذار (والدش .box با position: relative هست).','Give .tag position: absolute with top: 0 and right: 0 (its parent .box has position: relative).'],st:'<style>\n  .box { position: relative; width: 150px; height: 80px; background: #ddd; }\n</style>\n<div class="box"><span class="tag">hot</span></div>',
    ok:(c,o,d)=>/\.tag\s*\{[^}]*position\s*:\s*absolute/i.test(c)&&/\.tag\s*\{[^}]*top\s*:\s*0/i.test(c)&&/\.tag\s*\{[^}]*right\s*:\s*0/i.test(c),h:['.tag { position: absolute; top: 0; right: 0; }','.tag { position: absolute; top: 0; right: 0; }'],sol:'<style>\n  .box { position: relative; width: 150px; height: 80px; background: #ddd; }\n  .tag { position: absolute; top: 0; right: 0; }\n</style>\n<div class="box"><span class="tag">hot</span></div>'}},
/* 31 */
{t:['شبه‌کلاس‌ها و شبه‌عنصرها','Pseudo-classes & pseudo-elements'],
 s:[['شبه‌کلاس (با یه دو‌نقطه) حالت عنصر رو انتخاب می‌کنه: :hover، :first-child، :nth-child(2). شبه‌عنصر (با دو دو‌نقطه) بخشی از عنصر رو می‌سازه: ::before و ::after که با content متن اضافه می‌کنن.',
   'A pseudo-class (one colon) selects a state: :hover, :first-child, :nth-child(2). A pseudo-element (two colons) creates a part of an element: ::before and ::after add text with content.',
   `<style>\n  button:hover { background: gold; }\n  li:first-child { font-weight: bold; }\n  li:nth-child(even) { color: tomato; }\n  .quest::before { content: "⚔ "; }\n</style>\n<button>Hover me</button>\n<ul>\n  <li>One</li><li>Two</li><li>Three</li><li>Four</li>\n</ul>\n<p class="quest">Slay the dragon</p>`]],
 e:[{c:`<style>\n  a:hover { color: crimson; }\n  a::after { content: " →"; }\n</style>\n<a href="#">Next</a>`,n:['::after بعد از محتوای لینک یه فلش اضافه می‌کنه.','::after adds an arrow after the link content.']},
    {c:`<style>\n  tr:nth-child(odd) { background: #eee; }\n</style>\n<table>\n  <tr><td>1</td></tr><tr><td>2</td></tr><tr><td>3</td></tr>\n</table>`,n:['ردیف‌های راه‌راه با nth-child(odd).','Striped rows with nth-child(odd).']}],
 q:{p:['با ::before قبل از هر .item یه ستاره ★ (با content) اضافه کن.','Use ::before to add a star ★ (with content) before each .item.'],st:'<p class="item">Sword</p>\n<p class="item">Shield</p>',
    ok:(c,o,d)=>/\.item::before\s*\{[^}]*content\s*:\s*["'][^"']*★/i.test(c),h:['.item::before { content: "★ "; }','.item::before { content: "★ "; }'],sol:'<style>\n  .item::before { content: "★ "; }\n</style>\n<p class="item">Sword</p>\n<p class="item">Shield</p>'}},
/* 32 */
{t:['تصویر، صدا، ویدیو و SVG','Media, embeds & SVG'],
 s:[['برای صدا و ویدیو از <audio> و <video> با controls استفاده می‌کنیم (src فایل رو مشخص می‌کنه). <iframe> یه صفحه‌ی دیگه رو داخل صفحه نشون میده. SVG هم تصویر برداریه که با کد کشیده میشه و هیچ‌وقت کیفیتش کم نمیشه.',
   'For sound and video we use <audio> and <video> with controls (src points to the file). <iframe> shows another page inside yours. SVG is a vector image drawn with code that never loses quality.',
   `<svg width="120" height="120" viewBox="0 0 120 120">\n  <circle cx="60" cy="60" r="50" fill="gold" stroke="orange" stroke-width="6" />\n  <rect x="40" y="45" width="40" height="30" fill="crimson" />\n</svg>\n\n<audio controls></audio>\n<video controls width="200"></video>`]],
 e:[{c:`<svg width="150" height="60">\n  <rect width="150" height="60" fill="#234" />\n  <text x="75" y="38" text-anchor="middle" fill="white" font-size="20">Code Flex</text>\n</svg>`,n:['text داخل SVG مثل نوشته‌ی روی بوم عمل می‌کنه.','text inside SVG acts like writing on a canvas.']},
    {c:`<svg width="120" height="80">\n  <polygon points="60,5 115,75 5,75" fill="seagreen" />\n</svg>`,n:['polygon با لیست نقطه‌ها شکل چندضلعی می‌کشه.','polygon draws a shape from a list of points.']}],
 q:{p:['یه SVG با یه <circle> قرمز (fill="red") و شعاع r="30" بکش.','Draw an SVG with a red <circle> (fill="red") with radius r="30".'],st:'',
    ok:(c,o,d)=>/<svg[\s>][\s\S]*<circle[^>]*\br\s*=\s*"30"[^>]*>[\s\S]*<\/svg>/i.test(c)&&/<circle[^>]*fill\s*=\s*"red"/i.test(c),h:['<svg width="100" height="100">\n  <circle cx="50" cy="50" r="30" fill="red" />\n</svg>','<svg width="100" height="100">\n  <circle cx="50" cy="50" r="30" fill="red" />\n</svg>'],sol:'<svg width="100" height="100">\n  <circle cx="50" cy="50" r="30" fill="red" />\n</svg>'}},
/* 33 */
{t:['حالت تاریک و details','Dark mode & details'],
 s:[['با @media (prefers-color-scheme: dark) می‌تونی ظاهر صفحه رو برای کاربرانی که حالت تاریک دارن عوض کنی. تگ <details> با <summary> هم یه بخش بازشونده می‌سازه، بدون هیچ جاوااسکریپتی.',
   'With @media (prefers-color-scheme: dark) you can change the look for users who prefer dark mode. The <details> tag with <summary> makes a collapsible section with no JavaScript at all.',
   `<style>\n  body { background: white; color: #111; }\n  @media (prefers-color-scheme: dark) {\n    body { background: #111; color: #eee; }\n  }\n</style>\n<details>\n  <summary>Show the hint</summary>\n  <p>The key is under the stone.</p>\n</details>`]],
 e:[{c:`<details open>\n  <summary>Inventory</summary>\n  <ul><li>Sword</li><li>Potion</li></ul>\n</details>`,n:['ویژگی open باعث میشه از اول باز باشه.','The open attribute makes it start expanded.']},
    {c:`<style>\n  :root { --bg: #fff; --fg: #000; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #fff; } }\n  body { background: var(--bg); color: var(--fg); }\n</style>\n<p>Hello</p>`,n:['ترکیب متغیرها با حالت تاریک خیلی تمیزه.','Combining variables with dark mode is very clean.']}],
 q:{p:['یه <details> با <summary> «Secret» و یه <p> داخلش بساز.','Create a <details> with a <summary> "Secret" and a <p> inside.'],st:'',
    ok:(c,o,d)=>/<details[\s>][\s\S]*<summary[\s>][^<]*Secret[^<]*<\/summary>[\s\S]*<p[\s>][\s\S]*<\/details>/i.test(c),h:['<details>\n  <summary>Secret</summary>\n  <p>...</p>\n</details>','<details>\n  <summary>Secret</summary>\n  <p>...</p>\n</details>'],sol:'<details>\n  <summary>Secret</summary>\n  <p>The treasure is here.</p>\n</details>'}}
);

/* ================= NODE extra (26-28) ================= */
LESSONS.node.push(
/* 26 */
{t:['process: env و argv','process: env & argv'],
 s:[['شیء process اطلاعات برنامه رو میده: process.argv آرگومان‌های خط فرمان، process.env متغیرهای محیطی (مثل پورت یا کلید) و process.platform سیستم‌عامل. برای تنظیمات برنامه از env استفاده کن.',
   'The process object describes the running program: process.argv holds the command-line arguments, process.env the environment variables (like port or keys) and process.platform the OS. Use env for app settings.',
   `const port = process.env.PORT || 3000;\nconsole.log("port:", port);\nconsole.log(process.argv.length);\nconsole.log(typeof process.platform);`]],
 e:[{c:`const mode = process.env.NODE_ENV ?? "production";\nconsole.log(mode);`,n:['اگه NODE_ENV تنظیم نشده باشه مقدار پیش‌فرض می‌گیریم.','If NODE_ENV is not set we fall back to a default.']},
    {c:`const args = process.argv.slice(2);\nconsole.log(args.length === 0 ? "no args" : args);`,n:['دو عضو اول argv مسیر node و فایل هستن.','The first two items of argv are the node path and the file.']}],
 q:{p:['مقدار process.env.PORT رو بخون و اگه نبود 8080 رو در متغیر port بذار. "Port: 8080" رو چاپ کن.','Read process.env.PORT, fall back to 8080 in port, and print "Port: 8080".'],st:'',

{t:['util.promisify','util.promisify'],
 s:[['بعضی توابع قدیمی به‌جای Promise از callback استفاده می‌کنن. util.promisify یه تابع callback-style رو به نسخه‌ی Promise تبدیل می‌کنه تا بشه با async/await استفاده‌ش کرد (callback باید به شکل (err, result) باشه).',
   'Some older functions use callbacks instead of Promises. util.promisify converts a callback-style function into a Promise version so you can use async/await (the callback must be (err, result)).',
   `const util = require('util');\n\nfunction slowAdd(a, b, cb) {\n  setTimeout(() => cb(null, a + b), 100);\n}\n\nconst add = util.promisify(slowAdd);\n\nasync function main() {\n  const r = await add(2, 3);\n  console.log("result:", r);\n}\nmain();`]],
 e:[{c:`const util = require('util');\nfunction fail(cb) { setTimeout(() => cb(new Error("boom")), 10); }\nconst pf = util.promisify(fail);\npf().catch(e => console.log("caught:", e.message));`,n:['اگه callback ارور بده، Promise رد (reject) میشه.','If the callback gets an error, the Promise rejects.']},
    {c:`const { promisify } = require('util');\nconst wait = promisify(setTimeout);\nasync function go() {\n  console.log("start");\n  await wait(50);\n  console.log("done");\n}\ngo();`,n:['setTimeout هم یه نسخه‌ی promisify شده‌ی خاص داره.','setTimeout has a special promisified version too.']}],
 q:{p:['تابع greet(name, cb) رو که بعد ۱۰ms با cb(null, "Hi " + name) جواب میده promisify کن و نتیجه‌ی greet("Ali") رو با await چاپ کن.','Promisify greet(name, cb) that answers after 10ms with cb(null, "Hi " + name) and print the awaited result of greet("Ali").'],st:'',
    ok:(c,o)=>o.trim()==='Hi Ali'&&/promisify/.test(c)&&/await/.test(c),h:["const util = require('util');\nfunction greetCb(name, cb) {\n  setTimeout(() => cb(null, 'Hi ' + name), 10);\n}\nconst greet = util.promisify(greetCb);\n(async () => {\n  console.log(await greet('Ali'));\n})();","const util = require('util');\nfunction greetCb(name, cb) {\n  setTimeout(() => cb(null, 'Hi ' + name), 10);\n}\nconst greet = util.promisify(greetCb);\n(async () => {\n  console.log(await greet('Ali'));\n})();"],sol:"const util = require('util');\nfunction greetCb(name, cb) {\n  setTimeout(() => cb(null, 'Hi ' + name), 10);\n}\nconst greet = util.promisify(greetCb);\n(async () => {\n  console.log(await greet('Ali'));\n})();"}},

{t:['EventEmitter پیشرفته','EventEmitter deeper'],
 s:[['علاوه بر on و emit: once فقط یک‌بار گوش میده، off (یا removeListener) شنونده رو برمی‌داره و listenerCount تعداد شنونده‌ها رو میده. emit می‌تونه چند آرگومان به شنونده‌ها بفرسته.',
   'Besides on and emit: once listens only one time, off (or removeListener) removes a listener and listenerCount tells how many listeners exist. emit can pass several arguments to listeners.',
   `const EventEmitter = require('events');\nconst bus = new EventEmitter();\n\nbus.once('boss', name => console.log("first time:", name));\nconst hit = (who, dmg) => console.log(who, "took", dmg);\nbus.on('hit', hit);\n\nbus.emit('boss', 'Dragon');\nbus.emit('boss', 'Dragon');\nbus.emit('hit', 'Knight', 12);\nconsole.log(bus.listenerCount('hit'));\nbus.off('hit', hit);\nconsole.log(bus.listenerCount('hit'));`]],
 e:[{c:`const EventEmitter = require('events');\nclass Door extends EventEmitter {\n  open() { this.emit('opened', Date.now() > 0); }\n}\nconst d = new Door();\nd.on('opened', ok => console.log("opened:", ok));\nd.open();`,n:['می‌تونی از EventEmitter ارث‌بری کنی.','You can extend EventEmitter.']},
    {c:`const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.on('x', () => console.log("A"));\ne.on('x', () => console.log("B"));\ne.emit('x');`,n:['شنونده‌ها به ترتیب ثبت اجرا میشن.','Listeners run in registration order.']}],

    ok:(c,o)=>o.trim()==='pong'&&/\.once\s*\(/.test(c),h:["const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.once('ping', () => console.log('pong'));\ne.emit('ping');\ne.emit('ping');","const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.once('ping', () => console.log('pong'));\ne.emit('ping');\ne.emit('ping');"],sol:"const EventEmitter = require('events');\nconst e = new EventEmitter();\ne.once('ping', () => console.log('pong'));\ne.emit('ping');\ne.emit('ping');"}}

/* ================= SOUND (WebAudio, fully offline) ================= */
const SFX=(function(){
  let ctx=null,master=null,musicOn=false,clickOn=true,timer=null,step=0,nextT=0,musicGain=null,mode='menu';
  const A=(n)=>440*Math.pow(2,(n-69)/12); // midi -> Hz
  // a cheerful fantasy chiptune loop: 2 bars melody + bass (16 steps of 8th notes)
  const mel=[72,0,76,0,79,76,0,74, 72,0,69,0,71,74,0,0, 72,0,76,0,79,81,0,79, 77,76,74,0,72,0,0,0];
  const bas=[48,0,48,0,55,0,55,0, 45,0,45,0,52,0,52,0, 53,0,53,0,48,0,48,0, 55,0,55,0,48,0,48,0];
  function ensure(){
    if(ctx)return true;
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
      ctx=new C();master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
      musicGain=ctx.createGain();musicGain.gain.value=0.05;musicGain.connect(master);
    }catch(e){ctx=null;return false}
    return true;
  }
  function tone(freq,t,dur,type,vol,dest){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.02);
  }
  // soft piano: a few decaying harmonics + gentle low-pass, like a felt piano
  function piano(freq,t,dur,vol){
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(4200,freq*7);
    lp.connect(musicGain);
    [[1,1,1],[2,0.35,0.7],[3,0.14,0.45],[4,0.06,0.3]].forEach(([m,a,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(freq*m,t);
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol*a,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur*d);
      o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur*d+0.05);
    });
  }
  // slow, Satie-like phrase: 4 chords x 8 steps (0.75s each)
  const calmChords=[
    {bass:45,arp:[57,60,64,67],mel:{2:76,5:74}},   // Am7
    {bass:41,arp:[53,57,60,64],mel:{2:72,6:74}},   // Fmaj7
    {bass:48,arp:[55,60,64,67],mel:{2:79,5:76}},   // C
    {bass:43,arp:[55,59,62,67],mel:{2:74,6:71}}    // G
  ];
  function tick(){
    if(!ctx||!musicOn)return;
    if(mode==='calm'){
      const sp=0.75;
      while(nextT<ctx.currentTime+1.0){
        const c=calmChords[Math.floor(step/8)%calmChords.length],k=step%8;
        if(k===0)piano(A(c.bass),nextT,6,0.9);
        if(k>0||true){const n=c.arp[[0,1,2,3,2,1,2,1][k]];piano(A(n),nextT+(k===0?0.05:0),2.6,0.5)}
        if(c.mel[k])piano(A(c.mel[k]),nextT+0.02,3.4,0.75);
        nextT+=sp;step++;
      }
      return;
    }
    const spb=0.2; // seconds per 8th note
    while(nextT<ctx.currentTime+0.4){
      const i=step%mel.length;
      if(mel[i])tone(A(mel[i]),nextT,spb*0.9,'square',0.6,musicGain);
      if(bas[i])tone(A(bas[i]),nextT,spb*1.6,'triangle',0.9,musicGain);
      nextT+=spb;step++;
    }
  }
  function synthStart(){
    if(!musicOn||!ensure())return;
    if(ctx.state==='suspended')ctx.resume();
    if(timer)return;
    nextT=ctx.currentTime+0.05;step=0;
    timer=setInterval(tick,120);tick();
  }
  function synthStop(){if(timer){clearInterval(timer);timer=null}}

  /* ---- real music files (offline, shipped next to index.html in /audio) ---- */
  const TRACKS={menu:['audio/haggstrom.mp3'],calm:['audio/subwoofer-lullaby.mp3','audio/minecraft.mp3']};
  const VOL={menu:0.55,calm:0.4};
  let au=null,fileFail=false,auMode=null,auIdx=0,fadeT=null,calmStart=Math.floor(Math.random()*2);
  function fade(to,ms,cb){
    if(!au)return;clearInterval(fadeT);
    const from=au.volume,t0=Date.now();
    fadeT=setInterval(()=>{
      const k=Math.min(1,(Date.now()-t0)/ms);
      try{au.volume=Math.max(0,Math.min(1,from+(to-from)*k))}catch(e){}
      if(k>=1){clearInterval(fadeT);if(cb)cb()}
    },40);
  }
  function loadTrack(){
    const list=TRACKS[auMode];
    au.src=list[(auMode==='calm'?calmStart+auIdx:auIdx)%list.length];
    au.volume=0;
    const p=au.play();if(p&&p.catch)p.catch(()=>{});
    fade(VOL[auMode],1200);
  }
  function fileStart(){
    if(fileFail||!musicOn)return;
    if(!au){
      au=new Audio();au.preload='auto';
      au.addEventListener('error',()=>{ // file missing -> fall back to the built-in synth music
        fileFail=true;au=null;if(musicOn)synthStart();
      });
      au.addEventListener('ended',()=>{
        if(!au)return;
        auIdx++;loadTrack();
      });
    }
    if(auMode!==mode||!au.src){auMode=mode;auIdx=0;loadTrack()}
    else if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{});fade(VOL[auMode],800)}
  }
  function fileStop(){
    if(!au)return;
    fade(0,500,()=>{if(au)au.pause()});
  }
  function startMusic(){fileStart();if(fileFail)synthStart()}
  function stopMusic(){fileStop();synthStop()}
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){synthStop();if(au){clearInterval(fadeT);au.pause()}if(ctx&&ctx.state==='running')ctx.suspend()}
    else if(musicOn){if(ctx)ctx.resume();startMusic()}
  });
  return {
    // call on any user gesture so audio is allowed to start
    unlock(){if(!ensure())return;if(ctx.state==='suspended')ctx.resume();if(musicOn)startMusic()},
    setMode(m){
      if(m===mode)return;mode=m;step=0;
      if(au&&!fileFail){ // crossfade: fade the current track out, then start the other mood
        if(musicOn){fade(0,600,()=>{if(!au)return;au.pause();auMode=mode;auIdx=0;loadTrack()})}
        else auMode=null;
      }
      if(ctx&&musicGain){ // synth fallback: fresh bus for the new mood
        const old=musicGain,t=ctx.currentTime;
        old.gain.cancelScheduledValues(t);old.gain.setValueAtTime(old.gain.value,t);old.gain.linearRampToValueAtTime(0.0001,t+0.8);
        setTimeout(()=>{try{old.disconnect()}catch(e){}},1000);
        musicGain=ctx.createGain();musicGain.gain.value=m==='calm'?0.12:0.05;musicGain.connect(master);
        nextT=t+0.1;
      }
    },
    setMusic(on){musicOn=!!on;if(musicOn)startMusic();else stopMusic()},
    setClick(on){clickOn=!!on},
    click(){if(!clickOn||!ensure())return;if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;tone(660,t,0.05,'square',0.18);tone(990,t+0.03,0.05,'square',0.12)},
    key(){if(!clickOn||!ensure())return;if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;tone(1500+Math.random()*300,t,0.025,'square',0.1)}
  };
})();
</script>

const spriteCache={};
function sprite(rows,pal,sc){
  const key=rows.join('')+JSON.stringify(pal)+sc;
  if(spriteCache[key])return spriteCache[key];
  const c=document.createElement('canvas');c.width=rows[0].length*sc;c.height=rows.length*sc;
  const x=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=pal[ch]||'#f0f';x.fillRect(i*sc,y*sc,sc,sc)}}));
  return spriteCache[key]=c.toDataURL();
}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',1900)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function confetti(){
  const cols=['#ffd24a','#ff6ec7','#4de1ff','#5cff8f','#fff'];
  for(let i=0;i<34;i++){
    const d=document.createElement('div');d.className='conf';
    d.style.left=(20+Math.random()*60)+'%';d.style.top=(10+Math.random()*10)+'%';
    d.style.background=cols[i%cols.length];d.style.setProperty('--dx',(Math.random()*160-80)+'px');
    d.style.animationDelay=(Math.random()*.3)+'s';
    $('#app').appendChild(d);setTimeout(()=>d.remove(),1900);
  }
}

let bgOn=false,BW=100,BH=200,bx=bg.getContext('2d'),stars=[],flies=[];
function resizeBg(){const r=bg.getBoundingClientRect();BH=Math.max(120,Math.round(BW*(r.height||600)/(r.width||360)));bg.width=BW;bg.height=BH}
for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random()*.6,p:Math.random()*6});
for(let i=0;i<14;i++)flies.push({x:Math.random(),y:.6+Math.random()*.35,p:Math.random()*6,s:.3+Math.random()*.7});
function lerp(a,b,t){return a+(b-a)*t}
function hexc(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(a,b,t){const A=hexc(a),B=hexc(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}
function drawBg(t){
  const W=BW,H=BH;
  for(let y=0;y<H;y+=3){const f=y/H;bx.fillStyle=f<.6?mix('#0f0526','#4a2380',f/.6):mix('#4a2380','#ff7aa8',(f-.6)/.4);bx.fillRect(0,y,W,3)}
  stars.forEach(s=>{const on=Math.sin(t*.004+s.p)>-.2;bx.fillStyle=on?'#fff':'#6b5fa0';bx.fillRect(Math.floor(s.x*W),Math.floor(s.y*H),1,1)});
  // moon
  const mx=Math.floor(W*.12),my=Math.floor(H*.3);
  for(let y=-6;y<=6;y++)for(let x=-6;x<=6;x++)if(x*x+y*y<=36){bx.fillStyle=(x+2)*(x+2)+(y-1)*(y-1)<20?'#fff6c9':'#f4e48a';bx.fillRect(mx+x,my+y,1,1)}
  bx.fillStyle='#d9c76a';bx.fillRect(mx-2,my-2,2,2);bx.fillRect(mx+2,my+2,2,1);
  // clouds
  for(let i=0;i<3;i++){const cx=((t*.006*(1+i*.4)+i*40)%(W+30))-15,cy=H*(.2+i*.07);bx.fillStyle='#7d5bbf';
    bx.fillRect(cx,cy,14,3);bx.fillRect(cx+3,cy-2,8,2);bx.fillRect(cx+2,cy+3,10,1)}
  // mountains
  const base=H*.74;
  for(let x=0;x<W;x++){const h=Math.sin((x+t*.004)*.11)*6+Math.sin(x*.05+1)*9+14;bx.fillStyle='#34196a';bx.fillRect(x,Math.floor(base-h),1,H)}
  for(let x=0;x<W;x++){const h=Math.sin(x*.09+2)*5+Math.sin(x*.03)*7+8;bx.fillStyle='#220f4b';bx.fillRect(x,Math.floor(base+6-h),1,H)}
  // castle (right)
  const cx=Math.floor(W*.62),cy=Math.floor(base-8);
  bx.fillStyle='#15082f';
  bx.fillRect(cx,cy,30,30);bx.fillRect(cx-2,cy-12,8,14);bx.fillRect(cx+24,cy-12,8,14);bx.fillRect(cx+11,cy-18,8,20);
  for(let i=0;i<4;i++){bx.fillRect(cx-2+i*3,cy-14,2,2);bx.fillRect(cx+24+i*3-2,cy-14,2,2)}
  bx.fillRect(cx+10,cy-20,2,2);bx.fillRect(cx+14,cy-20,2,2);bx.fillRect(cx+17,cy-20,2,2);
  bx.fillStyle='#4a3a2a';bx.fillRect(cx+14,cy-26,1,7);
  bx.fillStyle=(Math.floor(t/200)%2)?'#ff6ec7':'#ff9fdc';bx.fillRect(cx+15,cy-26,4+(Math.floor(t/200)%2),2);
  [[cx+13,cy-12],[cx+2,cy-8],[cx+27,cy-8],[cx+8,cy+8],[cx+20,cy+8]].forEach((w,i)=>{bx.fillStyle=Math.sin(t*.003+i*2)>-.3?'#ffd24a':'#7a5a1a';bx.fillRect(w[0],w[1],2,3)});
  // ground
  bx.fillStyle='#120826';bx.fillRect(0,Math.floor(H*.93),W,H);
  bx.fillStyle='#1d5a3a';for(let x=0;x<W;x+=3)bx.fillRect(x,Math.floor(H*.93),2,1+((x*7)%3));
  // fireflies
  flies.forEach(f=>{const x=(f.x*W+Math.sin(t*.001*f.s+f.p)*6+W)%W,y=f.y*H+Math.cos(t*.0013*f.s+f.p)*4;
    bx.fillStyle=Math.sin(t*.005+f.p)>0?'#d6ff7a':'#7aa83a';bx.fillRect(Math.floor(x),Math.floor(y),1,1)});
}

const CHIPS={py:['"',"'",'(',')',':','=','[',']','{','}','#','    '],js:['"','`','(',')','{','}','[',']',';','=','>','$','  '],node:['"','`','(',')','{','}','[',']',';','=','>','.','  '],html:['<','>','/','"','=','!','  ']};
function hl(code,lang){

  if(lang==='html'){
    return s.replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([\w-]+)|("[^"\n]*")|(\b[\w-]+)(?==)/g,(m,cm,o,tg,st,at)=>cm?`<span class="c">${cm}</span>`:tg?`${o}<span class="t">${tg}</span>`:st?`<span class="s">${st}</span>`:at?`<span class="a">${at}</span>`:m);

  const re=new RegExp('('+com+')|("(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\'|`[^`]*`)|\\b(\\d+\\.?\\d*)\\b|\\b('+kw+')\\b','gm');
  return s.replace(re,(m,c,st,n,k)=>c?`<span class="c">${c}</span>`:st?`<span class="s">${st}</span>`:n?`<span class="n">${n}</span>`:k?`<span class="k">${k}</span>`:m);

    });
    $('#hbtn').onclick=()=>{syncCode();LS.hint=!LS.hint;renderLesson()};
    const ab=$('#abtn');if(ab)ab.onclick=()=>{syncCode();LS.showAns=!LS.showAns;renderLesson()};
    $('#trun').onclick=runTask;
  }
}
function syncCode(){const ed=$('#ed');if(ed)LS.code=ed.value}
async function runTask(){
  syncCode();const {l,i,L}=LS;const tok=LS;
  const btn=$('#trun');if(btn)btn.classList.add('dis');
  const r=runCode(l,LS.code);
  if(r.pending){try{await r.pending}catch(e){r.err=String(e)}}
  if(LS!==tok)return;
  let pass=false;
  try{
    const doc=l==='html'?new DOMParser().parseFromString(LS.code,'text/html'):null;
    pass=!!L.q.ok(LS.code,r.out,doc)&&(l==='html'||!r.err);
  }catch(e){pass=false}
  r.pass=pass;LS.res=r;
  if(!pass)LS.tries++;
  const first=pass&&!LS.solved&&i>=save.done[l];
  if(pass){
    LS.solved=true;
    if(first){save.done[l]=i+1;persist();confetti();}
  }
  renderLesson();
  if(first)toast('+20 '+T('xp'));
  if(first)addXp(20);
}

/* ---------- QUIZ ---------- */
let QS=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizLangScreen(){
  SFX.setMode('calm');
  const btns=LANGS.map(l=>`<button class="mcard" data-l="${l}"><img class="px" src="${icon(l,4)}"><span class="nm">${LN[l]}</span><span class="pr">${save.done[l]}/${LESSONS[l].length}</span></button>`).join('');
  setScreen(`<div class="bar"><button class="pb" id="bk">⬅ ${T('back')}</button><div class="ttl">${T('quiz')}</div><div class="sp"></div></div>
   <div class="scroll"><div class="qbox panel center">${T('chooseLang')}</div><div class="mbtns">${btns}</div></div>`,'solid',false,menuScreen);
  $('#bk').onclick=menuScreen;
  scr.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    const l=b.dataset.l;if(save.done[l]===0){toast(T('noLesson'));return}quizScan(l);
  });
}
function quizScan(l){
  const done=save.done[l],L=LESSONS[l];
  const pool=QZ.filter(q=>q.l===l&&q.i<done);
  const rows=L.map((x,i)=>`<div class="scanrow"><i>${i<done?'✅':'🔒'}</i><span style="opacity:${i<done?1:.45}">${i+1}. ${P(x.t)}</span></div>`).join('');
  setScreen(`<div class="bar"><button class="pb" id="bk">⬅ ${T('back')}</button><div class="ttl mono">${LN[l]}</div><div class="sp"></div></div>
   <div class="scroll"><div class="qbox panel center" id="scanmsg">${T('scanning')}</div><div class="pbar"><i id="scanbar" style="width:0"></i></div>
   <div id="scanres" style="visibility:hidden"><div class="mono" style="font-weight:900;color:#ffd24a;margin-bottom:6px">${T('doneL')}: ${done}/${L.length}</div>${rows}
   <div class="center" style="margin:14px 0 6px"><button class="pb gr" id="go" style="padding:10px 18px;font-size:15px">${T('startQuiz')}</button></div></div></div>`,'solid',false,quizLangScreen);
  $('#bk').onclick=quizLangScreen;
  let w=0;const iv=setInterval(()=>{w+=10;const b=$('#scanbar');if(!b){clearInterval(iv);return}b.style.width=w+'%';
    if(w>=100){clearInterval(iv);$('#scanmsg').textContent=FA()?`${done} درس از ${L.length} درس رو تموم کردی؛ ${Math.min(10,pool.length)} سؤال از همین درس‌ها ازت می‌پرسم!`:`You finished ${done} of ${L.length} lessons; I will ask ${Math.min(10,pool.length)} questions from them!`;$('#scanres').style.visibility='visible'}},110);
  $('#go').onclick=()=>{
    const qs=shuffle(pool).slice(0,10).map(q=>({q,opts:shuffle(q.o.map((o,k)=>({o,ok:k===q.a})))}));
    QS={l,qs,i:0,score:0,done:false};quizQ();
  };
}
function quizQ(){
  const {qs,i,l}=QS,it=qs[i],q=it.q;
  const opts=it.opts.map((x,k)=>`<button class="opt" data-k="${k}">${esc(P(x.o))}</button>`).join('');
  setScreen(`<div class="bar"><button class="pb" id="bk">✕</button><div class="ttl mono">${LN[l]} · ${i+1}/${qs.length}</div><div class="sp"></div></div>
   <div class="scroll"><div class="pbar"><i style="width:${Math.round(i/qs.length*100)}%"></i></div>
   <div class="qbox panel ${FA()?'rtl':'ltr'}">${esc(FA()?q.fa:q.en)}</div><div class="${FA()?'':''}" id="opts">${opts}</div>
   <div class="center" id="nx" style="visibility:hidden"><button class="pb cy" id="nxb">${i===qs.length-1?T('results'):T('nextQ')} ➡</button></div></div>`,'solid',false,quizLangScreen);
  $('#bk').onclick=quizLangScreen;
  let locked=false;
  scr.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;
    const k=+b.dataset.k,ok=it.opts[k].ok;
    if(ok){QS.score++;b.classList.add('good')}else{b.classList.add('bad');scr.querySelectorAll('.opt')[it.opts.findIndex(o=>o.ok)].classList.add('good')}
    $('#nx').style.visibility='visible';
  });
  $('#nxb').onclick=()=>{if(i===qs.length-1)quizEnd();else{QS.i++;quizQ()}};
}
function quizEnd(){
  const {qs,score,l}=QS,pct=Math.round(score/qs.length*100),gain=score*3;
  const msg=pct>=90?(FA()?'عالی بود! تو یه قهرمانی 🏆':'Amazing! You are a champion 🏆'):pct>=60?(FA()?'خوب بود! ادامه بده 💪':'Good job! Keep going 💪'):(FA()?'مشکلی نیست، درس‌ها رو مرور کن و دوباره بیا 📖':'No worries, review the lessons and try again 📖');
  setScreen(`<div class="bar"><div class="sp"></div><div class="ttl">${T('results')}</div><div class="sp"></div></div>
   <div class="scroll center"><div class="qbox panel">${T('score')}<div class="big">${score}/${qs.length}</div><div class="mono" style="color:#5cff8f;font-weight:900">+${gain} ${T('xp')}</div></div>
   <div style="margin:12px 0 18px;font-weight:800">${msg}</div>
   <div style="display:flex;gap:10px;justify-content:center"><button class="pb cy" id="ag">${T('again')}</button><button class="pb" id="mn">${T('menu')}</button></div></div>`,'solid',false,menuScreen);
  save.quizzes++;persist();if(pct>=60)confetti();
  if(gain)addXp(gain);
  $('#ag').onclick=()=>quizScan(l);$('#mn').onclick=menuScreen;
}

/* ---------- GIT GUIDE ---------- */

 ()=>({t:['نصب و تنظیم','Install & setup'],

  x:['اول Git رو از سایت git-scm.com نصب کن. بعد توی ترمینال اسم و ایمیلت رو بهش بگو تا کنار هر تغییر ثبت بشه. آخرشم توی github.com یه حساب بساز.','First install Git from git-scm.com. Then tell it your name and email in the terminal so every change is signed. Finally create an account on github.com.'],c:'git config --global user.name "Your Name"\ngit config --global user.email "you@mail.com"'}),
 ()=>({t:['سه منطقه‌ی گیت','The three areas'],
  d:`${gb(P(['پوشه کار','Working folder']),P(['فایل‌هات','your files']),'')}${ga('add')}${gb(P(['صحنه','Staging']),P(['آماده‌ی ثبت','ready to save']),'cy')}${ga('commit')}${gb(P(['مخزن','Repository']),P(['تاریخچه','history']),'gr')}`,
  x:['فایل‌هات اول توی «پوشه‌ی کار» هستن. با add اونایی که میخوای ذخیره بشن رو میاری توی «صحنه». با commit همه‌شون رو توی «مخزن» ثبت می‌کنی؛ یعنی یه نقطه‌ی ذخیره ساختی!','Your files start in the working folder. With add you move the ones you want into staging. With commit you record them all in the repository, a new save point!'],c:'git init\ngit add .\ngit commit -m "first commit"'}),
 ()=>({t:['کامیت‌ها و تاریخچه','Commits & history'],
  d:`<div class="gtl" style="grid-template-columns:repeat(9,28px)">${['','','','','','','','',''].map((_,k)=>k%2===0?`<div class="gd ${k===8?'h':''}"></div>`:'<div class="gl"></div>').join('')}</div><div class="legend"><b style="background:#ffd24a">commit</b><b style="background:#ff6ec7">HEAD</b></div>`,
  x:['هر کامیت یه نقطه‌ی ذخیره با یه پیامه. HEAD یعنی «الان کجایی». هر وقت بخوای میتونی تاریخچه رو ببینی یا به نقطه‌ی قبلی برگردی.','Each commit is a save point with a message. HEAD means “where you are now”. You can view the history or go back to an earlier save point any time.'],c:'git status\ngit log --oneline'}),
 ()=>({t:['شاخه‌ها (branch)','Branches'],
  d:`<div><div class="gtl"><div class="gd"></div><div class="gd"></div><div class="gl"></div><div class="gl"></div><div class="gl"></div><div class="gd"></div><div class="gd h"></div>
   <div></div><div class="gt">↘</div><div class="gd f"></div><div class="gd f"></div><div class="gd f"></div><div class="gt">↗</div><div></div></div>
   <div class="legend"><b style="background:#ffd24a">main</b><b style="background:#4de1ff">feature</b></div></div>`,
  x:['شاخه یعنی یه مسیر موازی. می‌تونی توی یه شاخه‌ی جدا ویژگی جدید رو امتحان کنی بدون این‌که main خراب بشه. وقتی راضی بودی با merge برش می‌گردونی به main.','A branch is a parallel path. Try a new feature on a separate branch without breaking main. When you are happy, bring it back with merge.'],c:'git branch feature\ngit switch feature\ngit switch main\ngit merge feature'}),
 ()=>({t:['ارسال به گیت‌هاب','Push & pull'],
  d:`${gb('Git',P(['کامپیوتر تو','your PC']),'cy',icon('monitor',5))}<div class="gstack">${ga('push')}${ga('pull',true)}</div>${gb('GitHub',P(['مخزن آنلاین','online repo']),'pk',icon('cloud',5))}`,
  x:['با push کامیت‌هات رو می‌فرستی به گیت‌هاب و با pull آخرین تغییرات رو از اونجا میاری پایین. «origin» اسم آدرس مخزن آنلاینه.','push sends your commits up to GitHub and pull brings the latest changes down. “origin” is the name of the online repository address.'],c:'git remote add origin https://github.com/you/repo.git\ngit push -u origin main\ngit pull'}),
 ()=>({t:['ساخت مخزن و clone','New repo & clone'],

 ()=>({t:['فورک و پول‌ریکوئست','Fork & Pull Request'],
  d:`<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center">${[['Fork',P(['کپی برای خودت','your copy']),'pk'],['Clone',P(['دانلود','download']),'cy'],['Branch',P(['شاخه‌ی جدید','new branch']),''],['Push',P(['ارسال','upload']),'cy'],['Pull Request',P(['درخواست ادغام','ask to merge']),'gr'],['Merge',P(['تأیید','approved']),'']].map((s,k,a)=>gb(`${k+1}. ${s[0]}`,s[1],s[2])+(k<a.length-1&&k!==2?ga():'')).join('')}</div>`,
  x:['برای کمک به پروژه‌ی دیگران: اول Fork می‌کنی (کپی برای خودت)، تغییرت رو توی یه شاخه می‌سازی و push می‌کنی، بعد Pull Request میزنی تا صاحب پروژه تغییرت رو بررسی و ادغام کنه.','To contribute to someone else’s project: Fork it (your own copy), make your change on a branch and push, then open a Pull Request so the owner can review and merge it.'],c:'git switch -c my-fix\ngit add .\ngit commit -m "Fix typo"\ngit push origin my-fix'})
];
function gitScreen(n){
  SFX.setMode('menu');
  const s=GIT[n]();
  setScreen(`<div class="bar"><button class="pb" id="bk">⬅ ${T('back')}</button><div class="ttl ${FA()?'':'mono'}">${T('git')}</div><div class="sp"></div></div>
   <div class="gslide"><div class="center" style="margin-bottom:6px"><span class="numb">${n+1}/${GIT.length}</span></div>
    <div class="gtxt ${FA()?'rtl':'ltr'}"><h4>${P(s.t)}</h4></div>
    <div class="gdiag">${s.d}</div>
    <div class="gtxt ${FA()?'rtl':'ltr'}">${P(s.x)}</div>
    <div class="gcmd">$ ${esc(s.c).replace(/\n/g,'\n$ ')}</div></div>
   <div class="botbtns"><button class="pb ${n===0?'dis':''}" id="gp">⬅ ${T('prev')}</button><button class="pb ${n===GIT.length-1?'dis':'gr'}" id="gn">${T('next')} ➡</button></div>`,'solid',false,menuScreen);
  $('#bk').onclick=menuScreen;
  $('#gp').onclick=()=>gitScreen(n-1);$('#gn').onclick=()=>gitScreen(n+1);
}

menuScreen();
</script></body></html>
