 q:{p:['کلاس Dragon بساز که name و hp بگیره و متد roar داشته باشه که "RAWR" برگردونه. new Dragon("Smaug", 500) رو بساز و roar() و بعد hp رو چاپ کن.','Create a Dragon class taking name and hp with a roar method returning "RAWR". Make new Dragon("Smaug", 500) and print roar() then hp.'],st:'',
    ok:(c,o)=>o.trim()==='RAWR\n500'&&/\bclass\s+Dragon\b/.test(c)&&/constructor/.test(c),h:["class Dragon {\n  constructor(name, hp) {\n    this.name = name;\n    this.hp = hp;\n  }\n  roar() {\n    return 'RAWR';\n  }\n}\nconst d = new Dragon('Smaug', 500);\nconsole.log(d.roar());\nconsole.log(d.hp);","class Dragon {\n  constructor(name, hp) {\n    this.name = name;\n    this.hp = hp;\n  }\n  roar() {\n    return 'RAWR';\n  }\n}\nconst d = new Dragon('Smaug', 500);\nconsole.log(d.roar());\nconsole.log(d.hp);"],sol:"class Dragon {\n  constructor(name, hp) {\n    this.name = name;\n    this.hp = hp;\n  }\n  roar() {\n    return 'RAWR';\n  }\n}\nconst d = new Dragon('Smaug', 500);\nconsole.log(d.roar());\nconsole.log(d.hp);"}},
/* 22 */
{t:['ارث‌بری و فیلد خصوصی','Inheritance & private fields'],
 s:[['با extends یه کلاس از کلاس دیگه ارث می‌بره. توی constructor فرزند باید اول super(...) رو صدا بزنی. با super.متد() می‌تونی متد پدر رو صدا بزنی.\nفیلدی که با # شروع بشه خصوصیه و از بیرون کلاس قابل دسترسی نیست.',
   'extends makes a class inherit from another. In the child constructor you must call super(...) first. With super.method() you call the parent’s method.\nA field that starts with # is private and cannot be reached from outside the class.',
   `class Hero {\n  constructor(name) { this.name = name; }\n  describe() { return 'I am ' + this.name; }\n}\nclass Mage extends Hero {\n  constructor(name, mana) {\n    super(name);\n    this.mana = mana;\n  }\n  describe() {\n    return super.describe() + ' with ' + this.mana + ' mana';\n  }\n}\nconst m = new Mage('Merlin', 80);\nconsole.log(m.describe());\nconsole.log(m instanceof Hero);`]],
 e:[{c:`class Vault {\n  #gold = 100;\n  take(n) {\n    if (n > this.#gold) return 'not enough';\n    this.#gold -= n;\n    return this.#gold;\n  }\n}\nconst v = new Vault();\nconsole.log(v.take(30));\nconsole.log(v.take(500));\nconsole.log(v.gold);`,n:['#gold فقط داخل کلاس دیده میشه؛ بیرون undefined میگیریم.','#gold is only visible inside the class; outside we get undefined.']},
    {c:`class Animal {\n  speak() { return '...'; }\n}\nclass Dog extends Animal {\n  speak() { return 'Woof'; }\n}\nclass Cat extends Animal {\n  speak() { return 'Meow'; }\n}\nfor (const a of [new Dog(), new Cat(), new Animal()]) {\n  console.log(a.speak());\n}`,n:['هر کلاس متد speak رو به شکل خودش پیاده کرده (چندریختی).','Each class implements speak its own way (polymorphism).']}],
 q:{p:['کلاس Hero با متد describe آماده‌ست. کلاس Knight رو از Hero بساز و describe رو طوری عوض کن که بعد از جمله‌ی پدر " (Knight)" اضافه بشه. new Knight("Arthur").describe() رو چاپ کن.','The Hero class with a describe method is ready. Create Knight extending Hero and override describe so " (Knight)" is added after the parent’s sentence. Print new Knight("Arthur").describe().'],
    st:"class Hero {\n  constructor(name) { this.name = name; }\n  describe() { return 'I am ' + this.name; }\n}\n",
    ok:(c,o)=>o.trim()==='I am Arthur (Knight)'&&/class\s+Knight\s+extends\s+Hero/.test(c)&&/super\.describe\(\)/.test(c),h:["class Knight extends Hero {\n  describe() {\n    return super.describe() + ' (Knight)';\n  }\n}","class Knight extends Hero {\n  describe() {\n    return super.describe() + ' (Knight)';\n  }\n}"],sol:"class Hero {\n  constructor(name) { this.name = name; }\n  describe() { return 'I am ' + this.name; }\n}\nclass Knight extends Hero {\n  describe() {\n    return super.describe() + ' (Knight)';\n  }\n}\nconsole.log(new Knight('Arthur').describe());"}},
/* 23 */
{t:['مدیریت خطا','Error handling'],
 s:[['اگه یه خطا اتفاق بیفته برنامه می‌ایسته. با try کد خطرناک رو امتحان می‌کنیم، با catch خطا رو می‌گیریم و finally همیشه اجرا میشه.\nبا throw new Error("پیام") خودمون خطا می‌سازیم. خطا ویژگی‌های name و message داره. می‌تونی با extends Error خطای مخصوص خودت رو بسازی.',
   'When an error happens the program stops. With try we attempt risky code, with catch we handle the error and finally always runs.\nWith throw new Error("message") we raise our own error. An error has name and message. You can make your own error type with extends Error.',
   `try {\n  JSON.parse('{bad');\n} catch (e) {\n  console.log(e.name);\n} finally {\n  console.log('finished');\n}\ntry {\n  null.x;\n} catch (e) {\n  console.log(e instanceof TypeError);\n}\ntry {\n  throw new Error('Dragon!');\n} catch (e) {\n  console.log(e.message);\n}`]],
 e:[{c:`function check(age) {\n  if (age < 18) throw new Error('too young');\n  return 'welcome';\n}\nfor (const a of [20, 10]) {\n  try {\n    console.log(check(a));\n  } catch (e) {\n    console.log('Denied: ' + e.message);\n  }\n}`,n:['throw اجرای تابع رو قطع می‌کنه و کنترل میره به catch.','throw stops the function and control jumps to catch.']},
    {c:`class QuestError extends Error {\n  constructor(msg, code) {\n    super(msg);\n    this.name = 'QuestError';\n    this.code = code;\n  }\n}\ntry {\n  throw new QuestError('Too strong', 42);\n} catch (e) {\n  console.log(e.name, e.message, e.code, e instanceof Error);\n}`,n:['خطای سفارشی می‌تونه اطلاعات اضافه (code) هم داشته باشه.','A custom error can carry extra info (code).']}],
 q:{p:['تابع divide(a, b) بنویس که اگه b صفر بود Error با پیام Cannot divide by zero بسازه. با divide(5, 0) صدا بزن و توی catch فقط پیام خطا رو چاپ کن.','Write divide(a, b) that throws an Error with the message Cannot divide by zero when b is 0. Call divide(5, 0) and in catch print only the error message.'],st:'',
    ok:(c,o)=>o.trim()==='Cannot divide by zero'&&/\bthrow\b/.test(c)&&/\bcatch\b/.test(c),h:["function divide(a, b) {\n  if (b === 0) throw new Error('Cannot divide by zero');\n  return a / b;\n}\ntry {\n  divide(5, 0);\n} catch (e) {\n  console.log(e.message);\n}","function divide(a, b) {\n  if (b === 0) throw new Error('Cannot divide by zero');\n  return a / b;\n}\ntry {\n  divide(5, 0);\n} catch (e) {\n  console.log(e.message);\n}"],sol:"function divide(a, b) {\n  if (b === 0) throw new Error('Cannot divide by zero');\n  return a / b;\n}\ntry {\n  divide(5, 0);\n} catch (e) {\n  console.log(e.message);\n}"}},
/* 24 */
{t:['JSON','JSON'],
 s:[['JSON یه فرمت متنی برای ذخیره و ارسال داده‌ست.\nJSON.stringify(شیء) آبجکت رو به متن تبدیل می‌کنه (با آرگومان سوم می‌تونی قشنگ‌ش کنی).\nJSON.parse(متن) متن رو دوباره به آبجکت برمی‌گردونه.\nتوابع و undefined توی JSON ذخیره نمیشن.',
   'JSON is a text format for storing and sending data.\nJSON.stringify(value) turns an object into text (a third argument makes it pretty).\nJSON.parse(text) turns text back into an object.\nFunctions and undefined are not stored in JSON.',
   `const hero = { name: 'Arthur', items: ['bow'], stats: { hp: 5 } };\nconst text = JSON.stringify(hero);\nconsole.log(text);\nconsole.log(JSON.stringify(hero, null, 2));\nconst back = JSON.parse(text);\nconsole.log(back.items[0]);`]],
 e:[{c:`const data = { a: 1, f() {}, u: undefined, d: new Date(0) };\nconsole.log(JSON.stringify(data));`,n:['تابع و undefined حذف میشن و تاریخ به متن تبدیل میشه.','Functions and undefined are dropped and the date becomes text.']},
    {c:`const copy = JSON.parse(JSON.stringify({ list: [1, 2] }));\ncopy.list.push(3);\nconsole.log(copy);\nconsole.log(JSON.parse('[1,2,3]').length);`,n:['stringify + parse یه کپی عمیق (deep copy) می‌سازه.','stringify + parse makes a deep copy.']}],
 q:{p:['متن raw یه JSON هست. با JSON.parse بازش کن و به شکل «Lia has 42 HP» چاپ کن.','raw is JSON text. Parse it with JSON.parse and print it like “Lia has 42 HP”.'],st:"const raw = '{\"name\":\"Lia\",\"hp\":42}';\n",
    ok:(c,o)=>o.trim()==='Lia has 42 HP'&&/JSON\.parse/.test(c),h:["const p = JSON.parse(raw);\nconsole.log(p.name + ' has ' + p.hp + ' HP');","const p = JSON.parse(raw);\nconsole.log(p.name + ' has ' + p.hp + ' HP');"],sol:"const raw = '{\"name\":\"Lia\",\"hp\":42}';\nconst p = JSON.parse(raw);\nconsole.log(p.name + ' has ' + p.hp + ' HP');"}},
/* 25 */
{t:['عبارت‌های باقاعده (Regex)','Regular expressions'],
 s:[['Regex یه الگو برای جستجوی متنه، بین دو اسلش: /الگو/\n\\d یعنی رقم ، \\w حرف/رقم ، \\s فاصله ، + یعنی «یک یا بیشتر» ، {3} یعنی «دقیقاً ۳ تا»\nپرچم g یعنی «همه‌ی نتیجه‌ها».\nمتدها: test (آیا هست؟) ، match (پیدا کن) ، replace (عوض کن) ، exec (گروه‌ها).',
   'A regex is a pattern for searching text, written between slashes: /pattern/\n\\d is a digit, \\w a letter/digit, \\s a space, + means “one or more”, {3} means “exactly 3”\nThe g flag means “all results”.\nMethods: test (is it there?), match (find), replace (swap), exec (groups).',
   `const text = 'Call 555-1234 or 555-9876';\nconsole.log(/\\d{3}-\\d{4}/.test(text));\nconsole.log(text.match(/\\d{3}-\\d{4}/g));\nconsole.log(text.replace(/\\d/g, '#'));\nconst m = /(\\w+)@(\\w+)\\.com/.exec('hi arthur@castle.com');\nconsole.log(m[1], m[2]);`]],
 e:[{c:`const isEmail = s => /^[^\\s@]+@[^\\s@]+\\.[a-z]+$/.test(s);\nconsole.log(isEmail('a@b.com'), isEmail('nope'));`,n:['^ و $ یعنی کل متن باید با الگو جور باشه.','^ and $ mean the whole text must match the pattern.']},
    {c:`const log = 'HP:50 MP:20 XP:130';\nconsole.log(log.match(/\\d+/g).map(Number));\nconsole.log('a1b22c'.split(/\\d+/));`,n:['می‌شه با regex متن رو هم تکه‌تکه کرد.','Regex can also split text.']}],
 q:{p:['از متن log همه‌ی عددها رو با regex پیدا کن و آرایه‌شون رو چاپ کن.','Find all the numbers in the text log with a regex and print the array of them.'],st:"const log = 'HP:50 MP:20 XP:130';\n",
    ok:(c,o)=>o.trim()==="[ '50', '20', '130' ]"&&/\/[^/\n]*\\d[^/\n]*\/g/.test(c),h:['console.log(log.match(/\\d+/g));','console.log(log.match(/\\d+/g));'],sol:"const log = 'HP:50 MP:20 XP:130';\nconsole.log(log.match(/\\d+/g));"}},
/* 26 */
{t:['Promise','Promises'],
 s:[['Promise یعنی «قول یه نتیجه توی آینده». سه حالت داره: در انتظار، موفق (resolve) و ناموفق (reject).\nبا .then نتیجه‌ی موفق رو می‌گیریم، با .catch خطا رو و با Promise.all چند تا Promise رو با هم منتظر می‌مونیم.\nکد بعد از Promise بدون صبر ادامه پیدا می‌کنه.',
   'A Promise is “a promise of a result in the future”. It is pending, fulfilled (resolve) or rejected (reject).\nWith .then we get the success result, with .catch the error, and with Promise.all we wait for several together.\nThe code after a Promise carries on without waiting.',
   `const wait = (ms, v) => new Promise(res => setTimeout(() => res(v), ms));\nwait(100, 'potion ready').then(v => console.log(v));\nconsole.log('brewing...');\nPromise.all([wait(30, 'a'), wait(10, 'b')]).then(r => console.log(r));\nPromise.reject(new Error('spell failed')).catch(e => console.log(e.message));`]],
 e:[{c:`const check = n => new Promise((res, rej) => {\n  if (n > 0) res('ok ' + n);\n  else rej(new Error('bad ' + n));\n});\ncheck(1).then(console.log);\ncheck(-1).catch(e => console.log(e.message));`,n:['resolve یعنی موفق، reject یعنی شکست.','resolve means success, reject means failure.']},
    {c:`const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));\nwait(50, 'slow').then(console.log);\nwait(10, 'fast').then(console.log);\nPromise.race([wait(30, 'A'), wait(20, 'B')]).then(w => console.log('winner', w));`,n:['هرکی زودتر تموم بشه زودتر چاپ میشه؛ race اولین نتیجه رو برمی‌گردونه.','Whoever finishes first prints first; race returns the first result.']}],
 q:{p:['یه Promise بساز که بعد از ۵۰ میلی‌ثانیه با مقدار "Ready" موفق بشه و با then مقدارش رو چاپ کن.','Create a Promise that resolves with "Ready" after 50 milliseconds and print its value with then.'],st:'',
    ok:(c,o)=>o.trim()==='Ready'&&/new Promise/.test(c)&&/\.then\(/.test(c),h:["new Promise(res => setTimeout(() => res('Ready'), 50))\n  .then(v => console.log(v));","new Promise(res => setTimeout(() => res('Ready'), 50))\n  .then(v => console.log(v));"],sol:"new Promise(res => setTimeout(() => res('Ready'), 50))\n  .then(v => console.log(v));"}},
/* 27 */
{t:['async و await','async & await'],
 s:[['async قبل از تابع باعث میشه همیشه یه Promise برگردونه، و داخلش می‌تونیم با await «صبر کنیم» تا یه Promise تموم بشه؛ کد مثل کد معمولی از بالا به پایین خونده میشه.\nخطاها رو با try/catch می‌گیریم. برای کارهای هم‌زمان، await Promise.all([...]) رو بذار.',
   'async before a function makes it always return a Promise, and inside it we can await a Promise to finish; the code reads top to bottom like normal code.\nCatch errors with try/catch. For parallel jobs use await Promise.all([...]).',
   `const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));\nasync function quest() {\n  console.log('start');\n  const a = await wait(100, 'forest');\n  console.log('reached', a);\n  return 'done';\n}\nquest().then(console.log);\nconsole.log('hero is walking');`]],
 e:[{c:`const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));\nasync function main() {\n  try {\n    await Promise.reject(new Error('trap!'));\n  } catch (e) {\n    console.log('caught', e.message);\n  } finally {\n    console.log('cleanup');\n  }\n  const [x, y] = await Promise.all([wait(30, 'x'), wait(10, 'y')]);\n  console.log(x, y);\n}\nmain();`,n:['Promise.all هر دو کار رو هم‌زمان انجام میده، پس کل زمان ≈ کندترین کاره.','Promise.all runs both at once so the total time ≈ the slowest job.']},
    {c:`const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));\nasync function run() {\n  for (const name of ['A', 'B', 'C']) {\n    await wait(10);\n    console.log('step', name);\n  }\n}\nrun().then(() => console.log('end'));`,n:['await داخل حلقه کارها رو یکی‌یکی (پشت هم) انجام میده.','await inside a loop runs the steps one after another.']}],
 q:{p:['یه تابع async بنویس که بعد از ۲۰ms «A» و بعد از ۲۰ms دیگه «B» رو (هرکدوم توی یه خط) چاپ کنه. با await از wait استفاده کن و تابع رو صدا بزن.','Write an async function that prints “A” after 20ms and “B” after another 20ms (each on its own line). Use await with wait and call the function.'],st:'const wait = ms => new Promise(r => setTimeout(r, ms));\n',
    ok:(c,o)=>o.trim()==='A\nB'&&/\basync\b/.test(c)&&/\bawait\b/.test(c),h:["async function go() {\n  await wait(20);\n  console.log('A');\n  await wait(20);\n  console.log('B');\n}\ngo();","async function go() {\n  await wait(20);\n  console.log('A');\n  await wait(20);\n  console.log('B');\n}\ngo();"],sol:"const wait = ms => new Promise(r => setTimeout(r, ms));\nasync function go() {\n  await wait(20);\n  console.log('A');\n  await wait(20);\n  console.log('B');\n}\ngo();"}},
/* 28 */
{t:['Iterator و Generator','Iterators & generators'],
 s:[['تابع مولد (generator) با function* ساخته میشه و با yield مقدارها رو یکی‌یکی تحویل میده و هر بار مکث می‌کنه.\nهر چیزی که توی for...of یا spread (...) کار کنه «iterable» هست. می‌تونی با [Symbol.iterator] آبجکت خودت رو iterable کنی.',
   'A generator function is made with function* and hands out values one at a time with yield, pausing each time.\nAnything that works in for...of or spread (...) is “iterable”. You can make your own object iterable with [Symbol.iterator].',
   `function* gen() {\n  yield 1;\n  yield 2;\n  return 3;\n}\nconsole.log([...gen()]);\nconst it = gen();\nconsole.log(it.next(), it.next(), it.next());\nfunction* naturals() {\n  let n = 1;\n  while (true) yield n++;\n}\nfor (const n of naturals()) {\n  if (n > 3) break;\n  console.log(n);\n}`]],
 e:[{c:`const team = {\n  members: ['Lia', 'Ragnar'],\n  [Symbol.iterator]() {\n    let i = 0;\n    const list = this.members;\n    return { next: () => i < list.length ? { value: list[i++], done: false } : { value: undefined, done: true } };\n  }\n};\nconsole.log([...team]);\nfor (const m of team) console.log(m);`,n:['iterator باید آبجکتی با متد next باشه که {value, done} برمی‌گردونه.','An iterator is an object with a next method returning {value, done}.']},
    {c:`function* take(n, iter) {\n  let i = 0;\n  for (const v of iter) {\n    if (i++ >= n) return;\n    yield v;\n  }\n}\nfunction* evens() {\n  let n = 0;\n  while (true) { yield n; n += 2; }\n}\nconsole.log([...take(4, evens())]);`,n:['ژنراتور بی‌نهایت امنه چون فقط وقتی لازمه مقدار می‌سازه.','An endless generator is safe because it only makes values when needed.']}],
 q:{p:['ژنراتور range(a, b) بنویس که عددها از a تا b (شامل b) رو yield کنه. [...range(1, 5)] رو چاپ کن.','Write a generator range(a, b) that yields the numbers from a up to b (including b). Print [...range(1, 5)].'],st:'',
    ok:(c,o)=>o.trim()==='[ 1, 2, 3, 4, 5 ]'&&/function\s*\*/.test(c)&&/\byield\b/.test(c),h:['function* range(a, b) {\n  for (let i = a; i <= b; i++) yield i;\n}\nconsole.log([...range(1, 5)]);','function* range(a, b) {\n  for (let i = a; i <= b; i++) yield i;\n}\nconsole.log([...range(1, 5)]);'],sol:'function* range(a, b) {\n  for (let i = a; i <= b; i++) yield i;\n}\nconsole.log([...range(1, 5)]);'}}
);

/* ================= ADVANCED HTML / CSS / DOM (lessons 16-28) ================= */
LESSONS.html.push(
/* 16 */
{t:['تگ‌های معنایی (Semantic)','Semantic tags'],
 s:[['به‌جای همه‌چیز رو div گذاشتن، تگ‌هایی هست که «معنی» دارن و هم برای آدم‌ها هم موتورهای جستجو و ابزارهای کمکی (مثل صفحه‌خوان) مفیدن:\nheader بالای صفحه ، nav منوی لینک‌ها ، main محتوای اصلی ، section بخش‌ها ، article یه مطلب مستقل ، aside کنارنوشت ، footer پایین صفحه.',
   'Instead of using div for everything there are tags with meaning, useful for people, search engines and assistive tools like screen readers:\nheader top of the page, nav the link menu, main the main content, section parts, article a standalone piece, aside a side note, footer the bottom.',
   `<header>\n  <h1>Code Kingdom</h1>\n  <nav><a href="#">Home</a> | <a href="#">Quests</a></nav>\n</header>\n<main>\n  <section>\n    <h2>Today</h2>\n    <article><p>A dragon was seen!</p></article>\n  </section>\n  <aside>Tip: carry a shield</aside>\n</main>\n<footer>Made by Hirkan</footer>`]],
 e:[{c:`<article>\n  <h2>Hero news</h2>\n  <p>Arthur reached level 5.</p>\n</article>\n<article>\n  <h2>Shop news</h2>\n  <p>Potions are on sale.</p>\n</article>`,n:['هر article یه مطلب مستقله که به‌تنهایی هم معنی داره.','Each article is a standalone piece that makes sense on its own.']},
    {c:`<style>\n  header { background: #2a1850; color: white; padding: 8px; }\n  footer { background: #ddd; padding: 6px; font-size: 12px; }\n</style>\n<header>Top</header>\n<main>Middle</main>\n<footer>Bottom</footer>`,n:['می‌تونی مستقیم به تگ‌های معنایی استایل بدی.','You can style the semantic tags directly.']}],
 q:{p:['یه صفحه با header (یه تیتر h1 توش)، main (یه پاراگراف توش) و footer بساز.','Build a page with a header (containing an h1), a main (containing a paragraph) and a footer.'],st:'',
    ok:(c,o,d)=>/<header[\s>][\s\S]*<h1[\s>][\s\S]*<\/header>/i.test(c)&&/<main[\s>][\s\S]*<p[\s>][\s\S]*<\/main>/i.test(c)&&/<footer[\s>]/i.test(c),h:['<header><h1>...</h1></header>\n<main><p>...</p></main>\n<footer>...</footer>','<header><h1>...</h1></header>\n<main><p>...</p></main>\n<footer>...</footer>'],sol:'<header>\n  <h1>My Kingdom</h1>\n</header>\n<main>\n  <p>Welcome, hero!</p>\n</main>\n<footer>Bye</footer>'}},
/* 17 */
{t:['فرم‌ها: انتخاب و برچسب','Forms: choices & labels'],
 s:[['برای هر ورودی یه label بذار و با for به id ورودی وصلش کن؛ با کلیک روی برچسب هم ورودی فعال میشه و برای دسترسی‌پذیری عالیه.\nانواع ورودی: select + option (کشویی) ، textarea (متن چندخطی) ، input type="radio" (یکی از چند تا؛ با name مشترک) ، input type="checkbox" (چندتایی).',
   'Give every input a label and connect it with for to the input’s id; clicking the label focuses the input, which is great for accessibility.\nKinds of inputs: select + option (dropdown), textarea (multi-line text), input type="radio" (one of many; share a name), input type="checkbox" (several).',
   `<form>\n  <label for="nm">Name</label>\n  <input id="nm" type="text"><br>\n  <label for="cls">Class</label>\n  <select id="cls">\n    <option>Knight</option>\n    <option>Mage</option>\n  </select><br>\n  <input type="radio" name="side" id="g"><label for="g">Good</label>\n  <input type="radio" name="side" id="e"><label for="e">Evil</label><br>\n  <input type="checkbox" id="s"><label for="s">Sound on</label><br>\n  <textarea rows="2" cols="20">Your story...</textarea>\n</form>`]],
 e:[{c:`<label for="hp">HP</label>\n<input id="hp" type="number" value="100">`,n:['کلیک روی کلمه‌ی HP، کادر عدد رو انتخاب می‌کنه.','Clicking the word HP focuses the number box.']},
    {c:`<p>Pick a weapon:</p>\n<input type="radio" name="w" id="sw" checked><label for="sw">Sword</label>\n<input type="radio" name="w" id="bw"><label for="bw">Bow</label>`,n:['رادیوها با name مشترک فقط یکی‌شون انتخاب میشه.','Radios with the same name allow only one choice.']}],
 q:{p:['یه فرم بساز که یه label با for به یه input با همون id وصل باشه و یه select با حداقل دو option داشته باشه.','Build a form with a label linked by for to an input with the matching id, plus a select with at least two options.'],st:'',
    ok:(c,o,d)=>{const m=/<label[^>]*\bfor\s*=\s*"([^"]+)"/i.exec(c);return !!m&&new RegExp('<input[^>]*\\bid\\s*=\\s*"'+m[1]+'"','i').test(c)&&/<select[\s>]/i.test(c)&&(c.match(/<option[\s>]/gi)||[]).length>=2},h:['<label for="n">Name</label>\n<input id="n">\n<select><option>A</option><option>B</option></select>','<label for="n">Name</label>\n<input id="n">\n<select><option>A</option><option>B</option></select>'],sol:'<form>\n  <label for="n">Name</label>\n  <input id="n" type="text">\n  <select>\n    <option>Knight</option>\n    <option>Mage</option>\n  </select>\n</form>'}},
/* 18 */
{t:['اعتبارسنجی فرم','Form validation'],
 s:[['مرورگر خودش می‌تونه ورودی رو چک کنه، بدون هیچ JavaScript ای:\nrequired یعنی پر کردنش اجباریه ، type="email" فرمت ایمیل رو چک می‌کنه ، minlength و maxlength طول متن ، min و max برای عدد ، pattern یه regex ، placeholder یه راهنمای کمرنگ.\nدکمه‌ی submit موقع ارسال این قانون‌ها رو بررسی می‌کنه.',
   'The browser can validate input itself, with no JavaScript:\nrequired makes it mandatory, type="email" checks the email format, minlength and maxlength limit text length, min and max limit numbers, pattern takes a regex, placeholder shows a faint hint.\nThe submit button checks these rules when sending.',
   `<form>\n  <input type="text" placeholder="Hero name" required minlength="3"><br>\n  <input type="email" placeholder="Email" required><br>\n  <input type="number" min="1" max="99" value="5"><br>\n  <input type="text" pattern="[A-Z]{3}" placeholder="3 capital letters"><br>\n  <button type="submit">Join</button>\n</form>`]],
 e:[{c:`<form>\n  <input type="password" minlength="6" required placeholder="Password (6+)">\n  <button>Go</button>\n</form>`,n:['اگه کمتر از ۶ حرف بزنی و دکمه رو بزنی مرورگر ارسال رو متوقف می‌کنه.','If you type fewer than 6 characters and press the button the browser stops the submit.']},
    {c:`<style>\n  input:invalid { border: 2px solid red; }\n  input:valid { border: 2px solid green; }\n</style>\n<input type="email" required placeholder="you@mail.com">`,n:[':valid و :invalid به CSS اجازه میدن ظاهر رو بر اساس درستی ورودی عوض کنه.',':valid and :invalid let CSS change the look based on whether the input is correct.']}],
 q:{p:['یه فرم با یه input از نوع email که required باشه، یه input از نوع number با min و max و یه دکمه‌ی ارسال بساز.','Build a form with an email input that is required, a number input with min and max, and a submit button.'],st:'',
    ok:(c,o,d)=>/<input[^>]*type\s*=\s*"email"[^>]*\brequired\b|<input[^>]*\brequired\b[^>]*type\s*=\s*"email"/i.test(c)&&/<input[^>]*type\s*=\s*"number"[^>]*\bmin\s*=[^>]*\bmax\s*=|<input[^>]*type\s*=\s*"number"[^>]*\bmax\s*=[^>]*\bmin\s*=/i.test(c)&&/<button|type\s*=\s*"submit"/i.test(c),h:['<input type="email" required>\n<input type="number" min="1" max="10">\n<button>Send</button>','<input type="email" required>\n<input type="number" min="1" max="10">\n<button>Send</button>'],sol:'<form>\n  <input type="email" required placeholder="Email">\n  <input type="number" min="1" max="10" value="1">\n  <button type="submit">Send</button>\n</form>'}},
/* 19 */
{t:['انتخابگرهای قدرتمند CSS','Powerful CSS selectors'],
 s:[['چند انتخابگر پیشرفته:\n• فرزند مستقیم: ul > li\n• نوه و پایین‌تر (فاصله): nav a\n• چند تا با هم (کاما): h1, h2\n• نقش‌ها: li:first-child ، li:nth-child(odd) ، li:last-child\n• ویژگی: input[type="text"]\nهرچی انتخابگر دقیق‌تر باشه «اولویت» بیشتری داره: id > کلاس > تگ.',
   'Some advanced selectors:\n• direct child: ul > li\n• descendant (space): nav a\n• several at once (comma): h1, h2\n• positions: li:first-child, li:nth-child(odd), li:last-child\n• attribute: input[type="text"]\nThe more specific a selector, the higher its priority: id > class > tag.',
   `<style>\n  li:nth-child(odd) { background: #ffe9a8; }\n  li:first-child { font-weight: bold; }\n  nav a { color: purple; }\n  h1, h2 { color: teal; }\n  input[type="text"] { border: 2px solid orange; }\n</style>\n<h1>Title</h1><h2>Sub</h2>\n<nav><a href="#">Home</a></nav>\n<ul><li>One</li><li>Two</li><li>Three</li></ul>\n<input type="text" placeholder="name">`]],
 e:[{c:`<style>\n  ul > li { list-style: square; }\n  li:last-child { color: crimson; }\n</style>\n<ul>\n  <li>sword</li>\n  <li>shield</li>\n  <li>potion</li>\n</ul>`,n:['آخرین li قرمز میشه.','The last li turns red.']},
    {c:`<style>\n  p { color: gray; }\n  .warn { color: orange; }\n  #boss { color: red; }\n</style>\n<p>plain</p>\n<p class="warn">warning</p>\n<p class="warn" id="boss">boss (id wins)</p>`,n:['id از کلاس قوی‌تره و کلاس از تگ؛ پس آخری قرمز میشه.','An id beats a class and a class beats a tag, so the last one is red.']}],
 q:{p:['یه لیست ul با ۴ تا li بساز و با li:nth-child(even) فقط ردیف‌های زوج رو رنگی کن (background).','Build a ul with 4 li items and use li:nth-child(even) to give only the even rows a background color.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>/li\s*:\s*nth-child\(\s*even\s*\)\s*\{[^}]*background/i.test(c)&&(c.match(/<li[\s>]/gi)||[]).length>=4,h:['li:nth-child(even) { background: #ffe9a8; }','li:nth-child(even) { background: #ffe9a8; }'],sol:'<style>\n  li:nth-child(even) { background: #ffe9a8; }\n</style>\n<ul>\n  <li>1</li>\n  <li>2</li>\n  <li>3</li>\n  <li>4</li>\n</ul>'}},
/* 20 */
{t:['واحدها و اندازه‌ها','Units & sizing'],
 s:[['واحدهای CSS:\n• px پیکسل ثابت\n• % درصدی از پدر\n• rem نسبت به اندازه‌ی فونت اصلی صفحه (۱rem معمولا ۱۶px)\n• vw و vh درصدی از عرض و ارتفاع پنجره\nبا calc() می‌تونی حساب کنی: calc(100% - 20px).\nbox-sizing: border-box باعث میشه padding و border توی width حساب بشن و چیدمان راحت‌تر بشه.',
   'CSS units:\n• px fixed pixels\n• % a percent of the parent\n• rem relative to the page’s base font size (1rem is usually 16px)\n• vw and vh a percent of the window width and height\ncalc() lets you do math: calc(100% - 20px).\nbox-sizing: border-box counts padding and border inside the width, which makes layouts easier.',
   `<style>\n  * { box-sizing: border-box; }\n  .wrap { width: 80%; background: #eee; padding: 1rem; }\n  .half { width: 50%; background: gold; padding: 10px; }\n  .calc { width: calc(100% - 40px); background: lightgreen; padding: 6px; }\n</style>\n<div class="wrap">\n  <div class="half">50% wide</div>\n  <div class="calc">100% - 40px</div>\n</div>`]],
 e:[{c:`<style>\n  html { font-size: 16px; }\n  h2 { font-size: 2rem; }\n  p { font-size: 0.8rem; }\n</style>\n<h2>Big (2rem)</h2>\n<p>Small (0.8rem)</p>`,n:['rem نسبت به فونت ریشه‌ست؛ با عوض کردنش همه‌چیز با هم تغییر می‌کنه.','rem is relative to the root font; change it and everything scales together.']},
    {c:`<style>\n  .hero { height: 30vh; background: linear-gradient(gold, orange); display: flex; align-items: center; justify-content: center; }\n</style>\n<div class="hero">30vh tall</div>`,n:['vh یعنی درصدی از ارتفاع پنجره.','vh means a percent of the window height.']}],
 q:{p:['یه div با کلاس box بساز که عرضش ۵۰٪ باشه، padding داشته باشه و box-sizing: border-box هم بهش بدی.','Create a div with class box that is 50% wide, has padding and also uses box-sizing: border-box.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>{const m=/\.box\s*\{([^}]*)\}/.exec(c);return /<div[^>]*class\s*=\s*"box"/i.test(c)&&!!m&&/width\s*:\s*50%/.test(m[1])&&/padding/.test(m[1])&&/box-sizing\s*:\s*border-box/.test(c)},h:['.box { width: 50%; padding: 10px; box-sizing: border-box; background: gold; }','.box { width: 50%; padding: 10px; box-sizing: border-box; background: gold; }'],sol:'<style>\n  .box { width: 50%; padding: 10px; box-sizing: border-box; background: gold; }\n</style>\n<div class="box">Half</div>'}},
/* 21 */
{t:['فلکس‌باکس پیشرفته','Flexbox in depth'],
 s:[['چند ویژگی مهم فلکس:\n• justify-content: space-between  (فاصله‌ی مساوی بین بچه‌ها، اولی و آخری کنار لبه)\n• align-items: center  (وسط‌چین عمودی)\n• flex-wrap: wrap  (اگه جا نشد برن خط بعد)\n• flex: 1  روی یه بچه یعنی «همه‌ی جای خالی رو بگیر»\nبا flex-direction هم جهت رو عوض می‌کنی (row یا column).',
   'Important flex properties:\n• justify-content: space-between  (equal space between children, first and last at the edges)\n• align-items: center  (vertical centering)\n• flex-wrap: wrap  (go to the next line when full)\n• flex: 1 on a child means “take all the free space”\nflex-direction changes the direction (row or column).',
   `<style>\n  .bar { display: flex; justify-content: space-between; align-items: center; background: #2a1850; color: white; padding: 10px; }\n  .row { display: flex; gap: 6px; margin-top: 8px; }\n  .row div { background: gold; padding: 8px; }\n  .row .grow { flex: 1; background: orange; }\n</style>\n<div class="bar"><b>Logo</b><span>Menu</span></div>\n<div class="row"><div>A</div><div class="grow">grows</div><div>B</div></div>`]],
 e:[{c:`<style>\n  .tags { display: flex; flex-wrap: wrap; gap: 6px; width: 160px; }\n  .tags span { background: pink; padding: 4px 8px; border-radius: 10px; }\n</style>\n<div class="tags">\n  <span>fire</span><span>ice</span><span>wind</span><span>earth</span><span>light</span>\n</div>`,n:['با wrap، برچسب‌ها وقتی جا نشن میرن خط بعدی.','With wrap, tags move to the next line when they do not fit.']},
    {c:`<style>\n  .center { display: flex; justify-content: center; align-items: center; height: 120px; background: #cde; }\n</style>\n<div class="center"><div>Perfectly centered</div></div>`,n:['دو خط، وسط‌چین کامل افقی و عمودی!','Two lines give perfect horizontal and vertical centering!']}],
 q:{p:['یه div با کلاس nav بساز که یه متن (span) و یه لینک (a) توش باشه؛ با flex و justify-content: space-between اولی رو سمت چپ و دومی رو سمت راست بذار.','Build a div with class nav holding a span and a link (a); use flex and justify-content: space-between to push the first to the left and the second to the right.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>/\.nav\s*\{[^}]*display\s*:\s*flex[^}]*\}/.test(c)&&/\.nav\s*\{[^}]*justify-content\s*:\s*space-between/.test(c)&&/<div[^>]*class\s*=\s*"nav"[^>]*>[\s\S]*<span[\s>][\s\S]*<a[\s>]/i.test(c),h:['.nav { display: flex; justify-content: space-between; }','.nav { display: flex; justify-content: space-between; }'],sol:'<style>\n  .nav { display: flex; justify-content: space-between; background: #eee; padding: 8px; }\n</style>\n<div class="nav">\n  <span>Logo</span>\n  <a href="#">Login</a>\n</div>'}},
/* 22 */
{t:['گرید CSS (Grid)','CSS Grid'],
 s:[['Grid برای چیدمان دوبعدی (ردیف و ستون) عالیه. به جعبه‌ی بیرونی display: grid میدی و ستون‌ها رو تعریف می‌کنی:\ngrid-template-columns: repeat(3, 1fr);  یعنی ۳ ستون هم‌اندازه (fr یعنی «سهم از جای خالی»)\ngap فاصله‌ی بین خونه‌هاست. هر بچه خودش می‌ره توی یه خونه.',
   'Grid is great for two-dimensional layouts (rows and columns). Give the outer box display: grid and define the columns:\ngrid-template-columns: repeat(3, 1fr);  means 3 equal columns (fr = “share of free space”)\ngap is the space between cells. Each child drops into a cell.',
   `<style>\n  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n  .gallery div { background: gold; padding: 18px; text-align: center; border-radius: 8px; }\n</style>\n<div class="gallery">\n  <div>1</div><div>2</div><div>3</div>\n  <div>4</div><div>5</div><div>6</div>\n</div>`]],
 e:[{c:`<style>\n  .layout { display: grid; grid-template-columns: 1fr 2fr; gap: 6px; }\n  .layout div { background: #cde; padding: 14px; }\n</style>\n<div class="layout">\n  <div>side (1fr)</div>\n  <div>main (2fr)</div>\n</div>`,n:['ستون دوم دو برابر ستون اوله.','The second column is twice as wide as the first.']},
    {c:`<style>\n  .page { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\n  .page .wide { grid-column: 1 / 3; background: orange; padding: 10px; }\n  .page div { background: lightgreen; padding: 10px; }\n</style>\n<div class="page">\n  <div class="wide">Header spans both</div>\n  <div>Left</div>\n  <div>Right</div>\n</div>`,n:['grid-column: 1 / 3 یعنی این خونه از خط ۱ تا ۳ (هر دو ستون) رو بگیره.','grid-column: 1 / 3 makes the cell stretch from line 1 to 3 (both columns).']}],
 q:{p:['یه div با کلاس gallery بساز که ۶ تا div توش باشه و با display: grid و repeat(3, 1fr) سه ستونه‌شون کن.','Create a div with class gallery holding 6 divs and make it three columns with display: grid and repeat(3, 1fr).'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>/\.gallery\s*\{[^}]*display\s*:\s*grid/.test(c)&&/grid-template-columns\s*:\s*repeat\(\s*3\s*,\s*1fr\s*\)/.test(c)&&(c.match(/<div[\s>]/gi)||[]).length>=7,h:['.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }','.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }'],sol:'<style>\n  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\n  .gallery div { background: gold; padding: 14px; }\n</style>\n<div class="gallery">\n  <div>1</div><div>2</div><div>3</div>\n  <div>4</div><div>5</div><div>6</div>\n</div>'}},
/* 23 */
{t:['گرادیان، سایه و گوشه‌ی گرد','Gradients, shadows & rounded corners'],
 s:[['چند افکت که ظاهر رو حرفه‌ای می‌کنه:\n• background: linear-gradient(زاویه, رنگ۱, رنگ۲)  ← تغییر تدریجی رنگ\n• box-shadow: x y محو رنگ  ← سایه‌ی جعبه\n• text-shadow ← سایه‌ی متن\n• border-radius ← گوشه‌ی گرد (۵۰٪ یعنی دایره)\n• opacity ← شفافیت (۰ تا ۱)',
   'A few effects that make a page look professional:\n• background: linear-gradient(angle, color1, color2)  ← gradual color change\n• box-shadow: x y blur color  ← a box shadow\n• text-shadow ← a text shadow\n• border-radius ← rounded corners (50% makes a circle)\n• opacity ← transparency (0 to 1)',
   `<style>\n  .card { width: 160px; padding: 16px; color: white; text-align: center;\n    background: linear-gradient(135deg, #7b2ff7, #f107a3);\n    border-radius: 16px; box-shadow: 4px 6px 12px rgba(0,0,0,0.4); }\n  .card h2 { text-shadow: 2px 2px 4px black; }\n  .dot { width: 50px; height: 50px; background: gold; border-radius: 50%; margin-top: 10px; opacity: 0.7; }\n</style>\n<div class="card"><h2>Mage</h2><p>Level 9</p></div>\n<div class="dot"></div>`]],
 e:[{c:`<style>\n  .sky { height: 80px; background: linear-gradient(to bottom, #87ceeb, #fff); }\n</style>\n<div class="sky"></div>`,n:['to bottom یعنی از بالا به پایین.','to bottom means from top to bottom.']},
    {c:`<style>\n  .btn { background: #ffb400; border: 0; padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 0 #b37d00; font-weight: bold; }\n</style>\n<button class="btn">Play</button>`,n:['سایه‌ی بدون محو، حس دکمه‌ی سه‌بعدی میده.','A sharp shadow with no blur gives a 3D button feel.']}],
 q:{p:['یه div با کلاس banner بساز و بهش یه linear-gradient، border-radius و box-shadow بده.','Create a div with class banner and give it a linear-gradient, a border-radius and a box-shadow.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>{const m=/\.banner\s*\{([^}]*)\}/.exec(c);return /<div[^>]*class\s*=\s*"banner"/i.test(c)&&!!m&&/linear-gradient\(/.test(m[1])&&/border-radius/.test(m[1])&&/box-shadow/.test(m[1])},h:['.banner { background: linear-gradient(to right, gold, orange); border-radius: 12px; box-shadow: 2px 4px 8px gray; padding: 16px; }','.banner { background: linear-gradient(to right, gold, orange); border-radius: 12px; box-shadow: 2px 4px 8px gray; padding: 16px; }'],sol:'<style>\n  .banner { background: linear-gradient(to right, gold, orange); border-radius: 12px; box-shadow: 2px 4px 8px gray; padding: 16px; }\n</style>\n<div class="banner">Welcome!</div>'}},
/* 24 */
{t:['طراحی واکنش‌گرا','Responsive design'],
 s:[['صفحه‌ات باید روی گوشی و کامپیوتر خوب دیده بشه.\n۱) تگ meta viewport رو توی head بذار تا گوشی اندازه‌ی واقعی رو بفهمه.\n۲) به‌جای عرض ثابت از max-width و درصد استفاده کن.\n۳) با @media (max-width: 600px) { ... } برای صفحه‌های کوچیک قانون جدا بنویس.',
   'Your page must look good on phones and computers.\n1) Put the meta viewport tag in the head so phones know the real size.\n2) Use max-width and percentages instead of fixed widths.\n3) Write separate rules for small screens with @media (max-width: 600px) { ... }.',
   `<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>\n  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\n  .grid div { background: gold; padding: 14px; text-align: center; }\n  @media (max-width: 400px) {\n    .grid { grid-template-columns: 1fr; }\n    .grid div { background: lightgreen; }\n  }\n</style>\n<div class="grid"><div>1</div><div>2</div><div>3</div></div>`]],
 e:[{c:`<style>\n  img { max-width: 100%; height: auto; }\n  .wrap { max-width: 300px; margin: 0 auto; background: #eee; padding: 8px; }\n</style>\n<div class="wrap">\n  <p>This box never gets wider than 300px but can shrink.</p>\n</div>`,n:['max-width هم اجازه‌ی کوچیک شدن میده هم جلوی بزرگ شدن بیش‌ازحد رو می‌گیره.','max-width lets the box shrink but stops it from growing too large.']},
    {c:`<style>\n  .msg { background: palegreen; padding: 10px; }\n  @media (max-width: 500px) {\n    .msg { background: salmon; }\n  }\n</style>\n<div class="msg">Green on wide screens, red on narrow ones</div>`,n:['اگه پنجره‌ی پیش‌نمایش رو باریک کنی رنگ عوض میشه (روی گوشی امتحان کن).','The color changes when the window is narrow (try it on a phone).']}],
 q:{p:['توی head یه meta viewport بذار و با @media (max-width: 600px) کاری کن که روی صفحه‌های کوچیک رنگ پس‌زمینه‌ی body عوض بشه.','Add a meta viewport tag and use @media (max-width: 600px) to change the body background color on small screens.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>/<meta[^>]*name\s*=\s*"viewport"/i.test(c)&&/@media\s*\(\s*max-width\s*:\s*600px\s*\)\s*\{[\s\S]*body\s*\{[^}]*background/i.test(c),h:['<meta name="viewport" content="width=device-width, initial-scale=1">\n@media (max-width: 600px) { body { background: pink; } }','<meta name="viewport" content="width=device-width, initial-scale=1">\n@media (max-width: 600px) { body { background: pink; } }'],sol:'<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>\n  body { background: white; }\n  @media (max-width: 600px) {\n    body { background: pink; }\n  }\n</style>\n<p>Resize me!</p>'}},
/* 25 */
{t:['انیمیشن و transition','Transitions & animations'],
 s:[['transition باعث میشه تغییر یه ویژگی (مثلا رنگ) نرم و تدریجی اتفاق بیفته: transition: all 0.3s;\ntransform برای چرخوندن، بزرگ کردن و جابه‌جایی: rotate(10deg) ، scale(1.2) ، translateY(-5px).\nبرای انیمیشن‌های مداوم از @keyframes استفاده کن و با animation اجراش کن.',
   'transition makes a change of a property (like color) happen smoothly: transition: all 0.3s;\ntransform rotates, scales and moves: rotate(10deg), scale(1.2), translateY(-5px).\nFor continuous animations use @keyframes and run it with animation.',
   `<style>\n  .btn { background: gold; border: 0; padding: 12px 20px; border-radius: 10px; transition: all 0.3s; }\n  .btn:hover { background: orange; transform: scale(1.15) rotate(-3deg); }\n  .heart { font-size: 40px; display: inline-block; animation: beat 1s infinite; }\n  @keyframes beat { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }\n</style>\n<button class="btn">Hover me</button>\n<span class="heart">♥</span>`]],
 e:[{c:`<style>\n  .box { width: 50px; height: 50px; background: tomato; animation: slide 2s infinite alternate; }\n  @keyframes slide { from { margin-left: 0; } to { margin-left: 150px; } }\n</style>\n<div class="box"></div>`,n:['alternate باعث میشه انیمیشن رفت و برگشتی بشه.','alternate makes the animation go back and forth.']},
    {c:`<style>\n  .card { width: 100px; padding: 14px; background: #cde; transition: transform 0.25s, box-shadow 0.25s; }\n  .card:hover { transform: translateY(-6px); box-shadow: 0 8px 12px rgba(0,0,0,0.3); }\n</style>\n<div class="card">Lift me</div>`,n:['کارت موقع hover بالا میاد و سایه می‌گیره.','The card lifts and gets a shadow on hover.']}],
 q:{p:['یه button بساز که transition داشته باشه و موقع :hover با transform: scale بزرگ بشه.','Create a button with a transition that grows with transform: scale on :hover.'],st:'<style>\n  \n</style>\n',
    ok:(c,o,d)=>/<button[\s>]/i.test(c)&&/transition\s*:/.test(c)&&/:hover\s*\{[^}]*transform\s*:[^}]*scale\(/.test(c),h:['button { transition: all 0.3s; }\nbutton:hover { transform: scale(1.2); }','button { transition: all 0.3s; }\nbutton:hover { transform: scale(1.2); }'],sol:'<style>\n  button { transition: all 0.3s; padding: 10px 18px; }\n  button:hover { transform: scale(1.2); }\n</style>\n<button>Grow</button>'}},
/* 26 */
{t:['JavaScript توی صفحه','JavaScript in a page'],
 s:[['با تگ script می‌تونی توی HTML برنامه‌نویسی کنی. چند مفهوم کلیدی:\n• document.getElementById("id") ← پیدا کردن یه تگ\n• element.textContent = "..." ← عوض کردن متنش\n• element.addEventListener("click", تابع) ← واکنش به کلیک\nاسکریپت رو معمولا آخر body می‌ذاریم تا تگ‌ها آماده باشن. دکمه رو توی پیش‌نمایش بزن!',
   'The script tag lets you program inside HTML. Key ideas:\n• document.getElementById("id") ← find a tag\n• element.textContent = "..." ← change its text\n• element.addEventListener("click", function) ← react to a click\nWe usually put the script at the end of body so the tags are ready. Press the button in the preview!',
   `<p id="msg">Hello, hero!</p>\n<button id="btn">Change</button>\n<script>\n  var msg = document.getElementById("msg");\n  var btn = document.getElementById("btn");\n  btn.addEventListener("click", function () {\n    msg.textContent = "You clicked!";\n    msg.style.color = "crimson";\n  });\n<\/script>`]],
 e:[{c:`<h2 id="count">0</h2>\n<button id="plus">+1</button>\n<script>\n  var n = 0;\n  document.getElementById("plus").addEventListener("click", function () {\n    n = n + 1;\n    document.getElementById("count").textContent = n;\n  });\n<\/script>`,n:['هر کلیک n رو زیاد می‌کنه و متن h2 رو به‌روز می‌کنه.','Each click raises n and updates the h2 text.']},
    {c:`<button onclick="this.textContent = 'Clicked!'">Click me</button>\n<p id="t">...</p>\n<script>\n  document.getElementById("t").textContent = "Script ran at load";\n<\/script>`,n:['onclick یه راه کوتاه‌تره ولی addEventListener تمیزتره.','onclick is a shorter way but addEventListener is cleaner.']}],
 q:{p:['یه p با id="out" و یه button با id="go" بساز. با script کاری کن که با کلیک روی دکمه، متن p بشه Hello (از getElementById و addEventListener استفاده کن).','Create a p with id="out" and a button with id="go". With a script make clicking the button change the p text to Hello (use getElementById and addEventListener).'],st:'',
    ok:(c,o,d)=>/<p[^>]*id\s*=\s*"out"/i.test(c)&&/<button[^>]*id\s*=\s*"go"/i.test(c)&&/<script[\s>][\s\S]*getElementById[\s\S]*addEventListener[\s\S]*<\/script>/i.test(c)&&/Hello/.test(c.split(/<script/i)[1]||''),h:['<p id="out">...</p>\n<button id="go">Go</button>\n<script>\n  document.getElementById("go").addEventListener("click", function () {\n    document.getElementById("out").textContent = "Hello";\n  });\n<\/script>','<p id="out">...</p>\n<button id="go">Go</button>\n<script>\n  document.getElementById("go").addEventListener("click", function () {\n    document.getElementById("out").textContent = "Hello";\n  });\n<\/script>'],sol:'<p id="out">...</p>\n<button id="go">Go</button>\n<script>\n  document.getElementById("go").addEventListener("click", function () {\n    document.getElementById("out").textContent = "Hello";\n  });\n<\/script>'}},
/* 27 */
{t:['ساختن عناصر با JavaScript','Building elements with JavaScript'],
 s:[['می‌تونی با JS تگ جدید بسازی و به صفحه اضافه کنی:\n• document.createElement("li") ← ساختن تگ\n• li.textContent = "..." ← پر کردنش\n• list.appendChild(li) ← اضافه کردن به صفحه\nمقدار یه input رو هم با input.value می‌خونی. با اینا یه لیست کارهای زنده می‌سازیم!',
   'With JS you can create new tags and add them to the page:\n• document.createElement("li") ← create a tag\n• li.textContent = "..." ← fill it\n• list.appendChild(li) ← add it to the page\nYou read an input’s value with input.value. With these we build a live to-do list!',
   `<input id="task" placeholder="New quest">\n<button id="add">Add</button>\n<ul id="list"></ul>\n<script>\n  var input = document.getElementById("task");\n  var list = document.getElementById("list");\n  document.getElementById("add").addEventListener("click", function () {\n    if (input.value === "") return;\n    var li = document.createElement("li");\n    li.textContent = input.value;\n    list.appendChild(li);\n    input.value = "";\n  });\n<\/script>`]],
 e:[{c:`<ul id="heroes"></ul>\n<script>\n  var names = ["Arthur", "Ragnar", "Lia"];\n  var ul = document.getElementById("heroes");\n  for (var i = 0; i < names.length; i++) {\n    var li = document.createElement("li");\n    li.textContent = names[i];\n    ul.appendChild(li);\n  }\n<\/script>`,n:['یه حلقه برای هر اسم یه li می‌سازه.','A loop builds an li for every name.']},
    {c:`<input id="name" placeholder="Type here">\n<p>Hello, <b id="who">stranger</b>!</p>\n<script>\n  document.getElementById("name").addEventListener("input", function (e) {\n    document.getElementById("who").textContent = e.target.value || "stranger";\n  });\n<\/script>`,n:['رویداد input با هر حرفی که تایپ می‌کنی اجرا میشه.','The input event fires with every letter you type.']}],
 q:{p:['یه ul با id="list" و یه button بساز. با script کاری کن که با کلیک روی دکمه یه li جدید با createElement و appendChild به لیست اضافه بشه.','Create a ul with id="list" and a button. With a script make a click add a new li to the list using createElement and appendChild.'],st:'',
    ok:(c,o,d)=>/<ul[^>]*id\s*=\s*"list"/i.test(c)&&/<button[\s>]/i.test(c)&&/<script[\s>][\s\S]*createElement\([\s\S]*appendChild\([\s\S]*<\/script>/i.test(c)&&/addEventListener|onclick/.test(c),h:['<ul id="list"></ul>\n<button id="b">Add</button>\n<script>\n  document.getElementById("b").addEventListener("click", function () {\n    var li = document.createElement("li");\n    li.textContent = "new";\n    document.getElementById("list").appendChild(li);\n  });\n<\/script>','<ul id="list"></ul>\n<button id="b">Add</button>\n<script>\n  document.getElementById("b").addEventListener("click", function () {\n    var li = document.createElement("li");\n    li.textContent = "new";\n    document.getElementById("list").appendChild(li);\n  });\n<\/script>'],sol:'<ul id="list"></ul>\n<button id="b">Add</button>\n<script>\n  document.getElementById("b").addEventListener("click", function () {\n    var li = document.createElement("li");\n    li.textContent = "new";\n    document.getElementById("list").appendChild(li);\n  });\n<\/script>'}},
/* 28 */
{t:['دسترس‌پذیری و سئو','Accessibility & SEO'],
 s:[['یه صفحه‌ی حرفه‌ای برای همه قابل استفاده‌ست و توی گوگل هم پیدا میشه:\n• <html lang="fa"> زبان صفحه رو می‌گه\n• <title> و <meta name="description"> برای موتور جستجو\n• alt برای همه‌ی عکس‌ها (برای نابینایان و وقتی عکس لود نشه)\n• label برای ورودی‌ها و aria-label برای دکمه‌های بدون متن\n• تیترها به ترتیب (یه h1 و بعد h2 ...) و تگ‌های معنایی',
   'A professional page is usable by everyone and findable on Google:\n• <html lang="en"> declares the page language\n• <title> and <meta name="description"> for search engines\n• alt on every image (for blind users and when the image fails)\n• label for inputs and aria-label for buttons without text\n• headings in order (one h1, then h2 ...) and semantic tags',
   `<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>Code Kingdom</title>\n  <meta name="description" content="Learn to code by playing">\n</head>\n<body>\n  <header><h1>Code Kingdom</h1></header>\n  <main>\n    <img src="hero.png" alt="A smiling knight" width="60">\n    <button aria-label="Close menu">X</button>\n  </main>\n</body>\n</html>`]],
 e:[{c:`<label for="q">Search</label>\n<input id="q" type="search">\n<button aria-label="Search">🔍</button>`,n:['دکمه فقط یه ایموجی داره؛ aria-label اسمش رو به صفحه‌خوان میگه.','The button only has an emoji; aria-label tells screen readers its name.']},
    {c:`<h1>Main title</h1>\n<h2>Section</h2>\n<h3>Part</h3>\n<img src="hero.png" alt="" width="40">\n<p>alt="" یعنی عکس تزئینیه.</p>`,n:['alt خالی به صفحه‌خوان می‌گه عکس تزئینیه و ردش کنه.','An empty alt tells screen readers the image is decorative and to skip it.']}],
 q:{p:['یه صفحه‌ی کامل بساز که توی html یه lang داشته باشه، یه title و یه meta description توی head، و توی body یه عکس img با alt داشته باشه.','Build a full page whose html has a lang attribute, whose head has a title and a meta description, and whose body has an img with alt text.'],st:'',
    ok:(c,o,d)=>/<html[^>]*\blang\s*=\s*"[a-z-]+"/i.test(c)&&/<title>[^<]+<\/title>/i.test(c)&&/<meta[^>]*name\s*=\s*"description"[^>]*content\s*=\s*"[^"]+"/i.test(c)&&/<img[^>]*\balt\s*=\s*"[^"]+"/i.test(c),h:['<html lang="en">\n<head><title>..</title><meta name="description" content=".."></head>\n<body><img src="hero.png" alt="..."></body>\n</html>','<html lang="en">\n<head><title>..</title><meta name="description" content=".."></head>\n<body><img src="hero.png" alt="..."></body>\n</html>'],sol:'<html lang="en">\n<head>\n  <title>My Page</title>\n  <meta name="description" content="A page about my hero">\n</head>\n<body>\n  <h1>My hero</h1>\n  <img src="hero.png" alt="My hero" width="60">\n</body>\n</html>'}}
);

/* ================= ADVANCED NODE.JS (lessons 14-25) ================= */
LESSONS.node.push(
/* 14 */
{t:['اولین سرور با Express','Your first Express server'],
 s:[['Express محبوب‌ترین فریم‌ورک Node برای ساختن سرور وبه. (توی پروژه‌ی واقعی اول npm install express می‌زنی؛ اینجا آماده‌ست.)\napp.get("/مسیر", (req, res) => ...) یعنی «وقتی کسی این مسیر رو خواست، این تابع جواب بده». res.send متن می‌فرسته.\napp.listen(پورت) سرور رو روشن می‌کنه.\nاینجا چند درخواست آزمایشی خودکار به سرورت فرستاده میشه و جواب‌هاشون رو می‌بینی.',
   'Express is Node’s most popular web framework. (In a real project you first run npm install express; here it is ready.)\napp.get("/path", (req, res) => ...) means “when someone asks for this path, this function answers”. res.send sends text.\napp.listen(port) turns the server on.\nHere a few test requests are sent to your server automatically and you see the answers.',
   `const express = require('express');\nconst app = express();\n\napp.get('/', (req, res) => res.send('Welcome, hero!'));\napp.get('/about', (req, res) => res.send('About the kingdom'));\n\napp.listen(3000, () => console.log('Server on port 3000'));`]],
 e:[{c:`const express = require('express');\nconst app = express();\napp.get('/status', (req, res) => {\n  res.send('All systems go');\n});\napp.listen(4000, () => console.log('listening'));`,n:['مسیری که تعریف نکردی (/missing) خودکار ۴۰۴ میگیره.','A path you did not define (/missing) automatically gets a 404.']},
    {c:`const express = require('express');\nconst app = express();\napp.get('/', (req, res) => {\n  res.status(200).send('<h1>Home</h1>');\n});\napp.get('/teapot', (req, res) => {\n  res.status(418).send('I am a teapot');\n});\napp.listen(3000);`,n:['res.status کد وضعیت رو تنظیم می‌کنه؛ ۴۱۸ یه شوخی معروفه!','res.status sets the status code; 418 is a famous joke!']}],
 q:{p:['یه سرور Express بساز که روی مسیر /hero متن Arthur رو بفرسته. (سرور روی پورت ۳۰۰۰ گوش بده.)','Build an Express server that sends the text Arthur on the path /hero. (Listen on port 3000.)'],st:"const express = require('express');\nconst app = express();\n\n",
    ok:(c,o)=>/GET \/hero \[200\] Arthur/.test(o)&&/app\.get\(\s*['"]\/hero['"]/.test(c),h:["app.get('/hero', (req, res) => res.send('Arthur'));\napp.listen(3000);","app.get('/hero', (req, res) => res.send('Arthur'));\napp.listen(3000);"],sol:"const express = require('express');\nconst app = express();\n\napp.get('/hero', (req, res) => res.send('Arthur'));\napp.listen(3000, () => console.log('up'));"}},
/* 15 */
{t:['پارامتر و کوئری در مسیر','Route params & query'],
 s:[['مسیر می‌تونه بخش متغیر داشته باشه: /hero/:id  ← مقدارش توی req.params.id هست (مثلا /hero/7).\nبعد از ؟ توی آدرس «کوئری» میاد: /search?name=Lia ← توی req.query.name.\nاینجا آدرس‌های آزمایشی خودکار ساخته میشن: برای :id مقدار 1 و برای بقیه Arthur.',
   'A path can have a variable part: /hero/:id ← its value is in req.params.id (like /hero/7).\nAfter a ? in the address comes the “query”: /search?name=Lia ← in req.query.name.\nTest addresses are built automatically here: 1 for :id and Arthur for other names.',
   `const express = require('express');\nconst app = express();\n\napp.get('/hero/:id', (req, res) => {\n  res.send('Hero number ' + req.params.id);\n});\n\napp.listen(3000);`]],
 e:[{c:`const express = require('express');\nconst app = express();\napp.get('/greet/:name', (req, res) => {\n  res.send('Hello, ' + req.params.name + '!');\n});\napp.listen(3000);`,n:['هر اسمی که بعد از /greet/ بیاد توی name میشینه.','Whatever follows /greet/ lands in name.']},
    {c:`const express = require('express');\nconst app = express();\napp.get('/search', (req, res) => {\n  res.send('You searched for ' + (req.query.q || 'nothing'));\n});\napp.listen(3000, async () => {\n  const r = await fetch('http://localhost:3000/search?q=dragons');\n  console.log(await r.text());\n  const r2 = await fetch('http://localhost:3000/search');\n  console.log(await r2.text());\n});`,n:['با fetch خودمون به سرور خودمون درخواست می‌زنیم و کوئری رو می‌فرستیم.','With fetch we call our own server and send a query.']}],
 q:{p:['مسیر /greet/:name بساز که بگه «Hello, اسم» (مثلا Hello, Arthur). برای اسم از req.params.name استفاده کن.','Create the route /greet/:name that answers “Hello, name” (for example Hello, Arthur). Use req.params.name.'],st:"const express = require('express');\nconst app = express();\n\n",
    ok:(c,o)=>/GET \/greet\/Arthur \[200\] Hello, Arthur/.test(o)&&/req\.params\.name/.test(c),h:["app.get('/greet/:name', (req, res) => {\n  res.send('Hello, ' + req.params.name);\n});\napp.listen(3000);","app.get('/greet/:name', (req, res) => {\n  res.send('Hello, ' + req.params.name);\n});\napp.listen(3000);"],sol:"const express = require('express');\nconst app = express();\n\napp.get('/greet/:name', (req, res) => {\n  res.send('Hello, ' + req.params.name);\n});\napp.listen(3000);"}},
/* 16 */
{t:['Middleware و JSON','Middleware & JSON'],
 s:[['Middleware تابعیه که بین درخواست و جواب قرار می‌گیره: (req, res, next). باید یا جواب بده یا next() رو صدا بزنه تا نوبت بعدی بره.\napp.use(express.json()) باعث میشه بدنه‌ی JSON درخواست‌ها توی req.body خونده بشه.\nres.json(شیء) به‌جای متن، JSON می‌فرسته. (درخواست‌های POST آزمایشی با بدنه‌ی {"name":"Arthur","level":1} فرستاده میشن.)',
   'Middleware is a function that sits between the request and the answer: (req, res, next). It must either answer or call next() so the next one gets its turn.\napp.use(express.json()) makes JSON request bodies readable in req.body.\nres.json(object) sends JSON instead of text. (Test POST requests are sent with the body {"name":"Arthur","level":1}.)',
   `const express = require('express');\nconst app = express();\napp.use(express.json());\n\napp.use((req, res, next) => {\n  console.log('LOG', req.method, req.url);\n  next();\n});\n\napp.get('/status', (req, res) => res.json({ ok: true }));\napp.post('/heroes', (req, res) => {\n  res.status(201).json({ saved: req.body.name });\n});\n\napp.listen(3000);`]],
 e:[{c:`const express = require('express');\nconst app = express();\nconst guard = (req, res, next) => {\n  if (req.url.startsWith('/secret')) {\n    return res.status(403).send('No entry');\n  }\n  next();\n};\napp.use(guard);\napp.get('/', (req, res) => res.send('open'));\napp.get('/secret', (req, res) => res.send('treasure'));\napp.listen(3000);`,n:['middleware می‌تونه جلوی رسیدن درخواست به مسیر رو بگیره (۴۰۳ = ممنوع).','A middleware can stop a request before it reaches the route (403 = forbidden).']},
    {c:`const express = require('express');\nconst app = express();\napp.use(express.json());\napp.post('/echo', (req, res) => {\n  res.json({ you_sent: req.body, length: JSON.stringify(req.body).length });\n});\napp.listen(3000);`,n:['بدنه‌ی درخواست رو برمی‌گردونیم تا ببینی سرور چی دریافت کرده.','We send the request body back so you see what the server received.']}],
 q:{p:['یه middleware بنویس که برای هر درخواست «Request: متد آدرس» رو چاپ کنه (مثل Request: GET /) و next() رو صدا بزنه. بعد مسیر / که Home رو می‌فرسته رو بساز.','Write a middleware that prints “Request: method url” for every request (like Request: GET /) and calls next(). Then add the route / that sends Home.'],st:"const express = require('express');\nconst app = express();\n\n",
    ok:(c,o)=>/Request: GET \//.test(o)&&/GET \/ \[200\] Home/.test(o)&&/next\(\)/.test(c),h:["app.use((req, res, next) => {\n  console.log('Request: ' + req.method + ' ' + req.url);\n  next();\n});","app.use((req, res, next) => {\n  console.log('Request: ' + req.method + ' ' + req.url);\n  next();\n});"],sol:"const express = require('express');\nconst app = express();\n\napp.use((req, res, next) => {\n  console.log('Request: ' + req.method + ' ' + req.url);\n  next();\n});\napp.get('/', (req, res) => res.send('Home'));\napp.listen(3000);"}},
/* 17 */
{t:['ساخت REST API','Building a REST API'],
 s:[['REST API یعنی هر «چیز» (منبع) یه آدرس داره و با متدهای HTTP کار می‌کنیم:\nGET خوندن ، POST ساختن ، PUT تغییر ، DELETE حذف.\nمثلا /heroes لیست همه و /heroes/1 فقط قهرمان شماره ۱.\nبرای ذخیره‌ی داده فعلا از یه آرایه‌ی معمولی توی حافظه استفاده می‌کنیم.',
   'A REST API gives every “thing” (resource) an address and uses HTTP methods:\nGET read, POST create, PUT change, DELETE remove.\nFor example /heroes is the list and /heroes/1 is just hero number 1.\nFor storage we simply use a normal array in memory for now.',
   `const express = require('express');\nconst app = express();\napp.use(express.json());\n\nlet heroes = [{ id: 1, name: 'Lia' }];\n\napp.get('/heroes', (req, res) => res.json(heroes));\n\napp.get('/heroes/:id', (req, res) => {\n  const h = heroes.find(x => x.id === Number(req.params.id));\n  if (!h) return res.status(404).json({ error: 'not found' });\n  res.json(h);\n});\n\napp.post('/heroes', (req, res) => {\n  const h = { id: heroes.length + 1, name: req.body.name };\n  heroes.push(h);\n  res.status(201).json(h);\n});\n\napp.delete('/heroes/:id', (req, res) => {\n  heroes = heroes.filter(x => x.id !== Number(req.params.id));\n  res.json({ deleted: true });\n});\n\napp.listen(3000);`]],
 e:[{c:`const express = require('express');\nconst app = express();\nconst quests = [{ id: 1, title: 'Dragon', done: false }];\napp.get('/quests', (req, res) => res.json(quests));\napp.put('/quests/:id', (req, res) => {\n  const q = quests.find(x => x.id === Number(req.params.id));\n  q.done = true;\n  res.json(q);\n});\napp.listen(3000);`,n:['PUT برای تغییر دادن یه منبع موجوده.','PUT is for changing an existing resource.']},
    {c:`const express = require('express');\nconst app = express();\napp.get('/heroes/:id', (req, res) => {\n  const id = Number(req.params.id);\n  if (Number.isNaN(id)) return res.status(400).json({ error: 'bad id' });\n  res.json({ id });\n});\napp.listen(3000);`,n:['۴۰۰ یعنی درخواست اشتباه بوده؛ ورودی رو همیشه چک کن.','400 means a bad request; always validate input.']}],
 q:{p:['یه مسیر GET /quests بساز که آرایه‌ی quests رو به‌صورت JSON بفرسته.','Create a GET /quests route that sends the quests array as JSON.'],st:"const express = require('express');\nconst app = express();\nconst quests = [\n  { id: 1, title: 'Slay the dragon' },\n  { id: 2, title: 'Find the grail' }\n];\n\n",
    ok:(c,o)=>/GET \/quests \[200\] \[\{"id":1,"title":"Slay the dragon"\},\{"id":2,"title":"Find the grail"\}\]/.test(o),h:["app.get('/quests', (req, res) => res.json(quests));\napp.listen(3000);","app.get('/quests', (req, res) => res.json(quests));\napp.listen(3000);"],sol:"const express = require('express');\nconst app = express();\nconst quests = [\n  { id: 1, title: 'Slay the dragon' },\n  { id: 2, title: 'Find the grail' }\n];\n\napp.get('/quests', (req, res) => res.json(quests));\napp.listen(3000);"}},
/* 18 */
{t:['خطاها و کدهای وضعیت','Errors & status codes'],
 s:[['کد وضعیت HTTP نتیجه رو می‌گه:\n۲۰۰ موفق ، ۲۰۱ ساخته شد ، ۴۰۰ درخواست اشتباه ، ۴۰۴ پیدا نشد ، ۵۰۰ خطای سرور.\nاگه توی یه مسیر خطا اتفاق بیفته، Express میره سراغ «middleware خطا» که چهار ورودی داره: (err, req, res, next). اونجا یه جواب مرتب می‌فرستیم.',
   'HTTP status codes tell the result:\n200 OK, 201 created, 400 bad request, 404 not found, 500 server error.\nIf an error happens in a route, Express jumps to the “error middleware” that has four inputs: (err, req, res, next). There we send a tidy answer.',
   `const express = require('express');\nconst app = express();\n\napp.get('/boom', (req, res) => {\n  throw new Error('Dragon attack!');\n});\n\napp.use((err, req, res, next) => {\n  console.log('Handled:', err.message);\n  res.status(500).json({ error: err.message });\n});\n\napp.listen(3000);`]],
 e:[{c:`const express = require('express');\nconst app = express();\napp.get('/hero/:id', (req, res, next) => {\n  if (req.params.id !== '1') {\n    const err = new Error('No such hero');\n    err.status = 404;\n    return next(err);\n  }\n  res.json({ id: 1 });\n});\napp.use((err, req, res, next) => {\n  res.status(err.status || 500).json({ error: err.message });\n});\napp.listen(3000);`,n:['next(err) خطا رو به middleware خطا می‌فرسته.','next(err) sends the error to the error middleware.']},
    {c:`const express = require('express');\nconst app = express();\napp.get('/', (req, res) => res.send('home'));\napp.use((req, res) => {\n  res.status(404).json({ error: 'Page not found' });\n});\napp.listen(3000);`,n:['آخر همه‌ی مسیرها یه middleware برای «هیچ‌کدوم نخورد» (۴۰۴ سفارشی) می‌ذاریم.','At the end we add a catch-all middleware for “nothing matched” (a custom 404).']}],
 q:{p:['مسیر /danger رو بساز که یه Error با پیام Oops بندازه، و یه middleware خطا (با چهار ورودی) که جواب ۵۰۰ و JSON به شکل {"error":"Oops"} بفرسته.','Create the route /danger that throws an Error with the message Oops, and an error middleware (four inputs) that answers 500 with JSON like {"error":"Oops"}.'],st:"const express = require('express');\nconst app = express();\n\n",
    ok:(c,o)=>/GET \/danger \[500\] \{"error":"Oops"\}/.test(o)&&/\(\s*err\s*,\s*req\s*,\s*res\s*,\s*next\s*\)/.test(c),h:["app.get('/danger', (req, res) => { throw new Error('Oops'); });\napp.use((err, req, res, next) => {\n  res.status(500).json({ error: err.message });\n});\napp.listen(3000);","app.get('/danger', (req, res) => { throw new Error('Oops'); });\napp.use((err, req, res, next) => {\n  res.status(500).json({ error: err.message });\n});\napp.listen(3000);"],sol:"const express = require('express');\nconst app = express();\n\napp.get('/danger', (req, res) => { throw new Error('Oops'); });\napp.use((err, req, res, next) => {\n  res.status(500).json({ error: err.message });\n});\napp.listen(3000);"}},
/* 19 */
{t:['fetch و صدا زدن API','fetch & calling an API'],
 s:[['fetch(آدرس) یه Promise برمی‌گردونه که یه «پاسخ» میده: response.ok (موفق بود؟) ، response.status ، await response.json() (بدنه به‌صورت شیء).\nبرای ارسال داده: fetch(url, { method: "POST", headers: {...}, body: JSON.stringify(...) }).\nاینجا یه API تمرینی داریم: https://api.codeflex.dev/heroes (و /hero/1 ، /quests ، /status).',
   'fetch(url) returns a Promise that gives a “response”: response.ok (did it work?), response.status, await response.json() (the body as an object).\nTo send data: fetch(url, { method: "POST", headers: {...}, body: JSON.stringify(...) }).\nHere we have a practice API: https://api.codeflex.dev/heroes (and /hero/1, /quests, /status).',
   `async function main() {\n  const res = await fetch('https://api.codeflex.dev/heroes');\n  console.log(res.ok, res.status);\n  const heroes = await res.json();\n  console.log(heroes.length);\n  for (const h of heroes) {\n    console.log(h.name, 'level', h.level);\n  }\n}\nmain();`]],
 e:[{c:`async function main() {\n  const res = await fetch('https://api.codeflex.dev/nothing');\n  console.log(res.status, res.ok);\n  if (!res.ok) {\n    console.log('Request failed');\n  }\n}\nmain();`,n:['fetch برای ۴۰۴ خطا نمیندازه؛ باید خودت response.ok رو چک کنی.','fetch does not throw on a 404; you must check response.ok yourself.']},
    {c:`async function main() {\n  const res = await fetch('https://api.codeflex.dev/heroes', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ name: 'Mira', level: 1 })\n  });\n  console.log(res.status);\n  console.log(await res.json());\n}\nmain();`,n:['POST با بدنه‌ی JSON؛ سرور شماره‌ی جدید (id) رو اضافه می‌کنه.','A POST with a JSON body; the server adds a new id.']}],
 q:{p:['از https://api.codeflex.dev/hero/1 با fetch قهرمان رو بگیر و فقط اسمش (name) رو چاپ کن.','Fetch the hero from https://api.codeflex.dev/hero/1 with fetch and print only its name.'],st:'',
    ok:(c,o)=>o.trim()==='Arthur'&&/fetch\(/.test(c)&&/await|\.then/.test(c),h:["async function main() {\n  const res = await fetch('https://api.codeflex.dev/hero/1');\n  const hero = await res.json();\n  console.log(hero.name);\n}\nmain();","async function main() {\n  const res = await fetch('https://api.codeflex.dev/hero/1');\n  const hero = await res.json();\n  console.log(hero.name);\n}\nmain();"],sol:"async function main() {\n  const res = await fetch('https://api.codeflex.dev/hero/1');\n  const hero = await res.json();\n  console.log(hero.name);\n}\nmain();"}},
/* 20 */
{t:['فایل و پوشه با fs.promises','Files & folders with fs.promises'],
 s:[['نسخه‌ی Promise ماژول fs با async/await خیلی تمیزتره: require("fs").promises\nکارهای مهم: mkdir (ساخت پوشه) ، writeFile ، readFile ، readdir (لیست فایل‌های یه پوشه) ، stat (اطلاعات) ، unlink (حذف فایل).\n(اینجا فایل‌ها فقط توی حافظه‌ن و بعد از اجرا پاک میشن.)',
   'The Promise version of the fs module is much tidier with async/await: require("fs").promises\nKey jobs: mkdir (make a folder), writeFile, readFile, readdir (list a folder), stat (info), unlink (delete a file).\n(Files here live only in memory and vanish after the run.)',
   `const fs = require('fs').promises;\n\nasync function main() {\n  await fs.mkdir('saves');\n  await fs.writeFile('saves/slot1.json', JSON.stringify({ gold: 50 }));\n  await fs.writeFile('saves/slot2.json', '{}');\n  console.log(await fs.readdir('saves'));\n  const raw = await fs.readFile('saves/slot1.json', 'utf8');\n  console.log(JSON.parse(raw).gold);\n  await fs.unlink('saves/slot2.json');\n  console.log(await fs.readdir('saves'));\n}\nmain();`]],
 e:[{c:`const fs = require('fs').promises;\nasync function main() {\n  try {\n    await fs.readFile('missing.txt', 'utf8');\n  } catch (err) {\n    console.log(err.code);\n  }\n}\nmain();`,n:['وقتی فایل نیست کد خطا ENOENT هست؛ با try/catch بگیرش.','When the file is missing the error code is ENOENT; catch it with try/catch.']},
    {c:`const fs = require('fs').promises;\nasync function main() {\n  await fs.writeFile('log.txt', 'line 1\\n');\n  await fs.appendFile('log.txt', 'line 2\\n');\n  const text = await fs.readFile('log.txt', 'utf8');\n  console.log(text.trim().split('\\n').length);\n  const info = await fs.stat('log.txt');\n  console.log(info.isFile(), info.size);\n}\nmain();`,n:['appendFile به انتهای فایل اضافه می‌کنه و stat اطلاعات فایل رو میده.','appendFile adds to the end and stat gives file info.']}],
 q:{p:['با fs.promises یه پوشه به اسم saves بساز، فایل slot1.json رو توش بنویس و با readdir لیست پوشه رو چاپ کن.','With fs.promises make a folder called saves, write slot1.json inside it and print the folder listing with readdir.'],st:"const fs = require('fs').promises;\n\n",
    ok:(c,o)=>o.trim()==="[ 'slot1.json' ]"&&/mkdir/.test(c)&&/readdir/.test(c),h:["async function main() {\n  await fs.mkdir('saves');\n  await fs.writeFile('saves/slot1.json', '{}');\n  console.log(await fs.readdir('saves'));\n}\nmain();","async function main() {\n  await fs.mkdir('saves');\n  await fs.writeFile('saves/slot1.json', '{}');\n  console.log(await fs.readdir('saves'));\n}\nmain();"],sol:"const fs = require('fs').promises;\n\nasync function main() {\n  await fs.mkdir('saves');\n  await fs.writeFile('saves/slot1.json', '{}');\n  console.log(await fs.readdir('saves'));\n}\nmain();"}},
/* 21 */
{t:['تست با assert','Testing with assert'],
 s:[['برنامه‌نویس‌های حرفه‌ای کدشون رو تست می‌کنن. ماژول assert که با Node میاد کمک می‌کنه:\nassert.strictEqual(واقعی, انتظار) ← دقیقا برابر باشن\nassert.deepStrictEqual(آبجکتA, آبجکتB) ← محتوای آبجکت/آرایه برابر باشه\nassert.throws(() => ...) ← باید خطا بده\nاگه تست رد بشه یه AssertionError می‌افته؛ اگه درست باشه هیچی نمیگه!',
   'Professional programmers test their code. The assert module that ships with Node helps:\nassert.strictEqual(actual, expected) ← exactly equal\nassert.deepStrictEqual(objA, objB) ← same contents in objects/arrays\nassert.throws(() => ...) ← must throw an error\nIf a test fails an AssertionError is thrown; if it passes it says nothing!',
   `const assert = require('assert');\n\nfunction add(a, b) {\n  return a + b;\n}\n\nassert.strictEqual(add(2, 3), 5);\nassert.deepStrictEqual({ a: [1, 2] }, { a: [1, 2] });\nassert.throws(() => { throw new Error('x'); });\nconsole.log('All tests passed');\n\ntry {\n  assert.strictEqual(add(1, 1), 3);\n} catch (e) {\n  console.log(e.name);\n}`]],
 e:[{c:`const assert = require('assert');\nfunction test(name, fn) {\n  try {\n    fn();\n    console.log('PASS', name);\n  } catch (e) {\n    console.log('FAIL', name);\n  }\n}\ntest('math works', () => assert.strictEqual(1 + 1, 2));\ntest('math breaks', () => assert.strictEqual(1 + 1, 3));`,n:['یه «اجراکننده‌ی تست» کوچیک: هر تست رو امتحان می‌کنه و نتیجه رو چاپ می‌کنه.','A tiny “test runner”: it tries each test and prints the result.']},
    {c:`const assert = require('assert');\nconst heroes = ['Lia', 'Arthur'];\nassert.ok(heroes.includes('Lia'));\nassert.notStrictEqual(heroes.length, 0);\nassert.deepStrictEqual([...heroes].sort(), ['Arthur', 'Lia']);\nconsole.log('ok');`,n:['assert.ok بررسی می‌کنه چیزی درسته (truthy).','assert.ok checks that something is truthy.']}],
 q:{p:['تابع double(n) بنویس که n رو دو برابر کنه. با assert.strictEqual تست کن که double(4) برابر ۸ باشه و بعد All tests passed چاپ کن.','Write double(n) that doubles n. Use assert.strictEqual to check double(4) equals 8, then print All tests passed.'],st:"const assert = require('assert');\n\n",
    ok:(c,o)=>o.trim()==='All tests passed'&&/assert\.strictEqual\(/.test(c)&&/double/.test(c),h:["function double(n) {\n  return n * 2;\n}\nassert.strictEqual(double(4), 8);\nconsole.log('All tests passed');","function double(n) {\n  return n * 2;\n}\nassert.strictEqual(double(4), 8);\nconsole.log('All tests passed');"],sol:"const assert = require('assert');\n\nfunction double(n) {\n  return n * 2;\n}\nassert.strictEqual(double(4), 8);\nconsole.log('All tests passed');"}},
/* 22 */
{t:['حلقه‌ی رویداد (Event Loop)','The event loop'],
 s:[['Node فقط یه رشته داره ولی با «حلقه‌ی رویداد» کارها رو مدیریت می‌کنه. ترتیب اجرا:\n۱) همه‌ی کد معمولی (همگام)\n۲) process.nextTick\n۳) Promise ها (.then / await)\n۴) تایمرها (setTimeout)\nپس یه setTimeout با ۰ میلی‌ثانیه هم همیشه بعد از Promise ها اجرا میشه!',
   'Node has just one thread but it manages work with the “event loop”. The order of running:\n1) all normal (synchronous) code\n2) process.nextTick\n3) Promises (.then / await)\n4) timers (setTimeout)\nSo even a setTimeout of 0 ms always runs after Promises!',
   `console.log('1: sync start');\n\nsetTimeout(() => console.log('4: timeout'), 0);\n\nPromise.resolve().then(() => console.log('3: promise'));\n\nprocess.nextTick(() => console.log('2: nextTick'));\n\nconsole.log('1: sync end');`]],
 e:[{c:`setTimeout(() => console.log('B (50ms)'), 50);\nsetTimeout(() => console.log('A (10ms)'), 10);\nsetTimeout(() => console.log('C (0ms)'), 0);\nconsole.log('start');`,n:['تایمرها بر اساس مدت‌شون مرتب میشن نه بر اساس ترتیب نوشتن.','Timers are ordered by their delay, not by the order you wrote them.']},
    {c:`async function main() {\n  console.log('a');\n  await null;\n  console.log('c');\n}\nmain();\nconsole.log('b');`,n:['بعد از await بقیه‌ی تابع به «بعد از کد همگام» موکول میشه.','After await the rest of the function is postponed until after the synchronous code.']}],
 q:{p:['کدی بنویس که به این ترتیب چاپ کنه: sync ، بعد promise ، بعد timeout. (از console.log معمولی، یه Promise.resolve().then و یه setTimeout با ۰ استفاده کن؛ ترتیب نوشتن رو عمداً بهم بریز!)','Write code that prints in this order: sync, then promise, then timeout. (Use a plain console.log, a Promise.resolve().then and a setTimeout of 0; write them in a scrambled order on purpose!)'],st:'',
    ok:(c,o)=>o.trim()==='sync\npromise\ntimeout'&&/setTimeout/.test(c)&&/Promise/.test(c),h:["setTimeout(() => console.log('timeout'), 0);\nPromise.resolve().then(() => console.log('promise'));\nconsole.log('sync');","setTimeout(() => console.log('timeout'), 0);\nPromise.resolve().then(() => console.log('promise'));\nconsole.log('sync');"],sol:"setTimeout(() => console.log('timeout'), 0);\nPromise.resolve().then(() => console.log('promise'));\nconsole.log('sync');"}},
