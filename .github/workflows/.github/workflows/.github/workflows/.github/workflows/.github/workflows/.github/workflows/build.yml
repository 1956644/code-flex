name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make folders
        run: mkdir -p www/audio assets

      - name: Copy web file
        run: cp index.html www/index.html

      - name: Copy music
        run: cp haggstrom.mp3 subwoofer-lullaby.mp3 minecraft.mp3 www/audio/

      - name: Copy icons
        run: cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons (optional step)
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#1a1033' --iconBackgroundColorDark '#1a1033'

      - name: Lock the app to portrait
        run: sed -i 's/<activity/
